      s_chat2:{ chapter:'—— 中途 · 搭档的消息 ——', chatbeat:true,
        title:'📱 消息', sub:'任务进行中 · 第二条',
        story:()=>`你们停在岔口一处凹进去的检修位换气。霜在脚下积成薄薄一层，踩上去吱吱作响，像走在碎玻璃上。你摘了手套往手心里哈气，指尖半天没有知觉，只好攥住又松开，再攥住。你数了数身上还剩的东西：两支冷焰棒、半壶水、一小盒向导素。<br><br>搭档背对着你守在来路，肩膀一下一下起伏。你能看出那份呼吸是调过的——太长、太平，不是累的人该有的样子。你在简报室里见过一次这种呼吸，那是一个准备把自己当消耗品的人；你以前只在别人身上见过。<br><br>频道里还是杂音，一层比一层厚，像潮水退下去以后留下的滩涂：什么都没有，却处处是痕。你想说点什么，又觉得说什么都像在道别。<br><br>就在这时，口袋里的终端震了一下。`,
        body:[{t:()=>`终端又震了一下。这次弹出来的不是发给你的东西——是搭档 <b>${C().partnerName}</b> 写给白塔的自评，错发到了你的频道。<br><br>「……暴露时长偏长，精神阈值预估剩余三成。若需取舍，请优先保全突击核心。以上，不必告知对方。」`},
              {t:'消息在两秒后被撤回了。屏幕上只剩一行小字：已撤回。<br><br>他/她就在你半步之后，呼吸很稳，稳得像排练过。'},
              {flav:'那句话里的「突击核心」，说的是你。'}],
        opts:[
          {type:'answer',ask:'要戳破吗？说点什么：',
            placeholder:'例如：「三成也够用。」',
            branches:{soothe:K_SOOTHE, force:K_FORCE, flee:K_FLEE, call:K_CALL},
            route:{soothe:'s_sos', force:'s_sos', flee:'s_sos', call:'s_sos', default:'s_sos'},
            react:(t,k)=>{
              if(k==='force') { bumpAff(mAff(k)); return `你头也不回地丢下一句：「我没让你替我算账。」<br>身后的呼吸顿了一秒，然后跟上了你的步子——比刚才更近。`; }
              if(k==='flee') { bumpAff(mAff(k)); return `你什么也没说，只把终端塞回口袋，用力按平了那一角。<br>可你走得比刚才慢了一点。他/她跟上来的时候，什么也没问。`; }
              bumpAff(mAff(k)); return `你说：「${t||'三成也够用，别替我做取舍。' }」<br>身后安静了两秒，然后那个人轻轻笑了一声：「……被你看见了。」那声笑很轻，却把整条管网的冷顶开了一道缝。`;
            }}
        ] },
      s_sos:{ chapter:'第四章 · 求援', story:()=>`岔口尽头传来金属被撕开的动静。隔着三层管壁，仍像有人在你耳朵里砸门——一下，两下，第三下的时候，你脚下的积水跟着抖出了圈。<br><br>终端的应急频道跳出碎片：秦峥的封锁组被压在<b>东口的泵房</b>里，两人挂彩，退路正在被碾平。这条消息不是发给你的，是发给「所有还在动的人」——那意味着白塔那边，已经没人能回他。碎片最后缀着半句没发完的话：「……门撑不——」<br><br>阮清芜的屏障还撑着，可她的声音第一次出现了裂缝：「下面谁离东口最近？我撑不了多久。」你听得出她在说这句话时，正咬着什么东西。<br><br>两条路：回身救人，或者继续往里，把巢心按死。窗口只开一次。`,
        title:'外围顶不住了', sub:'战场抉择',
        body:[{t:()=>`搭档 <b>${C().partnerName}</b> 没有催你。他/她只是把刃换到了顺手的那一侧——那是准备打，也是准备跑。`},
              {flav:'联合行动最难的一秒，是所有人同时等你说话。'}],
        opts:[
          {type:'goto',to:'s_rescue',ico:'🩸',label:'回身去救：东口一个都不能丢',hint:'救援线 · 巢心的窗口会关上',onPick:()=>{C().savedOuter=true;addMLog('🩸 你选择回身。巢心交给搭档，东口交给你。');}},
          {type:'goto',to:'s_mid',ico:'🪓',label:'不回身：继续凿穿',hint:'突击线 · 你赌他们撑得住',onPick:()=>{C().leftOuter=true;addMLog('🪓 你没有回头。你把所有人的命，压在自己这一凿上。');}},
          {type:'answer',ask:'按着应急频道回一句：',
            placeholder:'例如：「撑住，我马上到。」',
            branches:{soothe:K_SOOTHE, force:K_FORCE, flee:K_FLEE, call:K_CALL},
            route:{soothe:'s_rescue', force:'s_mid', flee:'s_mid', call:'s_rescue', default:'s_rescue'},
            react:(t,k)=>{
              bumpAff(mAff(k));
              if(k==='force') return `你回：「东口丢了就丢了，我把巢心按死就都干净了。」<br>频道里静了一瞬，秦峥骂了句很难听的话，然后挂了。`;
              if(k==='flee') return `你回：「再撑三分钟，我看看这边能不能快一点。」<br>「三分钟。」阮清芜应得很轻，「我记着了。」`;
              return `你回：「${t||'撑住，我马上到。' }」<br>频道那头喘着气笑了一下：「……听见了。这声音，够我们再撑一会儿。」`;
            }}
        ] },
      s_rescue:{ chapter:'第四章 · 求援', story:()=>`你带着搭档逆着风向跑。通道越来越矮，最后一段要侧着肩膀才能挤过去，霜蹭在护具上沙沙地响，像有什么东西跟在后面走。<br><br>泵房的门被压成了弧形，秦峥用半边身子顶着，另一只手还攥着封锁器的开关。他的左臂垂着，袖口一圈暗红，那颜色在冷光里几乎是黑的；门里面还有一个人靠墙坐着，正用牙咬开一卷绷带。<br><br>「谁让你们回来的！」他吼，声音比砂纸还哑，「巢心——」<br><br>「巢心跑不了。」你把他的手从开关上掰下来，「你也别死在这儿。」里面那个哨兵抬头看了你一眼，把绷带的一端递过来，什么也没说。霜一层层漫过来，像有人把整条管网的冷都推进了这个房间——你得在它封死之前，把两个人拖出去。`,
        title:'泵房', sub:'体质 / 精神检定',
        body:[{t:'你把封锁器塞进怀里。那东西还是热的，像另一颗心跳。'},
              {flav:'能把退路守住的人，往往忘了给自己留一条。'}],
        opts:[{type:'check',attr:()=>C().identity==='sentinel'?'con':'spi',dc:14,advantage:()=>C().linked,
          overload:()=>C().identity==='sentinel'?8:0,
          label:()=>C().identity==='sentinel'?'【体质】扛着受伤的哨兵，冲过结霜的一段':'【精神】张开屏障，把霜气和痛一起顶在门外',
          hint:'1d20 vs DC 14 · 失手则东口与你一起留下',
          success:'s_mid',fail:'s_end_fall'}] },
      s_mid:{ chapter:'—— 中途 · 搭档的消息 ——', chatbeat:true,
        title:'📱 消息', sub:'任务进行中 · 搭档发来一条',
        story:()=>`岔道在这里分成两条：一条往上，一条斜着扎进更深的黑里。你贴着手电的余光量了量两侧的管径：肩宽刚好能过，背包得侧着提——那意味着只要进去，就没有回身的余地。<br><br>巢群在吞信号。对讲里的杂音一点点变厚，像有人慢慢拧大一台老收音机的音量，直到把所有人的声音都盖住。你听见了两次自己的呼吸从频道里传回来，两次之间隔了半秒。<br><br>你算了算时间：从集合到现在，已经过去四十分钟。上面的人还在撑着，下面的人还在等，而你们只有一次机会。你把手电递给搭档，自己先往那条窄道里走——靴底踩进水洼的那一刻，你听见自己的心跳比水滴声还响。<br><br>就在这时，手机震了一下。`,
        body:[{t:()=>`对讲突然静了——巢群在吞信号。手机却震了一下，是搭档 <b>${C().partnerName}</b>：「信号快没了。趁还连着，说句要紧的：等下不管看见什么，<b>别一个人扛</b>。我就在你半步之后。」`},
              {t:'指尖悬在屏幕上，你有三秒钟决定回什么。这可能是进巢心前，最后一句话。'}],
        opts:[
          {type:'answer',ask:'回他/她一句（影响好感）：',
            placeholder:'例如：「好，我扛不住就喊你。」或「你也是，别逞强。」',
            branches:{soothe:K_SOOTHE, force:K_FORCE, flee:K_FLEE, call:K_CALL},
            route:{soothe:'s_core', force:'s_core', flee:'s_core', call:'s_core', default:'s_core'},
            react:(t,k)=>{
              if(k==='call') { bumpAff(mAff(k)); return `你回：「你也是，别逞强。」<br>对面沉默两秒，回来一句带着笑意的：「……学得挺快。」然后信号断了。可那点笑意，像揣在口袋里的一颗糖。`; }
              if(k==='flee') { bumpAff(mAff(k)); return `你回：「好，我扛不住就喊你。」<br>「随时。」对面回得很快。信号断了，但你知道那条线一直牵着——断的只是信号，不是人。`; }
              bumpAff(mAff(k)); return `你回：「${t||'（你按了按心口，没有回）'}」<br>最后一格信号闪了闪，灭了。黑暗里，你听见半步之后的呼吸声，稳稳的，替你把心跳压回了鼓点。`;
            }},
        ] },
      s_core:{ chapter:'第五章 · 清剿', story:()=>`巢心比想象中更大——三岔口被撑成了一座倒扣的钟，钟壁上挂满霜结成的穗子，风一吹就簌簌往下掉。那团<b>不断增殖的虚影</b>悬在正中，每一次你以为打散它，它又从别人的恐惧里长出来，像潮水重新漫过沙滩。<br><br>你终于看懂了它的形状：<b>那是一个人最后三分钟的恐惧</b>，被巢群翻来覆去地播放。它没有嘴，却有几十个人的呼吸；没有脸，却有几十个人最后的表情。唯一的办法，不是杀，是让所有人都<b>不再怕它</b>。<br><br>${C().savedOuter?'东口的人还在——秦峥的封锁器把最后一条缝咬死了，你能从频道里听见他们粗重的呼吸。你的后背，现在是有人管的。':(C().leftOuter?'你没有回头。你只能相信他们撑住了，这个赌注写在你的每一步上；每往里走一步，它就重一分。':'东口那边，你只能相信他们撑住了。你把这份不确定压进后槽牙里，逼自己只看眼前那团虚影。')}<br><br>${C().teamMode==='squad'?`对讲里，阮清芜的声音穿过屏障传下来：「维稳组撑住十分钟。突入组——<b>做你们该做的</b>。」你朝搭档一点头：「引它出来，我断后。」`:'你深吸一口气，走向那团虚影。没有封锁组替你封口，没有维稳组替你稳心，脚步声在钟壁上撞回来，听起来像有两个人。你的后背只属于你自己。'}`,
        title:'清剿', sub:'战术抉择',
        body:[{t:'「清剿不是杀，是让每个人都敢睁着眼看它。」'},
              {flav:'你能听见它用十九个人的呼吸，同时吸了一口气。'}],
        opts:[
          {type:'goto',to:'s_end_good',ico:'🔗',label:'与搭档建立双向链接，分担巢群重量',hint:'哨向组合最优解',cls:'guide',onPick:()=>{C().linked=true;}},
          {type:'goto',to:'s_end_ok',ico:'🛡',label:'独自扛住，给外围争取时间',hint:'孤勇路线'},
          {type:'goto',to:'s_end_neu',ico:'🌐',label:'号召全队同步，共同压制',hint:'多人协同',onPick:()=>{ if(C().teamMode!=='squad') addMLog('⚠ 单组调用全队资源，协调略显吃力。'); }},
          {type:'goto',to:'s_end_burn',ico:'🔥',label:'把感官全开，一个人把巢心按死',hint:'代价是你自己 · 你未必下得来'},
          {type:'goto',to:'s_end_empty',ico:'🕯',label:'先钉死虚影，再回头找那些还认得出脸的',hint:'清了巢 · 未必救得回人'}
        ] },
      s_end_good:{ chapter:'结局 · 共承', story:()=>`你与搭档 <b>${C().partnerName}</b> 的链接猛地绷紧——巢群的尖叫被你们一分为二，各自吞下一半。你的耳朵里灌满别人的最后三分钟，膝盖一软，被一只手从侧面架住；那只手也在抖，却没有松。<br><br>那截「最后三分钟的恐惧」落进两个人怀里，忽然就轻了：它要的从来不是被消灭，是有人肯一起听着。虚影慢慢坍缩成一点微光，像一盏被吹熄又点亮的灯；钟壁上的霜穗子一齐落下来，凉得像一场迟到的雨。<br><br>对讲里炸开秦峥的骂骂咧咧和阮清芜松了口气的轻笑。外围的哨兵向导收拢防线，报数声从东口一个接一个传上来——十九个名字，一个没少。<br><br>回程的对讲里，搭档轻声说：「下次还跟你。」你笑了：「这话我记下了。」`,
        title:'结局 · 共承', sub:'BEST ENDING',
        body:[{t:'周屿在回执单上盖了章，难得地多写了一行：「全员归队。」写完他抬头看了你们一眼：「记住今天是怎么站位的。」'}],
        opts:[{type:'goto',to:'the_end',ico:'🌟',label:'查看结算',hint:''}] },
      s_end_ok:{ chapter:'结局 · 孤勇', story:()=>`你把巢群的尖叫全压在自己肩上，咬着牙给外围争取了三分钟。那三分钟里你听不见自己的心跳，只听见别人的：几十个人的、最后一个的、十九个名字的，全都在你颅骨里挤着喊。<br><br>等虚影坍缩，你瘫在管壁上，感官像被揉碎又拼回。霜化在你脸上，凉得你分不清是水还是汗。你想抬手擦一下，发现手抬到一半就停住了。<br><br>搭档把你拽起来：「逞什么强。」可眼里是藏不住的后怕与庆幸。他/她把你的胳膊架在肩上，一步一晃地往外拖，嘴里还在数落你。<br><br>地面上，阮清芜的维稳屏障缓缓撤下，秦峥的封锁组收了设备。这一仗赢了，只是你的耳朵，还要嗡鸣好几天。`,
        title:'结局 · 孤勇', sub:'GOOD ENDING',
        body:[{t:'周屿看了一眼你的过载读数，把回执单压得很轻：「下次，让人搭把手。」'}],
        opts:[{type:'goto',to:'the_end',ico:'🌟',label:'查看结算',hint:''}] },
      s_end_neu:{ chapter:'结局 · 众志', story:()=>`你一声令下，全队同步——秦峥的封锁组掐灭恐惧扩散的方向，阮清芜的维稳组把整片视野压成一条直线，你与搭档直插巢心。四个频道的呼吸在同一秒对上拍子，那种整齐让你后颈发麻。<br><br>千头万绪的恐惧被一起扛住。虚影找不到新的裂缝，先是慢下来，然后开始掉渣，最后撑不住，散了——散得比你想的安静。散的那一刻所有人都静了半秒，像不敢信，又像在数自己还在不在。<br><br>管网的霜在一寸寸化掉，滴下来的水声第一次听起来不像哭。有人在对讲里长长出了一口气，然后所有人都跟着出了那口气。<br><br>这是一场没有孤胆英雄的胜仗——每个人的名字，都写进了回执。`,
        title:'结局 · 众志', sub:'TEAM ENDING',
        body:[{t:'白塔总结：真正的联合，是让每个人都敢睁着眼。周屿把这份简报收进了「模范案例」卷宗。'}],
        opts:[{type:'goto',to:'the_end',ico:'🌟',label:'查看结算',hint:''}] },
      s_end_fall:{ chapter:'结局 · 折在东口', story:()=>`你把最后一个人推出泵房的时候，霜已经封到了膝盖。你听见自己的呼吸在护具里被放大，一声比一声慢，像有人在替你把世界的音量往下拧。<br><br>封锁组活了，东口守住了。秦峥被人架着往外走，还回头骂你，骂的什么你已经听不清；他那只攥着封锁器的手一直没松，指节白得像霜。可巢心的窗口关上了——那团虚影缩回管网深处，像一条被惊醒又睡回去的蛇。<br><br>搭档拖着你在霜里喊你的名字，声音越来越远，最后只剩下震动，从掌心里传过来——一下，又一下，像有人在很远的地方敲门。<br><br>白塔的评定是「部分成功」：外围全员带回，巢群未清。你醒来的第一句是问东口，第二句，才轮到自己。`,
        title:'结局 · 折在东口', sub:'PARTIAL ENDING',
        body:[{t:'周屿把回执单放在床头，没让你签字：「人带回来了。巢心——下次再说。你已经把该做的做完了。」'},
              {flav:'你救了所有人，唯独没能救下这一仗。'}],
        opts:[{type:'goto',to:'the_end',ico:'🌟',label:'查看结算',hint:''}] },
      s_end_burn:{ chapter:'结局 · 引线', story:()=>`你把自己点着了——从耳朵开始。<br><br>感官全开的那一刻，整条管网都在你颅骨里响：水滴、霜裂、巢群的尖叫，还有搭档的心跳——那心跳比谁都急，却比谁都稳。你听见自己的耳膜像一张被绷到极限的纸，某个瞬间轻轻一响；其实没有声音，但你知道它破了。你一个人把那团虚影的重量拽过来，按在地上，直到它碎成一把灰。<br><br>任务成功。回程路上你还站着，能走、能说话、能报出每个出口的编号。然后在集结点，你吐了。<br><br>之后的三天里，谁说话你都听成水声。第四天，你学会了看别人的嘴型，也开始留意那些不出声的对话。白塔的检查报告上写着「可逆性待观察」，你把那五个字读了两遍，然后笑了。`,
        title:'结局 · 引线', sub:'HOLLOW ENDING',
        body:[{t:'周屿看了一眼你的过载读数，把设备从你手上摘了下来：「任务记录写你完成。人这一栏，先空着。」'},

const GAME_LAUNCH={ reflex:startReflexGame, match3:startMatch3, tetris:startTetris, mines:startMines,
  snake:startSnake, rhythm:startRhythm, memory:startMemoryGame, scan:startScanGame,
  hold:startHoldGame, soothe:startSootheGame };
let CUR_TASK=null, CUR_GAME=null;
function poolOf(d){ return (d&&d.games&&d.games.length)?d.games:((d&&d.game)?[d.game]:[]); }
function gameNamesOf(d){ return poolOf(d).map(g=>(GAME_META[g]||{}).name||g); }
/* 按科目抽取：同科目多项目时避免连续重复同一个游戏 */
function pickGameFor(d){
  const pool=poolOf(d); if(!pool.length) return null;
  let g=pick(pool);
  if(pool.length>1 && G && G.lastGame===g){
    const rest=pool.filter(x=>x!==g); if(rest.length) g=pick(rest);
  }
  if(G) G.lastGame=g;
  return g;
}
function launchDailyGame(d, forceGame){
  const game = forceGame || pickGameFor(d);
  if(!game || !GAME_LAUNCH[game]) return;
  let task=d;
  if(game==='soothe' && !DG_TEXT[d.id]) task=Object.assign({}, d, {id:(C()&&C().identity==='guide')?'soothe_g':'soothe_s'});
  CUR_TASK=d; CUR_GAME=game;
  GAME_LAUNCH[game](task);
}
function retryDaily(){ if(CUR_TASK) launchDailyGame(CUR_TASK, CUR_GAME); else renderDaily(); }

function rerollName(){ const e=$('inName'); if(e){ e.value=randName(); toast('换了个名字：'+e.value); } }
function updatePoints(){
  /* 只统计，不改写输入框内容——否则一边输入一边被夹到 3/20，根本没法改 */
  const ids=['per','spi','con','cha'];
  let sum=0, over=false;
  ids.forEach(k=>{ const e=$('in_'+k); if(!e) return;
    const raw=String(e.value).trim();
    let v=raw===''?0:parseInt(raw,10);
    if(isNaN(v)) v=0;
    if(v>20) over=true;
    e.style.borderColor = (v>20||v<3)&&raw!=='' ? 'var(--bad)' : '';
    sum+=v; });
  const rem=POINT_TOTAL-sum;
  const remEl=$('ptRemain'), hint=$('ptHint'), btn=$('confirmBtn'), bar=$('pointBar');
  if(remEl) remEl.textContent=rem;
  if(bar) bar.style.borderColor = (rem<0||over) ? 'var(--bad)' : 'var(--line)';
  if(hint) hint.textContent = over ? '⚠ 单项上限 20，请调低' : (rem<0 ? '⚠ 超出预算，请调低属性' : (rem>0 ? `（剩余 ${rem} 点可继续分配）` : '已用尽'));
  if(btn) btn.disabled = (rem<0 || over);
  if(btn) btn.style.opacity = (rem<0||over) ? '.5' : '1';
}

/* 导师 / 同期：把名单里随机到的名字与精神体填进台词模板（台词本身在 _chat_content 里定稿） */
function chatTpl(v, map){
  if(typeof v==='function') return v;
  const one=s=>String(s).replace(/\{CHIEF\}/g,map.chief).replace(/\{ANIMAL\}/g,map.animal).replace(/\{ID\}/g,map.id);
  const walk=v=>Array.isArray(v)?v.map(walk):(typeof v==='string'?one(v):(v&&typeof v==='object'?Object.keys(v).reduce((a,k)=>{a[k]=walk(v[k]);return a;},{}):v));
  return walk(v);
}
function buildAllyThreads(){
  const id=C().identity; const isS=id==='sentinel';
  const chief=OTHERS.find(o=>o.idfor===id&&o.role==='mentor');
  const peer =OTHERS.find(o=>o.idfor===id&&o.role==='friend');
  const map={chief:isS?'塔长':'首席', animal:peer.animal||'精神体', id:id};
  const mk=(base,who)=>{
    const t=chatTpl(base,map);
    return Object.assign({}, t, {title:who.name, color:who.color, always:true});
  };
  CHAT.mentor=mk(CHAT_BASE.mentor, chief);
  CHAT.friend=mk(CHAT_BASE.friend, peer);
}
function finalizeCharacter(edit){
  const c0 = edit ? C() : null;
  const id = edit ? c0.identity : window._createIdentity;

  ['per','spi','con','cha'].forEach(k=>{ let v=parseInt($('in_'+k).value,10); if(isNaN(v)) v=10; v=clamp(v,3,20); attr[k]=v; sum+=v; });

  attr[animal.bonus]+=1;
  const rk=deriveRank(attr,id);

      rank: rk.label, dark: rk.dark, rankScore: rk.score,
      partnerName: pr.name, partnerId: pr.identity, partnerStrong: pr.strong, linked: !!c0.linked,
    };
  } else {
    pr=derivePartner(attr,id);
    c={
      identity:id, name:name,
      animal, attr, baseAttr,
      maxhp: id==='sentinel'?32:22, maxsp: id==='sentinel'?16:28,
      hp: id==='sentinel'?32:22, sp: id==='sentinel'?16:28, overload:0,
      rank: rk.label, dark: rk.dark, rankScore: rk.score,
      partnerName: pr.name, partnerId: pr.identity, partnerStrong: pr.strong, linked:false,

  if(peer)  G.relation[peer.name]='好友';

  G.affinity[c.partnerName]=G.affinity[c.partnerName]||0;
  if(chief) G.affinity[chief.name]=G.affinity[chief.name]||0;
  if(peer)  G.affinity[peer.name]=G.affinity[peer.name]||0;
  buildAllyThreads();
  if(edit){
    toast(`资料已更新 · ${c.name} · 评级 ${gradeText(c.rank)}${c.dark?'（黑暗）':''}`);

  // 向导入册后，会陆续收到哨兵的疏导预约（由向导决定是否接下）

    const sents=PARTNERS.filter(p=>p.identity==='sentinel');
    const s1=pick(sents)||{name:'外勤哨兵'};
    const others=sents.filter(p=>p!==s1);
    const s2=others.length?pick(others):s1;
    G.sootheReqs=[
      {from:s1.name, to:c.name, status:'pending', time:nowStr(), no:'SN-1042', type:'表层疏导 · 卸除杂念', level:'优先 · 24 小时内', slot:'今夜 22:30 后', room:'待向导指定', allowAlt:true, overload:74, rank:s1.rank||'A', animal:s1.animal||'狼',
       note:'今天外勤回来感官有点炸，耳朵里一直嗡嗡的，屏障边缘发烫。能排个时段吗？实在不行，随便哪个向导都行。'},
      {from:s2.name, to:c.name, status:'pending', time:nowStr(), no:'SN-1043', type:'深层净化 · 精神图景', level:'常规 · 48 小时内安排即可', slot:'明日 14:00', room:'待向导指定', allowAlt:false, overload:58, rank:s2.rank||'A', animal:s2.animal||'隼',
       note:'听说你疏导稳，想约一次深度净化。上回那单的黑哨痕迹好像粘在图景里了，我自己弄不掉。指定你，不接受备选。'},
    ];
  }
  // 入册后，搭档/导师/同期各有一条待读消息
  G.unread={partner:1, mentor:1, friend:1};
  // 结合需自行在「匹配」中心申请
  G.bondApp=null; G.match=null;
  toast(`入册完成 · ${c.name} · 评级 ${gradeText(c.rank)}${c.dark?'（黑暗）':''} · 搭档 ${pr.name}`);
  renderMe();
}

function renderTower(){
  G.app='tower'; $('appDot').textContent='任务中心';
  if(G.m){ renderMissionPlayer(); return; }
  const myVal=gradeVal(C().rank);
  const cards = MISSIONS.map(m=>{
    const done=G.missionsDone[m.meta.key];
    const locked = myVal < gradeVal(m.meta.grade);
    const cls = locked ? ' style="opacity:.55;"' : '';
    const act = locked ? `onclick="toast('评级不足：你为 ${gradeText(C().rank)}，需 ${gradeText(m.meta.grade)}及以上方可承接')"` : `onclick="startMission('${m.meta.key}')"`;
    return `<button class="mission"${cls} ${act}>
      <div class="m-name">${m.meta.name} ${m.meta.isNew?'<span class="pill new">新</span>':''} ${done?`<span class="pill">已结·${done}</span>`:''} ${locked?'<span class="pill" style="color:var(--bad);border-color:var(--bad)">评级不足</span>':'<span class="pill lv" style="color:var(--sentinel);border-color:rgba(255,107,107,.4)">'+gradeText(m.meta.grade)+'</span>'}</div>
      <div class="m-hook">${locked?'你的评级 '+gradeText(C().rank)+' 不足以承接 '+gradeText(m.meta.grade)+'任务，先去提升评级吧。':m.meta.hook}</div>
      <div class="m-tags">
        <span class="tag-pill lv">${m.meta.code}</span>
        <span class="tag-pill genre">${m.meta.world}</span>
        <span class="tag-pill dur">${scCount(m)} 段 · ${choiceCount(m)} 处抉择</span>
        <span class="tag-pill diff">${m.meta.difficulty}</span>
      </div></button>`;
  }).join('');
  $('screen').innerHTML = `
    ${appBar('任务中心','接取委任')}
    <div class="scroll">
      ${cards}
    </div>`;
}
function startMission(key){
  const m=MISSIONS.find(x=>x.meta.key===key);
  if(gradeVal(C().rank) < gradeVal(m.meta.grade)){ toast(`评级不足：需 ${gradeText(m.meta.grade)}及以上方可承接`); return; }
  G.m={key, scenes:m.scenes, meta:m.meta, start:m.start, first:m.first, log:[], started:false, step:m.start};
  renderMissionPlayer();
}
function exitMission(){ G.m=null; renderTower(); }

function mGoTo(id){
  const m=G.m;
  if(m.step && m.step!==id) m.prev=m.step;
  m.step=id; m.started=true;
  m.visited=m.visited||{}; m.visited[id]=1;
  m.visitedN=Object.keys(m.visited).length;
  touchSave();
  const s=m.scenes[id];
  if(!s){ console.error('no scene',id); return; }
  const sceneEl=$('mScene');
  if(s.render){
    sceneEl.innerHTML = typeof s.render==='function'?s.render():s.render;
    if(s.afterRender) s.afterRender();
    if(s.onEnter) s.onEnter();
    renderMissionStats();
    const sc=document.getElementById('mScroll'); if(sc) sc.scrollTop=0;
    return;
  }
  const body=resolve(s.body);
  const opts=resolve(s.opts);
  let pre='';
  if(s.chapter) pre+=`<div class="chapter">${resolve(s.chapter)}</div>`;
  if(s.story) pre+=`<div class="story-box">${resolve(s.story)}</div>`;
  let html=pre+`<div class="scene"><h2>${s.title}</h2>`;
  if(s.sub) html+=`<div class="sub">${s.sub}</div>`;
  (body||[]).forEach(p=>{
    const t=resolve(p.t), flav=resolve(p.flav);
    if(flav) html+=`<div class="flavor">${flav}</div>`; else html+=`<p>${t}</p>`;
  });
  html+='</div>';
  sceneEl.innerHTML=html;
  const old=sceneEl.querySelector('.options'); if(old) old.remove();
  const oldA=sceneEl.querySelector('.answer-box'); if(oldA) oldA.remove();
  if(opts){ const box=document.createElement('div'); box.className='options';
    augmentOpts(s, opts).forEach(o=>box.appendChild(makeOpt(o))); sceneEl.appendChild(box); }
  if(s.onEnter) s.onEnter();
  renderMissionStats();
  document.getElementById('mScroll').scrollTop=0;
}
/* —— 任务自由度增强：给只有一条路的抉择补上「换个法子」与「自己写」 ——
   · 单一路径的检定 → 多给一种用别的属性的解法
   · 任何还有推进空间的场景 → 多给一个自由输入框（写什么都能往下走，只是回响不同） */
function augmentOpts(s, opts){
  const list=opts.slice();
  /* 检定结果允许写成场景 key，也允许写成 {type:'goto',to:...} 选项对象；统一取成 key，避免对象被当成场景名 */
  const keyOf=t=>{ if(t&&typeof t==='object'){ const v=resolve(t.to); return (typeof v==='string')?v:''; } return (typeof t==='string')?t:''; };
  const isEnd=/end|the_end|_ok$|_neu$|_good$/.test(String(s.title||'')) || list.every(o=>o.type==='goto'&&o.to==='__back');
  const primary=list.find(o=>o.type==='check') || list.find(o=>o.type==='goto') || null;
  /* 1) 补一个替代解法 */
  if(list.length===1 && primary && primary.type==='check'){
    const a=resolve(primary.attr);
    const alt=(a==='per')?'spi':(a==='spi')?'con':(a==='con')?'per':'spi';
    list.push({type:'check', attr:alt, dc:(primary.dc||12)+1, advantage:primary.advantage,
      overload:primary.overload||0,
      label:`【${ATTR_NAME[alt]}】换个法子试`, hint:`${ATTR_NAME[alt]} 1d20 vs DC ${(primary.dc||12)+1}`,
      success:primary.success, fail:primary.fail});
  }
  /* 2) 补一个自由输入（用你自己的话/办法） */
  const hasAnswer=list.some(o=>o.type==='answer');
  if(!hasAnswer && primary && !isEnd){
    const toPrimary = keyOf(primary.to) || keyOf(primary.success) || primary.title || '';
    const toOther = keyOf(primary.fail) || keyOf(primary.to) || toPrimary;
    if(toPrimary){
      list.push({type:'answer', ask:'或者，用你自己的办法来——写下来，故事会顺着你的话走：',
        placeholder:'例如：「先试着听清那句没说完的话。」',
        branches:{soothe:K_SOOTHE, force:K_FORCE, flee:K_FLEE, call:K_CALL},
        route:{soothe:toPrimary, call:toPrimary, default:toPrimary, force:toPrimary, flee:toOther},
        react:(t,k)=>{
          if(G.char && C().partnerName) bumpAff(mAff(k));
          const style={soothe:'你把话说得很轻，事情跟着慢了下来。',
                       force:'你用了最直接的那种办法，代价立刻就来。',
                       flee:'你退开半步，先看清了局面再动。',
                       call:'你把最要紧的那句话说出了口，局面因此松动。',
                       default:'你按自己的方式做了，路线和预设的不太一样。'}[k]||'你按自己的方式做了。';
          return `${style}<br><span class="muted">你写的是：「${esc(t||'（你什么也没说，只是动了手）')}」</span><br>${reactLineFor(k)}`;
        }});
    }
  }
  return list;
}
function reactLineFor(k){
  return {soothe:'对方没有立刻回应，但呼吸慢了半拍。',
          force:'空气紧了一瞬，有人在你身后屏住了气。',
          flee:'你听见自己的心跳，落后于脚步。',
          call:'那两个字落在你们之间，谁都没有避开。',
          default:'结果和你预想的不完全一样，但路还通着。'}[k]||'路还通着。';
}
function makeOpt(o){
  if(o.type==='answer'){
    const ask=document.createElement('div'); ask.className='answer-ask';
    ask.textContent='✍ '+ (o.ask||'你也可以亲自回应——故事会顺着你的话继续推进：');
    const wrap=document.createElement('div'); wrap.className='answer-box';
    const inp=document.createElement('input'); inp.id='answerInput'; inp.placeholder=o.placeholder||'以你自己的方式回应……';
    const btn=document.createElement('button'); btn.className='primary'; btn.textContent='回应 ▸'; btn.style.width='auto';
    btn.onclick=()=>mAnswer(o);
    wrap.appendChild(inp); wrap.appendChild(btn);
    const frag=document.createDocumentFragment(); frag.appendChild(ask); frag.appendChild(wrap); return frag;
  }
  let label=resolve(o.label); if(!label&&o.log) label=o.log; if(!label&&o.toast) label=o.toast;
  const hint=resolve(o.hint);
  const b=document.createElement('button'); b.className='opt'+(o.cls?(' '+o.cls):'');
  b.innerHTML=`<span class="ico">${o.ico||'▸'}</span><span>${label}<small>${hint||''}</small></span>`;
  b.onclick=()=>mChoose(o);
  return b;
}
function mChoose(o){
  if(o.type==='goto'){ if(o.onPick) o.onPick(); if(o.to==='__back'){ G.m=null; renderTower(); } else mGoTo(o.to); return; }
  if(o.type==='create'){ G.m.started=true; window._missionCreate=o.identity; mGoTo('m_customize'); return; }
  if(o.type==='check'){ mCheck(o); return; }
  if(o.type==='event'){ mEvent(o); return; }
  if(o.type==='link'){ mLink(o); return; }
  if(o.type==='answer'){ mAnswer(o); return; }
}
/* 检定的 success/fail 两种写法都支持：场景 key，或一个完整选项对象（做成"结果按钮"让玩家点） */
function mGoTarget(target){
  if(target && typeof target==='object'){
    const sceneEl=$('mScene'); if(!sceneEl) return;
    const old=sceneEl.querySelector('.options'); if(old) old.remove();
    const box=document.createElement('div'); box.className='options';
    box.appendChild(makeOpt(target));
    sceneEl.appendChild(box);
    const sc=document.getElementById('mScroll'); if(sc) sc.scrollTop=sc.scrollHeight;
    return;
  }
  mGoTo(target);
}
function mAnswer(o){
  const input=document.getElementById('answerInput');
  const text=(input&&input.value||'').trim();
  let key='default';
  if(text){ for(const k in (o.branches||{})){ if((o.branches[k]||[]).some(kw=>text.includes(kw))){ key=k; break; } } }
  const react=o.react? (typeof o.react==='function'?o.react(text,key):o.react) : `你回应：「${text||'（沉默）'}」`;
  addMLog(`🗣 <b>你</b>：${text||'（沉默以对）'}`);
  addMLog(`<span class="story">${react}</span>`);
  const target=(o.route&&o.route[key])?o.route[key]:(o.route&&o.route.default);
  setTimeout(()=>mGoTarget(target),700);
}
async function mCheck(o){
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const attrKey=resolve(o.attr);
  const c=C(); const attrVal=c.attr[attrKey]||0;
  const mod=resolve(o.mod)||0;
  const overloadPenalty=(c.identity==='sentinel'&&c.overload>=100)?5:0;
  const linkBonus=(attrKey==='con'&&c.linked&&c.identity==='sentinel')?2:0;
  /* 属性贡献封顶 + 每掷一次的现场波动：不再是谁都稳过 */
  const attrPart=Math.round(Math.min(attrVal,12)*0.6);
  const env=(rnd(9)-4);                                   // ±4 现场环境
  const rankTier=({S:6,A:4,B:2,C:0,D:0}[c.rank]||0);      // 评级越高，白塔给的活越难
  const effDC=(o.dc||12)+rankTier+(c.dark?1:0);
  const totalMod=attrPart+mod-linkBonus-overloadPenalty+env;
  let adv=(typeof o.advantage==='function')?resolve(o.advantage):(o.advantage?true:(o.disadvantage?false:null));
  if(c.identity==='sentinel'&&c.overload>=100) adv=false;
  const wrap=$('mDice'); wrap.innerHTML=''; $('mVerdict').textContent=''; $('mCheckInfo').textContent='';
  const dice=[]; const n=adv===null?1:2;
  for(let i=0;i<n;i++){ const d=document.createElement('div'); d.className='die'; d.innerHTML=`<span class="tag">${adv?'2d20':'1d20'}</span><span class="num">?</span>`; wrap.appendChild(d); dice.push(d); }
  const rolls=[]; for(let i=0;i<n;i++) rolls.push(1+rnd(20));
  let chosen; if(adv===true) chosen=Math.max(...rolls); else if(adv===false) chosen=Math.min(...rolls); else chosen=rolls[0];
  const total=chosen+totalMod;
  const critWin=(chosen===20), critLose=(chosen===1);
  const success = critWin ? true : (critLose ? false : total>=effDC);
  await Promise.all(dice.map((d,i)=>animateDie(d,20,rolls[i],(chosen===20)?'crit':(chosen===1?'fail':null))));
  let info=`【${ATTR_NAME[attrKey]} ${attrVal}→+${attrPart}${mod?(' 修正'+(mod>0?'+':'')+mod):''}${linkBonus?(' 链接+'+linkBonus):''}${overloadPenalty?(' 过载-'+overloadPenalty):''} 现场${env>=0?'+':''}${env}】 `;
  info += (n===2?`2d20 取${adv?'高':'低'}=${chosen}`:`1d20=${chosen}`) + ` → 总计 <b>${total}</b> vs DC ${effDC}${rankTier?`（基础 ${o.dc} + 评级 ${rankTier}）`:''}${critLose?' · 大失败':(critWin?' · 大成功':'')}`;
  $('mCheckInfo').innerHTML=info;
  $('mVerdict').textContent=success?'✦ 成功':'✕ 失败';
  $('mVerdict').className='verdict '+(success?'ok':'no');
  addMLog(`🎲 ${ATTR_NAME[attrKey]} 检定：掷${n>1?(adv?'2d20取高':'2d20取低'):'1d20'} 得 ${chosen}，总计 ${total} / DC ${effDC} → ${success?'<span class="win">成功</span>':'<span class="lose">失败</span>'}${critLose?'（大失败）':(critWin?'（大成功）':'')}`);
  if(o.overload) mOverload(resolve(o.overload));
  setTimeout(()=>{ mGoTarget(success?o.success:o.fail); },1000);
}
async function mLink(o){
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const c=C(); const attr=c.identity==='sentinel'?'cha':'spi'; const attrVal=c.attr[attr];
  const wrap=$('mDice'); wrap.innerHTML=''; $('mVerdict').textContent=''; $('mCheckInfo').textContent='';
  const d=document.createElement('div'); d.className='die'; d.innerHTML=`<span class="tag">链接</span><span class="num">?</span>`; wrap.appendChild(d);
  const roll=1+rnd(20); const total=roll+attrVal; const success=total>=o.dc;
  await animateDie(d,20,roll,roll===20?'crit':(roll===1?'fail':null));
  $('mCheckInfo').innerHTML=`【${ATTR_NAME[attr]} ${attrVal}】 建立精神链接：1d20=${roll} → 总计 <b>${total}</b> vs DC ${o.dc}`;
  $('mVerdict').textContent=success?'🔗 链接建立':'链接微弱';
  $('mVerdict').className='verdict '+(success?'ok':'no');
  addMLog(`🔗 精神链接检定：${ATTR_NAME[attr]} 得 ${total} / DC ${o.dc} → ${success?'<span class="win">成功</span>':'<span class="lose">失败</span>'}`);
  if(success){ c.linked=true; toast('精神链接已建立'); renderMissionStats(); }
  setTimeout(()=>{ mGoTarget(success?o.success:o.fail); },1000);
}
function mEvent(o){
  const c=C();
  if(o.hp) c.hp=clamp(c.hp+o.hp,0,c.maxhp);
  if(o.sp) c.sp=clamp(c.sp+o.sp,0,c.maxsp);
  if(o.overload) mOverload(resolve(o.overload));
  if(o.flag) c[o.flag]=true;
  if(o.log) addMLog(o.log);
  if(o.toast) toast(o.toast);
  renderMissionStats();
  mGoTo(o.to);
}
function mOverload(v){
  const c=C(); if(c.identity!=='sentinel') return;
  const before=c.overload; c.overload=clamp(c.overload+v,0,100);
  if(before<100&&c.overload>=100) toast('⚠ 感官过载！你陷入暴躁');
}
function addMLog(html, silent){
  G.m.log.unshift(html);
  const el=$('mLog'); if(!el) return;
  const d=document.createElement('div'); d.innerHTML=html; el.insertBefore(d, el.firstChild);
}

/* 任务里的「身份确认 + 定制」内嵌场景（intro / customize / the_end 由 Mission 引用全局） */
// 各 Mission 的 scenes 用到 'intro' 'm_customize' 'the_end' 需全局存在：

  if(!G.reqs)  G.reqs=[];
  if(!G.calls) G.calls=[];
  MISSIONS.forEach(m=>{
    if(!m.scenes.intro) m.scenes.intro={

            {t:'「哨兵以感官为刃，向导以精神为锚。你的选择，决定你在这支小队里站在哪一端。」'}],
      opts:[

        const aopts=SPIRIT_ANIMALS.map((a,i)=>`<label class="animal-opt"><input type="radio" name="manimal" value="${i}" ${i===0?'checked':''}><span class="animal-name">${a.n}</span><span class="animal-desc">${a.d}</span><span class="animal-bonus">+1 ${ATTR_NAME[a.bonus]}</span></label>`).join('');
        return `<h2>白塔入册 · 角色卡</h2><div class="sub">${isS?'哨兵 SENTINEL':'向导 GUIDE'} · 亲手填写能力点数，并唤出你的精神体</div>
          <div class="attr-inputs">${inputs}</div>
          <div class="muted" style="font-size:11px;">建议主属性 14–18、副属性 8–12；也可点「随机」。</div>
          <button class="btn primary" id="mrandBtn" style="margin-top:10px;">🎲 随机掷点</button>
          <div class="stat-title" style="font-weight:700;color:var(--dim);font-size:13px;margin-top:12px;">选择精神体</div>
          <div class="animal-grid">${aopts}</div>
          <button class="btn accent" id="mconfirmBtn" style="margin-top:14px;">✔ 确认入册，接取任务</button>`;
      }, afterRender:()=>{
        $('mrandBtn').onclick=()=>{ const isS=window._missionCreate==='sentinel';
          const v=isS?{per:roll4d6(),con:roll4d6(),spi:10+rnd(4),cha:10+rnd(4)}:{spi:roll4d6(),cha:roll4d6(),per:10+rnd(4),con:10+rnd(4)};
          ['per','spi','con','cha'].forEach(k=>{ const e=$('min_'+k); if(e) e.value=v[k]; }); toast('已掷点'); };
        $('mconfirmBtn').onclick=()=>{

          const ai=parseInt(document.querySelector('input[name=manimal]:checked').value,10);
          const animal=SPIRIT_ANIMALS[ai]; attr[animal.bonus]+=1;
          const rk=deriveRank(attr,isS);
          const pr=derivePartner(attr,isS);
          // 与全局角色合并/确认：任务使用当前角色，但允许本次覆盖属性

/* ——— 隐藏好感判定：同一个选项，对不同性格的人加减完全不同 ———
   规则：撞上 TA 偏爱的口吻 → 大涨；踩到 TA 的雷点 → 大跌；
        其它口吻只小幅波动，甚至完全不变。
   所有选项都不显示任何数值，只有选完之后 TA 的反应会告诉你。 */

/* ======== 好感力度调参区（改这里就能改手感，保存后刷新页面即可）========
   当前使用「更轻」档：踩到雷点只掉 3~6，偶尔说错话不至于一次翻车。
   想更狠（踩雷代价大）  ：hateMin:8, hateMax:14, neutralPool:[-3,-2,-1,0,1,1]
   想回到中间档（初版）  ：hateMin:5, hateMax:9,  neutralPool:[-2,-1,0,0,1,2]
   likeMin/likeMax  偏爱时的加分区间（撞对胃口 +6~+9，不随档位变）
   neutralPool      其它口吻的取值池：小加小减或不变
   highDamp         好感越高，加分越钝：d*(1-好感/highDamp)，150 ≈ 好感 90 时只剩三成
   lowBoost         好感越高，扣分越狠：d*(lowBoost+好感/200)                    */
const AFF_TUNE={ likeMin:6, likeMax:9, hateMin:3, hateMax:6,
                 neutralPool:[-1,0,0,1,1,2], highDamp:150, lowBoost:0.7 };

function persOf(name){
  const p=findPerson(name);
  return (p && p.pers) ? p.pers : null;
}
function affOf(name, tone){
  const af=G.affinity[name]||0;
  const pers=persOf(name);
  let d;
  if(!pers){
    d=pick(AFF_TUNE.neutralPool);                          // 无档案者：无偏好，只小幅波动
  } else if(tone && pers.like.indexOf(tone)>=0){
    d=AFF_TUNE.likeMin+rnd(AFF_TUNE.likeMax-AFF_TUNE.likeMin+1);   // 偏爱
  } else if(tone && pers.hate.indexOf(tone)>=0){
    d=-(AFF_TUNE.hateMin+rnd(AFF_TUNE.hateMax-AFF_TUNE.hateMin+1)); // 雷点
  } else {
    d=pick(AFF_TUNE.neutralPool);                          // 一般：小加小减或不变
  }
  if(d>0) d=Math.max(1, Math.round(d*(1-af/AFF_TUNE.highDamp)));
  else if(d<0) d=Math.min(-1, Math.round(d*(AFF_TUNE.lowBoost+af/200)));
  return d;
}
/* 选完之后只给一句体感描述，不给数字 */
function affFeedback(name, d){
  const pers=persOf(name);
  const say=(arr, alt)=>(pers&&pers[arr]&&pers[arr].length)?pick(pers[arr]):alt;
  if(d>=6) return say('good','对方的语气明显软了下来。');
  if(d>=3) return '对方似乎挺受用，回了你一句软话。';
  if(d>=1) return '对方应了一声，态度没什么变化。';
  if(d===0) return '对方没什么反应。';
  if(d>=-3) return '对方「嗯」了一声，语气淡了一分。';
  if(d>=-6) return '对方明显不太高兴，回得比刚才短了。';
  return say('bad','这话像是踩到了雷点。');
}
function applyAff(name, d){
  if(!G.char || !name) return 0;
  const before=G.affinity[name]||0;
  const after=clamp(before+d,0,100);
  G.affinity[name]=after;
  if(d) toast(`${name}：${affFeedback(name,d)}`);
  if(name===C().partnerName && before<55 && after>=55 && G.unread.romance==null){
    G.unread.romance=1; toast('💞 心动支线已解锁，去「消息」看看'); refreshNavBadges();
  }
  touchSave();
  return after-before;
}
/* 带口吻的判定：有口吻就交给性格，没有就用兜底数值 */
function applyToneAff(name, tone, fallbackN){
  const d = tone ? affOf(name, tone) : (fallbackN||0);
  return applyAff(name, d);
}

function pressEnd(){ pressCancel(); setTimeout(function(){ if(!MENU_OPEN) MENU_MARK=false; }, 60); }
function closeRowMenu(){
  const m=document.getElementById('rowMenu'); if(m&&m.parentNode) m.parentNode.removeChild(m);
  MENU_OPEN=false;
  setTimeout(function(){ MENU_MARK=false; }, 60);
}
function showRowMenu(ev, kind, id){
  closeRowMenu();
  const x=(ev.clientX!=null?ev.clientX:0), y=(ev.clientY!=null?ev.clientY:0);
  const W=172, H=kind==='sms'?128:96;
  const vw=(window.innerWidth||380), vh=(window.innerHeight||700);
  const left=Math.max(8, Math.min(x-40, vw-W-8));
  const top=Math.max(8, Math.min(y+6, vh-H-8));
  const s=(G.sms||[]).find(function(o){return o.id===id;});
  const m=document.createElement('div');
  m.className='row-menu'; m.id='rowMenu';
  m.style.left=left+'px'; m.style.top=top+'px'; m.style.width=W+'px';
  let items=`<div class="rm-item danger" onclick="rowMenuAction('${kind}','${id}','del')">🗑 删除${kind==='sms'?'这条短信':'这条会话'}</div>`;
  if(kind==='sms' && s){
    items+=`<div class="rm-item" onclick="rowMenuAction('${kind}','${id}','${s.unread?'read':'unread'}')">${s.unread?'✓ 标记为已读':'● 标记为未读'}</div>`;
  }
  items+=`<div class="rm-item" onclick="closeRowMenu()">✕ 取消</div>`;
  m.innerHTML=items;
  document.body.appendChild(m);
  MENU_OPEN=true; MENU_MARK=true;      // 菜单开着时不要顺手打开详情
  setTimeout(function(){
    document.addEventListener('click', closeRowMenu, {once:true});
    document.addEventListener('touchstart', function h(e){
      if(!m.contains(e.target)) closeRowMenu();
      document.removeEventListener('touchstart', h);
    }, {once:true});
  }, 30);
}
function rowMenuAction(kind, id, act){
  const s=(G.sms||[]).find(function(o){return o.id===id;});
  closeRowMenu();
  if(act==='del'){ rowDelete(kind, id); return; }
  if(kind==='sms' && s && act==='read'){ s.unread=0; toast('已标为已读'); renderSmsList(); return; }
  if(kind==='sms' && s && act==='unread'){ s.unread=1; toast('已标为未读'); renderSmsList(); return; }
}
function rowDelete(kind, id){
  if(kind==='sms'){
    const i=(G.sms||[]).findIndex(function(x){return x.id===id;}); if(i<0) return;
    const from=G.sms[i].from; G.sms.splice(i,1);
    toast('已删除：'+from);
    touchSave();
    if(G.msgTab==='sms') renderSmsList(); else renderChatList();
    return;
  }
  if(kind==='thread'){
    const k=id;
    G.threads=(G.threads||[]).filter(function(x){return x!==k;});
    delete G.unread[k]; delete G.chatProgress[k];
    touchSave();
    toast('已删除该会话'); renderChatList(); return;
  }
}
function swipeDelete(kind, id){ rowDelete(kind, id); }   // 兼容旧调用
function threadDeleteButton(kind, id){
  return `<button class="btn" style="margin-top:10px;" onclick="swipeDelete('${kind}','${id}')">🗑 删除这条会话</button>`;
}
function openSMS(id){
  const s=G.sms.find(x=>x.id===id); if(!s) return;
  s.unread=0; G.app='chat'; G.openThread=null; $('appDot').textContent='消息';
  const body=s.lines.map(l=>`<div class="bubble ${l.who==='me'?'me':'them'}">${esc(l.t)}</div>`).join('');
  const replies=s.closed?'':s.opts.map((o,i)=>`<button class="reply" onclick="smsReply('${s.id}',${i})">${o.label}</button>`).join('');
  $('screen').innerHTML=`
    ${appBar(s.from, s.time, 'renderChatList()')}
    <div class="chat-body" id="chatBody">${body}</div>
    <div class="chat-replies" id="chatReplies">${replies||'<div class="muted" style="text-align:center;font-size:12px;">— 已处理 —</div>'}</div>
    <div style="padding:0 14px 18px;">${threadDeleteButton('sms', s.id)}</div>`;
  const cb=$('chatBody'); if(cb) cb.scrollTop=cb.scrollHeight;
  renderTabbar();
}
function smsReply(id, i){
  const s=G.sms.find(x=>x.id===id); if(!s||s.closed) return;
  const o=s.opts[i]; if(!o) return;
  s.lines.push({who:'me', t:o.label});
  if(o.r) s.lines.push({who:'them', t:o.r});
  s.closed=true;
  touchSave();
  openSMS(id);
  if(o.label==='举报'||o.label==='拉黑') toast('已提交：'+s.from);
}

/* ============ 消息 / 聊天 + 恋爱 ============ */
function unreadChat(){
  if(!G.char) return false;
  return unreadTotal()>0;
}
function unreadTotal(){
  if(!G.char) return 0;
  let n=smsUnread();
  Object.keys(G.unread).forEach(k=> n+=(G.unread[k]||0));
  return n;
}
function unreadCount(k){ return (G.unread[k]||0); }
function clearUnread(k){ G.unread[k]=0; }

/* ——— 通用聊天线程支持（任意联系人都能聊） ——— */
function getThread(k){
  if(CHAT[k]) return CHAT[k];
  if(k && k.indexOf('gen:')===0) return genericThread(k.slice(4));
  return null;
}
/* 备注名：玩家可在聊天里给 NPC 改称呼 */
function dispName(name){ return (G.remarks&&G.remarks[name]) ? G.remarks[name] : name; }
function chatTitle(k){
  if(k==='partner') return dispName(C().partnerName)+'（搭档）';
  if(k==='romance') return '💞 心动';
  if(k && k.indexOf('gen:')===0) return dispName(k.slice(4));
  const t=getThread(k); return t?t.title:k;
}
function chatColor(k){
  if(k==='partner') return (PARTNERS.find(p=>p.name===C().partnerName)||{}).color||'#1c2a52';
  if(k && k.indexOf('gen:')===0){ const p=findPerson(k.slice(4)); return p?p.color||'#26334f':'#26334f'; }
  const t=getThread(k); return t?t.color:'#26334f';
}
function chatAffName(k){
  if(k==='partner'||k==='romance') return C().partnerName;
  if(k==='mentor') return (C() && C().identity==='guide') ? (ROSTER.mentor_g||{}).name : (ROSTER.mentor_s||{}).name;
  if(k==='friend') return (C() && C().identity==='guide') ? (ROSTER.friend_g||{}).name : (ROSTER.friend_s||{}).name;
  if(k && k.indexOf('gen:')===0) return k.slice(4);
  return null;
}
/* 通讯录里随便一个人：从通用聊天池里随机组一条线（每次进都略有不同） */
function genericThread(name){
  const p=findPerson(name); if(!p) return null;
  const open=(GEN_CHAT.openers&&GEN_CHAT.openers.length)?pick(GEN_CHAT.openers):['在吗'];
  const pool=(GEN_CHAT.steps||[]).slice();
  const picked=[];
  while(picked.length<3 && pool.length) picked.push(pool.splice(rnd(pool.length),1)[0]);
  const steps=[{npc:open.slice(), replies:(picked[0]?picked[0].replies:[]).slice()}]
    .concat(picked.slice(1).map(s=>({npc:s.npc.slice(), replies:s.replies.slice()})));
  return {
    title:name, color:p.color||'#26334f', always:true,
    steps:steps.filter(s=>s.replies&&s.replies.length),
    close:(GEN_CHAT.closes&&GEN_CHAT.closes.length)?pick(GEN_CHAT.closes):'对面没再回你。'
  };
}
function contactChat(name){
  if(G.char && C().partnerName===name){ openThread('partner'); return; }
  const o=OTHERS.find(x=>x.name===name);
  if(o && o.role){ openThread(o.role); return; }
  openThread('gen:'+name);
}
/* ——— 备注：给 NPC 改一个只有你知道的称呼（入口在联系人页名字旁） ——— */
function editRemark(name, boxId){

function clearRemark(name){ delete G.remarks[name]; toast('已清除备注'); afterRemark(name); }
/* 玩家主动退出聊天才刷新红点（进入不清，避免选完直接跳走） */
function exitThread(){ const k=G.openThread; G.openThread=null; if(k) G.unread[k]=0; renderChatList(); }
function bumpAffFor(name,n){ return applyAff(name, n); }
/* 对方的台词可能是字符串 / 数组 / 函数，统一成字符串数组（消息列表与聊天页都要用） */
function npcLines(v){
  const r=(typeof v==='function')?v():v;
  const arr=Array.isArray(r)?r:[r];
  return arr.map(x=>String(resolve(x)==null?'':resolve(x))).filter(x=>x.trim()!=='');
}
function npcPreview(v){ const a=npcLines(v); return a.length?a[a.length-1]:''; }
/* 把对方的一步台词渲染成一条或多条气泡 */
function themBubbles(v){
  const a=npcLines(v);
  return (a.length?a:['……']).map(x=>`<div class="bubble them">${esc(x)}</div>`).join('');
}
function renderChatList(){
  G.app='chat'; G.openThread=null; G.msgTab='chat'; $('appDot').textContent='消息';
  const order=['partner','romance','mentor','friend'];
  const items=order.map(k=>{
    const t=CHAT[k];
    if(t.requireAff!=null && (G.affinity[C().partnerName]||0)<t.requireAff) return '';
    const prog=G.chatProgress[k]||0;
    const lg=normLog(k); const lastE=lg.length?lg[lg.length-1]:null;
    let last;
    if(lastE){ last = (lastE.who==='me'?'我：':'')+lastE.t; }
    else last = prog<t.steps.length ? npcPreview(t.steps[prog].npc) : (t.close||'');
    const u = (G.unread[k]||0);
    const unread = u>0 ? (u>1?`<div class="t-badge">${u}</div>`:'<div class="t-badge dot"></div>') : '';
    const avatar = k==='partner' ? C().partnerName[0] : (k==='romance'?'💞':t.title[0]);
    const color = k==='partner' ? (PARTNERS.find(p=>p.name===C().partnerName)||{}).color||'#1c2a52' : t.color;
    return `<div class="thread" onclick="openThread('${k}')">
      <div class="av" style="background:${color}">${avatar}</div>
      <div style="flex:1;min-width:0;">
        <div class="t-name">${esc(chatTitle(k))}${k==='romance'?'<span class="pill" style="color:var(--bad);border-color:var(--bad)">心动</span>':''}</div>
        <div class="t-last">${esc(last).slice(0,40)}</div>
      </div>
      ${unread}
    </div>`;
  }).join('');
  // 聊过的人会自动出现在这里（含 OTHERS 角色线程与自建联系人）
  const builtin=['partner','romance','mentor','friend'];
  const extraKeys=(G.threads||[]).filter(k=>builtin.indexOf(k)<0);
  const extras=extraKeys.map(k=>{
    const nm = k.indexOf('gen:')===0 ? k.slice(4) : (getThread(k)?getThread(k).title:k);
    const p = findPerson(nm)||{};
    const u=(G.unread[k]||0);
    const unread = u>0 ? (u>1?`<div class="t-badge">${u}</div>`:'<div class="t-badge dot"></div>') : '';
    const sub = (function(){
      const lg=normLog(k); const e=lg.length?lg[lg.length-1]:null;
      if(e) return (e.who==='me'?'我：':'')+e.t;
      return k.indexOf('gen:')===0 ? ((p.identity==='sentinel'?'哨兵':p.identity==='guide'?'向导':'在册人员')+(p.pos?' · '+p.pos:'')) : '还没聊过';
    })();
    const inner=`<div class="thread" onclick="openThreadIf('${k}')">
      <div class="av" style="background:${p.color||'#26334f'}">${(nm||'?')[0]}</div>
      <div style="flex:1;min-width:0;">
        <div class="t-name">${esc(dispName(nm))}</div>
        <div class="t-last">${esc(sub)}</div>
      </div>
      ${unread}</div>`;
    return menuRow(k, inner, 'thread');
  }).join('');
  $('screen').innerHTML = `
    ${appBar('消息','')}
    <div class="scroll">
      ${segMsgSms('chat')}
      ${extras?`<div class="stat-title" style="font-weight:700;color:var(--dim);font-size:13px;margin:2px 0 8px;">最近联系（${extraKeys.length}）</div>${extras}`:''}
      <div class="stat-title" style="font-weight:700;color:var(--dim);font-size:13px;margin:2px 0 8px;">固定会话</div>
      ${items}
      <div class="muted" style="font-size:11px;text-align:center;margin-top:14px;">长按 / 右键一条可删除 · 通讯录在「电话」里</div>
    </div>`;
  renderTabbar();
}
function openThread(k){
  const t=getThread(k);
  if(!t) return;
  if(t.requireAff!=null && (G.affinity[C().partnerName]||0)<t.requireAff){ toast('好感度不足，暂未解锁'); return; }
  const prog=G.chatProgress[k]||0;
  G.openThread=k; G.app='chat'; $('appDot').textContent='消息';   // 进入不清红点，玩家主动退出才刷新
  // 聊过的人自动加入消息列表
  if(!G.threads) G.threads=[];
  if(G.threads.indexOf(k)<0) G.threads.push(k);
  const name = chatTitle(k);
  const color = chatColor(k);
  const affName = chatAffName(k);
  const aff = affName ? (G.affinity[affName]||0) : 0;
  let bodyHtml='';
  const lg=normLog(k);
  if(!lg.length && prog<t.steps.length){          // 第一次进来：对方先开口
    npcLines(t.steps[prog].npc).forEach(x=>logPush(k,'them',x));
  }
  if(prog>=t.steps.length && !G.chatClosed[k]){   // 剧本走完了：补一句收尾
    logPush(k,'sys',t.close||'（随时可以继续聊）');
    if(t.date) logPush(k,'sys',t.date);
    G.chatClosed[k]=1;
  }
  normLog(k).forEach(e=>{
    bodyHtml+=`<div class="bubble ${e.who==='me'?'me':(e.who==='sys'?'sys':'them')}">${esc(e.t)}</div>`;
  });
  let replyHtml='';
  if(prog<t.steps.length){
    const st=t.steps[prog];
    replyHtml = st.replies.map((r,idx)=>`<button class="reply" onclick="sendReply('${k}',${idx})">${resolve(r.label)}</button>`).join('');
  }
  const affBar = affName ? `<div class="affinity"><span class="heart">❤</span><div class="bar mt"><i style="width:${aff}%"></i></div><span>${aff}/100</span></div>` : '';
  const quick=QUICK_SAY.map(q=>`<span class="quick" onclick="quickSend('${k}','${q}')">${q}</span>`).join('');
  $('screen').innerHTML = `
    ${appBar(name, '私信','exitThread()')}
    <div class="chat-body" id="chatBody">${bodyHtml}</div>
    ${affBar}
    <div class="chat-replies" id="chatReplies">${replyHtml||`<div class="muted" style="text-align:center;font-size:12px;">想说什么直接打字，连着发几句也行</div>`}</div>
    <div class="chat-input">
      <input id="freeInput" placeholder="打点什么…（连着发几句也行）" onkeydown="if(event.key==='Enter')sendFree('${k}')">
      <button class="primary" onclick="sendFree('${k}')">发送</button>
    </div>
    <div class="quick-row">${quick}</div>
    ${(k.indexOf('gen:')===0)?`<div style="padding:0 14px 18px;">${threadDeleteButton('thread', k)}</div>`:''}`;
  const cb=$('chatBody'); cb.scrollTop=cb.scrollHeight;
}
/* ——— 真人节奏：对方"正在输入"的时长随字数变，偶尔打一半删掉重打；一次只回一轮 ——— */
function typingBubble(cb){
  const d=document.createElement('div');
  d.className='bubble them typing';
  d.innerHTML='<span class="tdots"><i></i><i></i><i></i></span>对方正在输入…';
  cb.appendChild(d); cb.scrollTop=cb.scrollHeight;
  return d;
}
/* 聊天输入框上方的常用短语：点一下就发出去，方便玩家"连着发几句" */
const QUICK_SAY=['在吗','哈哈哈','吃了没','欸','唉今天好累','有点想你','晚安'];
const CHAT_PEND={}, CHAT_TYPING={};
function pendOf(k){ if(!CHAT_PEND[k]) CHAT_PEND[k]=[]; return CHAT_PEND[k]; }
function aliveBody(cb){ return document.getElementById('chatBody')===cb; }
function sendThemLines(cb, lines, done){
  const arr=(Array.isArray(lines)?lines:[lines]).map(x=>resolve(x)).filter(x=>x!=null&&String(x).trim()!=='');
  let i=0;
  const step=()=>{
    if(i>=arr.length){ if(done) done(); return; }
    const txt=String(arr[i++]);
    const ind=typingBubble(cb);                                     // 立刻冒出来：真人点开就在打
    let wait=Math.min(6200, 520+txt.length*60+Math.random()*900);
    if(Math.random()<0.16) wait+=800+Math.random()*1800;            // 打了一半删掉重打
    setTimeout(()=>{
      if(ind.parentNode) ind.parentNode.removeChild(ind);
      if(!aliveBody(cb)) return;                                    // 玩家已经退出这个会话
      const d=document.createElement('div'); d.className='bubble them'; d.textContent=txt;
      cb.appendChild(d); cb.scrollTop=cb.scrollHeight;
      setTimeout(step, 210+Math.random()*560+(Math.random()<0.18?800:0));
    }, wait);
  };
  step();
}
function chatLogOf(k){ if(!G.chatLog) G.chatLog={}; if(!G.chatLog[k]) G.chatLog[k]=[]; return G.chatLog[k]; }
/* 会话记录：按真实顺序存气泡 {who:'me'|'them'|'sys', t}；旧的 {me,them} 格式自动转换 */
function logPush(k, who, t){ if(t==null||String(t).trim()==='') return; chatLogOf(k).push({who:who,t:String(resolve(t))}); }
function normLog(k){
  const lg=chatLogOf(k);
  let old=false;
  for(let i=0;i<lg.length;i++){ if(lg[i] && lg[i].me!==undefined){ old=true; break; } }
  if(!old) return lg;
  const out=[];
  lg.forEach(e=>{
    if(!e) return;
    if(e.me!==undefined){
      out.push({who:'me',t:String(e.me)});
      (e.them||[]).forEach(x=>out.push({who:'them',t:String(x)}));
    } else if(e.who) out.push(e);
  });
  G.chatLog[k]=out;
  return out;
}
function afterFlow(k){
  if(G.openThread!==k){ G.unread[k]=(G.unread[k]||0)+1; refreshNavBadges(); }
  touchSave();
}
function refreshAffBar(){
  const k=G.openThread; if(!k) return;
  const an=chatAffName(k); const aff=an?(G.affinity[an]||0):0;
  const body=$('chatBody'); if(!body) return;
  const bar=body.parentNode.querySelector('.bar.mt > i'); if(bar) bar.style.width=aff+'%';
  const sp=body.parentNode.querySelector('.affinity span:last-child'); if(sp) sp.textContent=aff+'/100';
}
function sendReply(k, idx){
  const t=getThread(k); const prog=G.chatProgress[k]||0;
  if(prog>=t.steps.length) return;
  const st=t.steps[prog]; const r=st.replies[idx]; if(!r) return;
  const myLabel=resolve(r.label);                                   // 玩家说的话
  const themLines=(r.reply!=null)?(Array.isArray(r.reply)?r.reply:[r.reply]):[];
  st._reply=myLabel;
  /* 好感：选项不带数值，加减由对方性格判定 */
  const an0=chatAffName(k);
  if(an0) applyToneAff(an0, r.t||null, (r.aff!=null?r.aff:(r.delta||0)));
  G.chatProgress[k]=prog+1;
  logPush(k,'me',myLabel);
  themLines.forEach(x=>logPush(k,'them',resolve(x)));
  const cb=$('chatBody');
  const meD=document.createElement('div'); meD.className='bubble me'; meD.textContent=myLabel;
  cb.appendChild(meD); cb.scrollTop=cb.scrollHeight;
  $('chatReplies').innerHTML='';
  touchSave();
  const np=G.chatProgress[k];
  const afterThem=()=>{
    if(np<t.steps.length){
      const lines=npcLines(t.steps[np].npc);
      lines.forEach(x=>logPush(k,'them',x));
      sendThemLines(cb, lines, ()=>{ renderReplies(k); afterFlow(k); });
    } else {
      const sysTxt=t.close||'（随时可以继续聊）';
      logPush(k,'sys',sysTxt); if(t.date) logPush(k,'sys',t.date);
      G.chatClosed[k]=1;
      const ind=typingBubble(cb);
      setTimeout(()=>{
        if(ind.parentNode) ind.parentNode.removeChild(ind);
        if(!aliveBody(cb)) return;
        const d=document.createElement('div'); d.className='bubble sys'; d.textContent=sysTxt; cb.appendChild(d);
        if(t.date){ const d2=document.createElement('div'); d2.className='bubble sys'; d2.textContent=t.date; cb.appendChild(d2); }
        cb.scrollTop=cb.scrollHeight; renderReplies(k); afterFlow(k);
      }, 900+Math.random()*1000);
      if(k==='romance'){ toast('💞 心动支线已开启'); G.unread[k]=0; }
    }
  };
  if(themLines.length) sendThemLines(cb, themLines, afterThem); else afterThem();
  refreshAffBar();
}
function renderReplies(k){
  const t=getThread(k); const prog=G.chatProgress[k]||0;
  const box=$('chatReplies'); if(!box) return;
  if(prog<t.steps.length){
    const st=t.steps[prog];
    box.innerHTML=st.replies.map((r,idx)=>`<button class="reply" onclick="sendReply('${k}',${idx})">${resolve(r.label)}</button>`).join('');
  } else {
    box.innerHTML='<div class="muted" style="text-align:center;font-size:12px;">剧本聊完了 · 想说什么直接打字，连着发几句也行</div>';
  }
}

/* ——— 自由聊天：玩家可以连着发好几句，对方一次回一轮 ———
   回复池刻意做成"长短都有"：有的一个字，有的三四条连着发，并带语气词（啊/吧/嘛/欸/唉/哟）与动作（括号里的） */
const FREE_TOPIC=[
  {k:'bye',   re:/晚安|睡了|睡觉|困了|先睡/,
    v:[['晚安'],['睡吧','明天还早班'],['嗯','你也早点睡'],
       ['（躺下了）','今天真撑不住','晚安啊'],['欸','那我也睡了','别熬太晚']]},
  {k:'greet', re:/^(在吗|在不在|在么|喂|hi|嗨)/i,
    v:[['在'],['嗯在','怎么了'],['在的','刚看手机'],['哟','稀客','什么事'],['在啊','刚洗完澡','说吧']]},
  {k:'food',  re:/吃|饭|外卖|饿|食堂|宵夜/,
    v:[['吃了'],['还没','懒得动'],['你请我？','那我就去'],
       ['刚吃完','楼下那家面','汤太咸了'],['（嘴里还塞着）','等下','在吃']]},
  {k:'tired', re:/累|加班|值班|困死|忙死|熬/,
    v:[['累死了'],['别提了','今天忙到现在'],['还行','扛得住'],
       ['今天真是够了，早上加练，下午写报告，晚上还轮到我值夜'],
       ['（直接躺平）','不想动了','你别理我']]},
  {k:'laugh', re:/哈哈|笑死|笑|乐/,
    v:[['哈哈哈哈哈'],['笑死'],['你笑点真低'],
       ['哈哈哈哈，你怎么这么搞笑，我笑到肚子疼'],
       ['（笑）','行了行了','再说我要岔气了']]},
  {k:'miss',  re:/想你|喜欢你|在乎|心动/,
    v:[['……'],['别这么说','我会当真'],['嗯','我也是'],
       ['你这话我存下来了，以后别想赖'],
       ['（很久没回）','欸','我这个人不太会接这种话']]},
  {k:'sorry', re:/对不起|抱歉|不好意思|我的错/,
    v:[['没事'],['算了','下次注意'],['知道了','没生气'],['（叹气）','行吧','下不为例啊']]},
  {k:'thank', re:/谢谢|谢了|多谢|感谢/,
    v:[['客气啥'],['嗯'],['记得就好','不用谢'],['哟','这么客气干嘛']]},
  {k:'ask',   re:/[?？]$|吗$|呢$/,
    v:[['嗯'],['不知道','没想过'],['你说呢'],['大概是吧'],['欸，这问题','我得想想','晚点回你']]},
  {k:'bad',   re:/烦|难受|难过|崩了|不想|emo|抑郁/,
    v:[['我在'],['别自己扛','跟我说说'],['嗯','我听着'],
       ['你别自己憋着，我就是想听你说一句，说完就好了'],
       ['（把手里的东西放下了）','你说','我不急']]},
  {k:'good',  re:/加油|别怕|没事的|会好的|陪你/,
    v:[['……'],['嗯','谢了'],['有你这句就够了'],
       ['知道啦，你也别硬撑，撑不住就来找我，我不笑你'],
       ['（笑了一下）','知道了','你也别硬撑']]},
];
const FREE_DEFAULT=[
  ['嗯'],['哦'],['？'],['欸'],['行'],['唉'],
  ['然后呢'],['这样啊'],['你说得对'],['我刚还在想这事'],
  ['哈哈','你真是'],['等下再跟你说','先去忙'],
  ['欸，说起来','我今天路过塔下那家店','还想着要不要给你带点什么'],
  ['行吧行吧，那你先忙，忙完记得喝口水'],
  ['（打了个哈欠）','困死了','明天还要早班'],
  ['（把手机扣在桌上）','等我一下','我去倒杯水'],
];
const FREE_MULTI=[['你一下子发这么多'],['等下','你慢点说'],['？'],['一条一条来'],['欸欸欸','我一条条看']];
const FREE_POKE=[['你呢'],['你今天怎么样'],['吃饭了吗'],['现在在干嘛'],['（把话题丢回来）','那你呢'],['说点别的吧','我听着']];
function freeReplyFor(txt, batch){
  const out=[];
  if(batch && batch.length>=3 && Math.random()<0.5) out.push(pick(FREE_MULTI).slice());
  for(const t of FREE_TOPIC){ if(t.re.test(txt)){ out.push(pick(t.v).slice()); break; } }
  if(!out.length) out.push(pick(FREE_DEFAULT).slice());
  /* 偶尔再追问一句，让话题能继续聊下去（长短都有） */
  if(Math.random()<0.28) out.push(pick(FREE_POKE).slice());
  return [].concat.apply([], out);
}
function quickSend(k, text){
  const inp=$('freeInput'); if(inp) inp.value=text;
  sendFree(k);
}
function sendFree(k){
  const inp=$('freeInput'); const text=(inp&&inp.value||'').trim(); if(!text) return;
  const cb=$('chatBody'); if(!cb) return;
  const meD=document.createElement('div'); meD.className='bubble me'; meD.textContent=text;
  cb.appendChild(meD); cb.scrollTop=cb.scrollHeight;
  inp.value='';
  if(inp.focus) inp.focus();                  // 连着发几句时不用再点一次输入框
  logPush(k,'me',text);
  touchSave();
  pendOf(k).push(text);
  if(!CHAT_TYPING[k]) freeReplyCycle(k);      // 对方还在回上一轮 → 这几条排队，等下一起回
}
function freeReplyCycle(k){
  const cb=$('chatBody');
  const batch=pendOf(k).splice(0, pendOf(k).length);
  if(!cb || !batch.length){ CHAT_TYPING[k]=false; return; }
  CHAT_TYPING[k]=true;
  const last=batch[batch.length-1];
  const themLines=freeReplyFor(last, batch);
  const an=chatAffName(k);
  if(an){                                     // 自由输入也按口吻判定，幅度收窄，避免刷分
    const tone=/陪|别怕|我在|没事的|加油|温柔|听你说/.test(last)?'温柔'
             :(/想你|喜欢你|直说/.test(last)?'直球'
             :(/哈哈|笑死/.test(last)?'玩笑'
             :(/晚安|先睡|不打扰/.test(last)?'客套':null)));
    applyAff(an, tone?clamp(affOf(an,tone),-5,5):(1+rnd(2)));
  }
  const lg=chatLogOf(k);
  themLines.forEach(x=>logPush(k,'them',x));
  sendThemLines(cb, themLines, ()=>{
    touchSave();
    if(pendOf(k).length) freeReplyCycle(k);   // 玩家又发了几句 → 再来一轮
    else CHAT_TYPING[k]=false;
  });
  refreshAffBar();
}

}

function pickChip(group, el){
  const box=$(group); if(!box) return;
  box.querySelectorAll('.f-chip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
}
function chipVal(group){
  const box=$(group); if(!box) return '';
  const on=box.querySelector('.f-chip.on');
  return on?on.getAttribute('data-v'):'';
}
function submitContact(){
  const name=(($('acName')&&$('acName').value)||'').trim();
  if(!name){ toast('请先填写姓名'); return; }
  if(findPerson(name)){ toast('通讯录里已经有这个人了'); return; }
  const identity=chipVal('acId')||'sentinel';
  const rel=chipVal('acRel')||'好友';
  const animal=(($('acAnimal')&&$('acAnimal').value)||'').trim()||'—';
  const pos=(($('acPos')&&$('acPos').value)||'').trim();
  const bio=(($('acBio')&&$('acBio').value)||'').trim();
  G.userContacts.push({name, identity, animal, pos, dept:'', rank:'—',
    tag:identity==='sentinel'?'自建 · 哨兵':'自建 · 向导',
    bio: bio || '你自行添加的联系人。', color:'#2a2240', userAdded:true});
  G.affinity[name]=G.affinity[name]||0;
  G.relation[name]=rel;
  toast('已加入通讯录 · '+name);
  renderContacts();
}

function findPost(id){ return FORUM.find(p=>p.id===id) || G.userPosts.find(p=>p.id===id); }
const BOARDS = ['闲聊','求助','任务','树洞','官方'];
function postBoard(p){
  if(p.board) return p.board;
  const m=(p.title||'').match(/^【(.+?)】/);
  const t=m?m[1]:'闲聊';
  return t==='置顶'?'官方':(BOARDS.indexOf(t)>=0?t:'闲聊');
}

  const board=G.forumBoard||'全部';

function startNewPost(){
  G.app='forum'; $('appDot').textContent='论坛';
  const me=G.created?C().name:'匿名外勤';
  const idtag=G.created?(C().identity==='sentinel'?'哨兵':'向导'):'匿名';
  const boards=BOARDS.filter(b=>b!=='官方');
  $('screen').innerHTML=`
    ${appBar('发新帖','哨向论坛','renderForum()')}
    <div class="scroll">
      <div class="card" style="background:linear-gradient(180deg,rgba(183,139,255,.08),rgba(90,209,255,.03));border-left:3px solid var(--spirit);">
        <div class="muted" style="font-size:12px;line-height:1.7;">白塔论坛默认<b>匿名</b>，但你的发帖 ID 会带身份标记。发完后会出现在对应<b>板块</b>里，塔里的人可能会回你。</div>
      </div>
      <div class="card">
        <div class="stat-title" style="font-weight:700;color:var(--dim);font-size:13px;margin-bottom:4px;">📝 新帖</div>
        <label class="f-lab">① 板块</label>
        <div class="f-row" id="npBoard">
          ${boards.map((b,i)=>`<span class="f-chip ${i===0?'on':''}" data-v="${b}" onclick="pickChip('npBoard',this)">${b}</span>`).join('')}
        </div>
        <label class="f-lab">② 标题 <span style="color:var(--bad)">*</span></label>
        <input id="npTitle" class="f-inp" placeholder="例如：【闲聊】你们的精神体也会吃醋吗？">
        <label class="f-lab">③ 正文</label>
        <textarea id="npBody" class="f-inp" placeholder="想说什么就写什么吧……"></textarea>
        <label class="f-lab">④ 署名</label>
        <div class="f-row" id="npAnon">
          <span class="f-chip on" data-v="0" onclick="pickChip('npAnon',this)">以「${esc(me)}」署名（${idtag}）</span>
          <span class="f-chip" data-v="1" onclick="pickChip('npAnon',this)">匿名发布</span>
        </div>
        <button class="btn primary" id="npBtn" style="margin-top:14px;">发布</button>
      </div>
    </div>`;
  $('npBtn').onclick=submitPost;
  setTimeout(()=>{ const e=$('npTitle'); if(e) e.focus(); },50);
}
function submitPost(){
  const board=chipVal('npBoard')||'闲聊';
  const title=(($('npTitle')&&$('npTitle').value)||'').trim();
  if(!title){ toast('标题不能为空'); return; }
  const body=(($('npBody')&&$('npBody').value)||'').trim();
  const anon=chipVal('npAnon')==='1';
  const me=G.created?C().name:'匿名外勤';
  const idtag=G.created?(C().identity==='sentinel'?'哨兵':'向导'):'匿名';
  const id='u'+G.userPosts.length+'_'+rnd(9999);
  G.userPosts.unshift({id, name:anon?'匿名':me, idtag:anon?'匿名':idtag, time:'刚刚',
    title:(/^【/.test(title)?title:('【'+board+'】'+title)), board, body:body||'(无内容)', likes:0, comments:[]});
  G.forumBoard=board;
  toast('已发布到「'+board+'」板块');
  renderForum();
}
function likePost(id){ G.forumLiked[id]=!G.forumLiked[id]; if($('cinput_'+id)) renderPostDetail(id); else renderForum(); }
function addComment(id){
  const inp=$('cinput_'+id); const v=(inp&&inp.value||'').trim();
  if(!v) return;
  const p=findPost(id); const me = G.created?C().name:'匿名外勤';
  p.comments.push({n:me, t:v}); inp.value=''; renderPostDetail(id); toast('评论已发送');
}
function focusComment(id){ const e=$('cinput_'+id); if(e) e.focus(); }

/* ============ 匹配系统 ============ */
function renderMatch(){
  G.app='match'; $('appDot').textContent='匹配';
  if(!G.char){ $('screen').innerHTML=`${appBar('匹配中心','哨向结合')}<div class="scroll"><div class="card">请先创建角色。</div></div>`; return; }
  const c=C(); const attr=c.attr;
  // 选择新搭档候选人页
  if(G._changePick){
    const cands=PARTNERS.filter(p=>p.identity!==c.identity && p.name!==c.partnerName);
    const list=cands.map(p=>`<div class="thread" onclick="applyChangePartner('${p.name}')">
      <div class="av" style="background:${p.color}">${p.name[0]}</div>
      <div style="flex:1;min-width:0;"><div class="t-name">${p.name}</div>
      <div class="t-last">${p.tag} · 精神体 ${p.animal}</div></div>
      ${G.affinity[p.name]!=null?`<span class="aff-line" style="margin-left:auto;flex-shrink:0;">${affBadge(G.affinity[p.name])}</span>`:''}
    </div>`).join('');
    $('screen').innerHTML=`${appBar('选择新搭档','搭档调度','renderMatch()')}
      <div class="scroll">
        <div class="card muted" style="font-size:12px;line-height:1.7;">白塔允许在不影响任务的前提下申请更换搭档。选择一位异性觉醒者作为新搭档候选（若当前为伴侣关系，将一并解除）。</div>
        ${list || '<div class="muted">没有可更换的候选。</div>'}
        <button class="btn" style="margin-top:6px;" onclick="G._changePick=false;renderMatch()">取消</button>
      </div>`;
    return;
  }
  // 匹配规则：哨兵只能与向导结合，向导只能与哨兵结合
  const cands=PARTNERS.filter(p=>p.identity!==c.identity).map(p=>({p, score:calcMatch(attr,p)})).sort((a,b)=>b.score-a.score);
  const best=cands[0];
  let appCard='';
  if(G.bondApp){
    const a=G.bondApp; const them=a.them;
    appCard=`<div class="card" style="border-left:3px solid var(--bad);">
      <div class="stat-title" style="font-weight:700;color:var(--dim);font-size:13px;margin-bottom:8px;">结合申请 · ${a.status==='bound'?'已缔结':'待对方确认'}</div>
      <div style="font-size:12px;line-height:1.9;">
        申请人：<b>${a.you.name}</b>（${a.you.id==='sentinel'?'哨兵':'向导'} · ${a.you.rank} · 精神体 ${a.you.animal}）<br>
        被申请人：<b>${them.name}</b>（${them.id==='sentinel'?'哨兵':'向导'} · ${them.tag} · 精神体 ${them.animal}）<br>
        契合度：<b style="color:var(--gold)">${a.score}%</b> · 提交于 ${a.time}
      </div>
      <div class="muted" style="font-size:11px;margin-top:6px;">申请信息双方均可查看。${a.status==='pending'?'等待对方在匹配中心确认……':'结合已成立。'}</div>
      ${a.status==='pending'?`<div style="margin-top:10px;display:flex;gap:8px;"><button class="btn accent" style="margin-top:0;" onclick="confirmBond()">等待对方回应</button><button class="btn" style="margin-top:0;" onclick="cancelBond()">撤回申请</button></div>`:`<div class="muted" style="margin-top:8px;color:var(--bad);">💞 你与 ${them.name} 已结为伴侣，TA 成为你唯一的搭档。</div>`}
    </div>`;
  }
  const cards=cands.map(({p,score})=>{
    const isPartner = c.partnerName===p.name;
    const isApplied = G.bondApp && G.bondApp.to===p.name;
    const bondable = !isPartner && canBondWith(p.name);
    const tag = isPartner ? '<span class="pill" style="color:var(--spirit);border-color:var(--spirit)">★当前搭档</span>'
      : (bondable ? '<span class="pill" style="color:var(--bad);border-color:rgba(255,107,138,.5)">💗 更进一步</span>' : '');
    const act = isPartner ? ''
      : (isApplied ? '<span class="pill" style="color:var(--gold);border-color:var(--gold)">申请中</span>'
        : (bondable ? `<button class="btn primary" style="width:auto;margin-top:0;font-size:12px;padding:6px 10px;" onclick="doMatch('${p.name}')">申请结合</button>` : ''));
    return `<div class="cand">
      <div class="av" style="background:${p.color}">${p.name[0]}</div>
      <div class="c-info"><div class="c-name">${p.name} ${tag}</div>
        <div class="c-meta">${p.tag} · 精神体 ${p.animal} · 契合 ${score}%</div></div>
      <div class="c-act">
        ${act}
        <button class="btn" style="width:auto;margin-top:0;font-size:12px;padding:6px 10px;" onclick="openThreadFromMatch('${p.name}')">聊天</button>
      </div>
    </div>`;
  }).join('');
  /* —— 搭档调度：玩家 / 搭档均可申请更换搭档 —— */
  const cp = c.partnerName;
  const cpAf = G.affinity[cp]||0;
  const cpRel = relInfo(cp);
  const cpBonded = isBondedWith(cp);
  let changeInner = `<div class="stat-title" style="font-weight:700;color:var(--dim);font-size:13px;margin-bottom:8px;">搭档调度</div>
    <div style="font-size:12px;line-height:1.9;">
      现任搭档：<b>${cp}</b> <span class="rel-chip ${cpRel.cls}">${cpRel.label}</span><br>
      好感 ${cpAf}/100 ${cpBonded?`· 契合 ${G.bondApp.score}%`:''}
    </div>`;
  if(cpBonded){
    changeInner += `<div class="muted" style="font-size:11px;margin-top:6px;">你与 ${cp} 已结为<b style="color:var(--bad)">伴侣</b>，TA 即你唯一的搭档。更换搭档将解除伴侣关系。</div>`;
  }
  if(G.partnerChange){
    const pc=G.partnerChange;
    if(pc.from==='me'){
      changeInner += `<div class="muted" style="font-size:12px;margin-top:8px;color:var(--gold);">你已提交更换申请：新搭档 → <b>${pc.to}</b>，等待白塔批复。</div>
        <div style="margin-top:10px;display:flex;gap:8px;">
          <button class="btn primary" style="margin-top:0;" onclick="confirmChangePartner()">确认调度</button>
          <button class="btn" style="margin-top:0;" onclick="rejectPartnerChange()">撤回</button>
        </div>`;
    } else {
      changeInner += `<div class="muted" style="font-size:12px;margin-top:8px;color:var(--gold);">搭档 <b>${pc.fromName||cp}</b> 请求将搭档更换为 <b>${pc.to}</b>。</div>
        <div style="margin-top:10px;display:flex;gap:8px;">
          <button class="btn primary" style="margin-top:0;" onclick="confirmChangePartner()">接受换人</button>
          <button class="btn" style="margin-top:0;" onclick="rejectPartnerChange()">婉拒</button>
        </div>`;
    }
  } else {
    changeInner += `<div style="margin-top:10px;"><button class="btn" style="margin-top:0;" onclick="renderChangeFlow()">申请更换搭档</button></div>`;
    if(!cpBonded && !G._suggestDone && cpAf<50){
      changeInner += `<div class="muted" style="font-size:11px;margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;">搭档 ${cp} 最近似乎有些想法，发来：「最近配合有点生疏……要不要，换个人试试？」</div>
        <div style="margin-top:8px;display:flex;gap:8px;">
          <button class="btn" style="margin-top:0;font-size:12px;" onclick="partnerSuggestChange()">顺水推舟（接受意向）</button>
          <button class="btn" style="margin-top:0;font-size:12px;" onclick="declineSuggestChange()">先不换</button>
        </div>`;
    }
  }
  const changeCard = `<div class="card" style="border-left:3px solid var(--spirit);background:linear-gradient(180deg,rgba(183,139,255,.08),rgba(90,209,255,.03));">${changeInner}</div>`;
  $('screen').innerHTML=`
    ${appBar('匹配中心','哨向结合系统')}
    <div class="scroll">
      ${!G.bondApp?`<div class="match-hero">
        <div class="muted" style="font-size:12px;">当前契合度最高</div>
        <div class="big" style="color:var(--gold)">${best.score}%</div>
        <div style="font-weight:700;">${best.p.name} · ${best.p.tag}</div>
      </div>`:''}
      ${changeCard}
      ${appCard}
      ${cards}
    </div>`;
}
function doMatch(name){
  const p=PARTNERS.find(x=>x.name===name); if(!p) return;
  if(!canBondWith(name)){ toast('契合度或好感度尚未达到更进一步的条件'); return; }
  const c=C(); const score=calcMatch(c.attr,p);
  G.bondApp={ to:p.name, status:'pending', score, time:nowStr(),
    you:{name:c.name, id:c.identity, rank:c.rank, animal:c.animal.n},
    them:{name:p.name, id:p.identity, tag:p.tag, animal:p.animal} };
  toast(`已向 ${p.name} 提交结合申请（契合度 ${score}%）`);
  renderMatch();
}
function confirmBond(){
  if(!G.bondApp||G.bondApp.status!=='pending') return;
  const p=PARTNERS.find(x=>x.name===G.bondApp.to); if(!p) return; const c=C();
  G.bondApp.status='bound';
  G.match={done:true, name:p.name, score:G.bondApp.score};
  // 结合后伴侣即唯一搭档：将搭档更替为伴侣，旧临时搭档自动降级
  c.partnerName=p.name; c.partnerId=p.identity; c.partnerStrong=p.strong; c.linked=false;
  G.affinity[p.name]=G.affinity[p.name]||0;
  toast(`💞 你与 ${p.name} 已结为伴侣，TA 成为你唯一的搭档`);
  renderMatch(); renderHome();
}
function cancelBond(){ G.bondApp=null; toast('已撤回结合申请'); renderMatch(); }
function openThreadFromMatch(name){
  contactChat(name);
}

/* ============ 搭档更换（玩家 / 搭档均可申请） ============ */
function renderChangeFlow(){ G._changePick=true; renderMatch(); }
function applyChangePartner(to){
  const np=PARTNERS.find(p=>p.name===to); if(!np) return;
  if(to===C().partnerName){ toast('该角色已是你的现任搭档'); return; }
  G.partnerChange={ from:'me', to, status:'pending', time:nowStr() };
  G._changePick=false;
  toast(`已提交更换搭档申请：新搭档 → ${to}`); renderMatch();
}
function partnerSuggestChange(){
  const c=C();
  const others=PARTNERS.filter(p=>p.identity!==c.identity && p.name!==c.partnerName);
  if(!others.length){ G._suggestDone=true; toast('暂无合适的替换人选'); renderMatch(); return; }
  const pick=others[rnd(others.length)];
  G.partnerChange={ from:'partner', fromName:c.partnerName, to:pick.name, status:'pending', time:nowStr() };
  G._suggestDone=true; renderMatch();
}
function declineSuggestChange(){ G._suggestDone=true; toast('先不换，再磨合磨合'); renderMatch(); }
function confirmChangePartner(){
  const pc=G.partnerChange; if(!pc||pc.status!=='pending') return;
  const c=C(); const old=c.partnerName;
  if(isBondedWith(old)){ G.bondApp=null; G.match=null; } // 伴侣随旧搭档一并解除
  const np=PARTNERS.find(p=>p.name===pc.to);
  if(np){ c.partnerName=pc.to; c.partnerId=np.identity; c.partnerStrong=np.strong; }
  c.linked=false;
  G.affinity[pc.to]=G.affinity[pc.to]||0;
  G.partnerChange=null; G._changePick=false;
  toast(`白塔已调度：你的新搭档是 ${pc.to}`);
  renderMatch(); renderHome();
}
function rejectPartnerChange(){
  const pc=G.partnerChange; if(!pc||pc.status!=='pending') return;
  toast(pc.from==='partner' ? `已婉拒 ${pc.fromName||'搭档'} 的换人请求` : '已撤回更换搭档申请');
  G.partnerChange=null; renderMatch();
}

function resvFor(id){
  const room=findPlaceById(id);
  return (G.reqs||[]).find(r=>r.status==='accepted' && r.cat==='place' &&
    (r.plId===id || (room && r.subName===room.name))) || null;
}
function resvAny(ids){
  for(let i=0;i<ids.length;i++){ if(resvFor(ids[i])) return true; }
  return false;
}

function mapPlace(pid){ return MAP_PLACES.find(x=>x.id===pid); }
function mapSubs(pl){ return pl && pl.subs ? pl.subs() : []; }
function subOf(pid, sid){ const pl=mapPlace(pid); return mapSubs(pl).find(r=>r.id===sid); }
function dateCandidates(need){
  if(!G.char) return [];
  const min = need||15;
  return [...PARTNERS, ...OTHERS].filter(p=>!p.hidden && (G.affinity[p.name]||0)>=min );
}

function renderMap(){
  G.app='map'; $('appDot').textContent='地图';

  const cards=MAP_PLACES.map(pl=>{
    const subs=mapSubs(pl);
    const locked = pl.needReserve && !(subs.length? resvAny(subs.map(r=>r.id)) : resvFor(pl.id));
    return `<div class="thread" onclick="renderPlace('${pl.id}')">
      <div class="av" style="background:${locked?'#2a1620':'#1f4a42'}">${locked?'🔒':pl.ico}</div>
      <div style="flex:1;min-width:0;">
        <div class="t-name">${pl.name}</div>
        ${pl.brief?`<div class="t-last">${pl.brief}</div>`:''}

      <span class="muted" style="font-size:16px;">›</span>
    </div>`;}).join('');
  const mem=G.dates.length?`<div class="card"><div class="stat-title" style="font-weight:700;color:var(--dim);font-size:13px;margin-bottom:8px;">出游回忆</div>${G.dates.slice(0,8).map(d=>`<div class="comment">📍 ${d.time} · 和 <b>${esc(d.who)}</b> 去了${esc(d.place)}</div>`).join('')}</div>`:'';
  $('screen').innerHTML=`
    ${appBar('地图','')}

      ${cards}
      ${mem}
    </div>`;
  renderTabbar();
}
function renderPlace(pid){
  const pl=mapPlace(pid); if(!pl) return;
  G.app='map';

  if(!subs.length){ renderOuting(pid); return; }
  const list=subs.map(r=>{
    const gated = pl.needReserve && !resvFor(r.id);
    const resv = pl.needReserve ? resvFor(r.id) : null;
    return `<div class="thread" onclick="renderSub('${pid}','${r.id}')">
      <div class="av" style="background:${gated?'#2a1620':'#1f4a42'}">${gated?'🔒':r.ico}</div>

/* ——— 反应靶小游戏：感官 / 体能复测 ——— */
function startReflexGame(d){
  G.app='daily'; $('appDot').textContent='日常';
  G.dg={mode:'reflex', d:d, round:1, total:5, phase:'idle', times:[], msg:'看到靶心变成金色、写着「点！」的那一瞬再按。抢跑要算罚时。', t0:0};
  renderReflex();
}
function renderReflex(){
  const g=G.dg; if(!g||g.mode!=='reflex') return;
  const cls = g.phase==='go'?(g.fake?'fake':'go'):(g.phase==='bad'?'bad':'wait');
  const txt = g.phase==='go'?(g.fake?'别点！':'点！'):(g.phase==='bad'?'抢跑了':'准备…');
  const best = g.times.length? Math.min.apply(null,g.times) : null;
  const last = g.times.length? g.times[g.times.length-1] : null;
  $('screen').innerHTML=`
    ${appBar('反应靶 · 感官复测','日常事务 · 小游戏','renderDaily()')}
    <div class="scroll">
      <div class="card" style="background:linear-gradient(180deg,rgba(255,212,121,.08),rgba(90,209,255,.03));border-left:3px solid var(--gold);">
        <div style="display:flex;justify-content:space-between;font-size:12px;">
          <span>第 <b style="color:var(--ink)">${g.round}</b> / ${g.total} 靶</span>
          <span>最快 <b style="color:var(--good)">${best!=null?best+'ms':'—'}</b>${last!=null?'　上靶 '+last+'ms':''}</span>
        </div>
        <div class="muted" style="font-size:12px;line-height:1.7;margin-top:6px;">金色靶<b>点亮就按</b>；蓝色的「别点」是<b style="color:var(--guide)">假靶</b>，忍住才算过。抢跑、点假靶都记 900ms。</div>
      </div>
      <div class="card" style="text-align:center;">
        <div class="dg-target ${cls}" id="dgTarget">${txt}</div>
        <div class="dg-msg muted" id="dgMsg">${g.msg}</div>
        <button class="btn primary" id="dgBtn" style="margin-top:10px;">${g.phase==='idle'?(g.round>g.times.length?'开始这一靶':'下一靶'):'结束复测 · 返回'}</button>
      </div>
    </div>`;
  $('dgTarget').onclick=reflexTap;
  $('dgBtn').onclick=()=>{ if(!G.dg) return; if(G.dg.phase==='idle') reflexNext(); else renderDaily(); };
}
function reflexNext(){
  const g=G.dg; if(!g||g.mode!=='reflex') return;
  g.phase='wait'; g.fake=Math.random()<0.3;
  g.msg='盯住靶心，别眨眼……'; renderReflex();
  const delay=700+rnd(1500);
  if(g.timer) clearTimeout(g.timer);
  g.timer=setTimeout(()=>{
    const s=G.dg; if(!s||s.mode!=='reflex'||s.phase!=='wait') return;
    s.phase='go'; s.t0=Date.now(); s.msg=s.fake?'蓝色，忍住。':'就是现在！'; renderReflex();
    if(s.fake){   // 假靶：1.2 秒内没点，算稳住
      s.timer=setTimeout(()=>{
        const q=G.dg; if(!q||q.mode!=='reflex'||q.phase!=='go'||!q.fake) return;
        q.phase='idle'; q.times.push(320); q.msg='假靶。你忍住了，教练在对讲里说了句「可以」。';
        renderReflex(); setTimeout(()=>{ if(G.dg) reflexAfter(); }, 800);
      }, 1200);
    }
  }, delay);
}
function reflexTap(){
  const g=G.dg; if(!g||g.mode!=='reflex') return;
  if(g.phase==='wait'){       // 抢跑
    if(g.timer) clearTimeout(g.timer);
    g.phase='bad'; g.times.push(900); g.msg='抢跑了。这一靶记 900ms——复测场上，急比慢更危险。';
    setTimeout(()=>{ if(!G.dg) return; reflexAfter(); }, 900);
    renderReflex(); return;
  }
  if(g.phase!=='go') return;
  if(g.fake){                 // 点了假靶
    g.phase='bad'; g.times.push(900); g.msg='那是假的。蓝色的别碰——记 900ms。';
    setTimeout(()=>{ if(!G.dg) return; reflexAfter(); }, 900);
    renderReflex(); return;
  }
  const dt=Date.now()-g.t0;
  g.times.push(dt);
  g.phase='idle';
  g.msg = dt<250?('⚡ '+dt+'ms。教练在对讲里「哟」了一声。')
        : dt<400?('✅ '+dt+'ms，稳。')
        : dt<600?('🫗 '+dt+'ms，勉强及格。')
        : ('🐢 '+dt+'ms。同期在旁边笑出了声。');
  setTimeout(()=>{ if(!G.dg) return; reflexAfter(); }, 850);
  renderReflex();
}
function reflexAfter(){
  const g=G.dg; if(!g||g.mode!=='reflex') return;
  g.phase='idle';
  if(g.times.length>=g.total){ endReflex(); return; }
  g.round=g.times.length+1;
  renderReflex();
}
function endReflex(){
  const g=G.dg; if(!g) return;
  const times=g.times.slice(); stopDg();
  const avg=Math.round(times.reduce((a,b)=>a+b,0)/times.length);
  const best=Math.min.apply(null,times);
  const c=C();
  let bonusHp=4, tail='';
  if(avg<300){ bonusHp=10; tail='（反应优秀 · 你的感官比大部分同期都干净）'; }
  else if(avg<420){ bonusHp=8; tail='（反应良好 · 复测单上是一个漂亮的 A）'; }
  else if(avg<600){ bonusHp=6; tail='（反应一般 · 还得练）'; }
  else { bonusHp=4; tail='（反应偏慢 · 今天大概没睡好）'; }
  c.hp=clamp(c.hp+bonusHp,0,c.maxhp);
  const res='复测结束：平均 '+avg+'ms，最快 '+best+'ms。'+tail;
  G.userAffairs.unshift({time:nowStr(), title:'感官 / 体能复测', result:res+`（HP+${bonusHp}）`});
  $('screen').innerHTML=`
    ${appBar('复测完成','日常事务 · 小游戏')}
    <div class="scroll">
      <div class="card" style="text-align:center;">
        <div style="font-size:34px;">🎯</div>
        <div style="font-weight:700;font-size:16px;margin-top:6px;">平均 ${avg}ms · 最快 ${best}ms</div>
        <div class="muted" style="font-size:13px;line-height:1.8;margin-top:6px;">${res}</div>
        <div style="margin-top:10px;font-size:13px;color:var(--good);">HP +${bonusHp}</div>
        <div class="muted" style="font-size:11px;margin-top:8px;">五靶成绩：${times.join(' / ')} ms</div>
      </div>
      <button class="btn primary" onclick="retryDaily()">再来一组</button>
      <button class="btn" onclick="renderDaily()">回到日常事务</button>
    </div>`;
}

function missedCallCount(){ if(!G.calls) return 0; return G.calls.filter(c=>c.status==='missed'&&!c.seen).length; }
function missedBy(name){ return (G.calls||[]).filter(c=>c.status==='missed'&&!c.seen&&c.name===name).length; }
function markCallsSeen(name){
  (G.calls||[]).forEach(c=>{ if(c.status==='missed'&&(!name||c.name===name)) c.seen=true; });
}

/* ——— 声线：每局跟着人一起随机分配（同性格、姓名一样，不显示给玩家，靠耳朵认） ——— */
function hashStr(s){ let h=2166136261; for(let i=0;i<String(s).length;i++){ h^=String(s).charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0); }
function rollVoiceProfile(){
  return {
    rate:  +(0.94+Math.random()*0.16).toFixed(2),
    pitch: +(0.88+Math.random()*0.26).toFixed(2),
    volume:+(0.94+Math.random()*0.06).toFixed(2),
    vIdx:  Math.floor(Math.random()*997),
  };
}
function voiceProfileOf(name){
  const p=findPerson(name);
  if(p && p.voice) return p.voice;
  if(!G) return rollVoiceProfile();
  if(!G.voiceProfiles) G.voiceProfiles={};
  if(!G.voiceProfiles[name]) G.voiceProfiles[name]=rollVoiceProfile();
  return G.voiceProfiles[name];
}
function voiceLabelOf(name){
  const v=voiceProfileOf(name);
  const low=v.pitch<0.94, high=v.pitch>1.06, fast=v.rate>1.02, slow=v.rate<0.98;
  return (low?'低声':(high?'清亮':'中性'))+' · '+(fast?'快':(slow?'慢':'中速'));
}
/* ——— 选音色：优先系统里质量高的中文语音，不同 NPC 尽量分到不同音色 ——— */
let VOICE_LIST=[];
function refreshVoices(){
  try{
    const all=(window.speechSynthesis.getVoices()||[]);
    VOICE_LIST=all.filter(v=>/zh|Chinese|中文|普通话|国语/i.test((v.lang||'')+' '+(v.name||'')));
  }catch(e){ VOICE_LIST=[]; }
  return VOICE_LIST;
}
function voiceScore(v){
  let s=0;
  if(/natural|neural|online|premium|enhanced|plus/i.test(v.name||'')) s+=8;
  if(/xiaoxiao|xiaoyi|yunxi|yunyang|yunjian|晓晓|晓伊|云希|云扬|云健|小萍|小艺/i.test(v.name||'')) s+=5;
  if(/huihui|kangkang|yaoyao|huihui|慧慧|康康|瑶瑶/i.test(v.name||'')) s+=2;
  if(v.localService) s+=2;
  if(/desktop/i.test(v.name||'')) s-=4;
  if(/^zh[-_]CN/i.test(v.lang||'')) s+=2;
  return s;
}
function bestVoices(){
  const vs=(VOICE_LIST.length?VOICE_LIST:refreshVoices()).slice();
  vs.sort((a,b)=>voiceScore(b)-voiceScore(a));
  return vs;
}
function voiceFor(name){
  const vs=bestVoices(); if(!vs.length) return null;
  const pool=vs.slice(0, Math.min(6, vs.length));
  return pool[voiceProfileOf(name).vIdx % pool.length];
}
/* ——— 断句 + 语气起伏：避免一口气平读，让朗读有呼吸和情绪 ——— */
function cleanSpeechText(t){
  return String(t)
    .replace(/[（(][^）)]*[）)]/g,'')      // 去掉舞台提示
    .replace(/[【】\[\]]/g,'')
    .replace(/[「」“”"]/g,'')
    .replace(/——|--/g,'，')
    .replace(/\s+/g,' ')
    .trim();
}
function splitProsody(text){
  const clean=cleanSpeechText(text);
  if(!clean) return [];
  const raw=clean.split(/(?<=[。！？!?…；;])/).map(s=>s.trim()).filter(Boolean);
  const out=[];
  raw.forEach(p=>{
    if(out.length && (out[out.length-1].replace(/[，、,]/g,'').length<5 || p.replace(/[，、,]/g,'').length<4)) out[out.length-1]+=p;
    else out.push(p);
  });
  return out.length?out:[clean];
}
function prosodyOf(seg, prof, i){
  const end=seg.slice(-1);
  let rate=prof.rate, pitch=prof.pitch, pause=170;
  if(/[？?]/.test(end)){ pitch+=0.06; rate*=1.01; pause=240; }
  else if(/[！!]/.test(end)){ rate*=1.04; pitch+=0.03; pause=280; }
  else if(/[…]/.test(seg)){ rate*=0.94; pause=400; }
  else if(/[，、,；;]/.test(end)){ rate*=0.99; pause=130; }
  /* 轻微起伏：句与句之间音高/语速交替，别读成一条直线 */
  const j=((i*29)%5)/100;
  rate*=(1 + (i%2? j : -j));
  pitch=pitch + ((i%3)-1)*0.025;
  return { rate:Math.max(0.6, Math.min(1.5, rate)), pitch:Math.max(0.5, Math.min(1.6, pitch)), pause };
}
let SPEAK_TOKEN=0;
function speakText(t, name){
  if(!G.voice) return;
  try{
    if(!window.speechSynthesis || typeof SpeechSynthesisUtterance==='undefined') return;
    window.speechSynthesis.cancel();
    const token=++SPEAK_TOKEN;
    const prof=name?voiceProfileOf(name):{rate:1.0,pitch:1.0,volume:1,vIdx:0};
    if(!VOICE_LIST.length) refreshVoices();     // 浏览器首次可能还没加载语音列表
    const v=name?voiceFor(name):null;
    const segs=splitProsody(t);
    if(!segs.length) return;
    const step=(idx)=>{
      if(token!==SPEAK_TOKEN) return;            // 有新通话/新消息，立刻让位
      if(idx>=segs.length) return;
      const seg=segs[idx];
      const pr=prosodyOf(seg, prof, idx);
      const u=new SpeechSynthesisUtterance(seg);
      u.lang=(v&&v.lang)||'zh-CN';
      u.rate=pr.rate; u.pitch=pr.pitch;
      u.volume=Math.max(0, Math.min(1, prof.volume*(0.97+((idx%3)*0.015))));
      if(v) u.voice=v;
      u.onend=()=>{ if(token===SPEAK_TOKEN) setTimeout(()=>step(idx+1), pr.pause); };
      u.onerror=()=>{ if(token===SPEAK_TOKEN) setTimeout(()=>step(idx+1), 70); };
      window.speechSynthesis.speak(u);
    };
    step(0);
  }catch(e){}
}

function callReply(i){
  const c=G.call; if(!c||c.phase!=='talk') return;
  const st=CALL_SCRIPTS[c.rel][c.step]; if(!st) return;
  const o=st.opts[i];
  applyToneAff(c.name, o.tone, o.d);
  c.lines.push({who:'me', t:resolve(o.t)});
  c.step++;
  const nx=CALL_SCRIPTS[c.rel][c.step];
  if(!nx){
    const sec=Math.round((Date.now()-c.t0)/1000);
    G.calls.unshift({name:c.name, time:nowStr(), status:'out', dur:sec+' 秒', seen:true});
    G.call=null; toast('通话结束（'+sec+' 秒）'); renderPhone(); return;
  }
  c.lines.push({who:'them', t:nx.them});
  renderCall(); speakText(nx.them, c.name);
}
function hangUp(){
  const c=G.call; if(!c) return;
  if(c.timer) clearTimeout(c.timer);
  const sec=Math.round((Date.now()-c.t0)/1000);
  try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
  if(c.phase==='talk') G.calls.unshift({name:c.name, time:nowStr(), status:'out', dur:sec+' 秒', seen:true});
  else if(c.phase==='dialing') G.calls.unshift({name:c.name, time:nowStr(), status:'missed', seen:true});
  G.call=null; renderPhone();
}
