  G.app='soothe_book';
  const accept = act==='accept';
  const roomOpts = Array.from({length:10},(_,i)=>`<option ${i===0?'selected':''}>疏导室 ${i+1} 号</option>`).join('');
  const pre = accept ? pick(GUIDE_NOTES) : '这个时段我真的排不开，已经转给白塔指派别的向导，别耽误了你。';
  $('screen').innerHTML=`
    ${appBar(accept?'同意这次疏导':'拒绝这次疏导','回复 · 白塔疏导室','renderSootheBook()')}
    <div class="scroll">
      <div class="card" style="background:linear-gradient(180deg,rgba(183,139,255,.08),rgba(90,209,255,.03));border-left:3px solid var(--spirit);">
        <div style="font-size:12px;line-height:1.7;"><b>${r.from}</b>（${r.no||''}）申请「${r.type||'表层疏导 · 卸除杂念'}」，期望时段 ${r.slot||'待定'}，紧急程度 ${(r.level||'常规').split(' · ')[0]}。</div>
      </div>
      ${accept?`<div class="card">
        <div class="stat-title" style="font-weight:700;color:var(--dim);font-size:13px;margin-bottom:6px;">① 指定疏导室（白塔 1–10 号）</div>
        <select id="roomSel" class="f-inp">${roomOpts}</select>
        <div class="muted" style="font-size:11px;margin-top:6px;line-height:1.6;">1–3 号屏障较薄，适合表层；4–7 号标准；8–10 号加了深层净化设备，适合深层净化与应急压制。</div>
      </div>`:''}
      <div class="card">
        <div class="stat-title" style="font-weight:700;color:var(--dim);font-size:13px;margin-bottom:6px;">${accept?'②':'①'} 回复 TA（会自动套用向导口吻，可自行改写）</div>
        <textarea id="replyTxt" class="f-inp" style="min-height:120px;">${esc(pre)}</textarea>
      </div>
      <button class="btn ${accept?'primary':''}" onclick="${accept?'acceptSoothe':'rejectSoothe'}('${from}')">${accept?'同意并发送回复':'拒绝并回复'}</button>
      <button class="btn" onclick="renderSootheBook()">再想想</button>
    </div>`;
}
function acceptSoothe(from){
  const r=G.sootheReqs.find(x=>x.from===from && x.to===C().name && x.status==='pending'); if(!r) return;
  r.status='accepted';
  const sel=$('roomSel'); if(sel) r.room=sel.value;
  const tx=$('replyTxt'); if(tx) r.reply=(tx.value||'').trim()||'按时到，别硬撑。';
  const time=(r.slot && r.slot.indexOf('今夜')===0)?'今夜 22:30':('次日 '+(r.slot||'09:00').replace(/[^\d:]/g,'')||'09:00');
  G.schedule.unshift({who:from, time, kind:(r.type||'表层疏导'), room:(r.room||'疏导室 1 号')});
  G.userAffairs.unshift({time:nowStr(),title:'疏导预约',result:`已同意 ${from} 的申请（${r.no||''}）：${time} · ${r.room||'疏导室 1 号'} · ${r.type||'表层疏导'}。已发送注意事项。`});
  bumpAffFor(from, 3);
  toast(`已同意 ${from} 的疏导`); renderSootheBook();
}
function rejectSoothe(from){
  const r=G.sootheReqs.find(x=>x.from===from && x.to===C().name && x.status==='pending'); if(!r) return;
  r.status='rejected';
  const tx=$('replyTxt'); if(tx) r.reply=(tx.value||'').trim()||'这个时段我排不开，已转给白塔指派。';
  G.userAffairs.unshift({time:nowStr(),title:'疏导预约',result:`已拒绝 ${from} 的申请（${r.no||''}），并说明了原因。`});
  toast(`已拒绝 ${from}`); renderSootheBook();
}
/* ============ 结合热登记（哨兵 / 向导都可能有 · 独立页） ============ */
const HEAT_LEVELS=['轻 · 可自理，不影响外勤','中 · 需请假半天','重 · 需应急压制','已出现失控前兆'];
const HEAT_SYMPTOMS=['体温升高','感官过载','屏障发烫','情绪失控','嗜睡','共感外溢','精神体躁动','失眠'];
let HEAT_PICK={};
function toggleHeatChip(el){
  const k=el.getAttribute('data-k');
  const on=!el.classList.contains('on');
  el.classList.toggle('on', on);
  HEAT_PICK[k]=on;
}
function heatMatchInfo(){
  const c=C();
  const p=findPerson(c.partnerName);
  const m=p?calcMatch(c.attr,p):0;
  return {name:c.partnerName, val:m, high:m>=85, p};
}
function renderHeatReg(){
  G.app='heat_reg'; $('appDot').textContent='结合热';
  if(!G.char){ $('screen').innerHTML=`${appBar('结合热登记','')}<div class="scroll"><div class="card">请先创建角色。</div></div>`; renderTabbar(); return; }
  const c=C();
  const r=G.heatReg;
  const mi=heatMatchInfo();
  const idColor=c.identity==='sentinel'?'var(--sentinel)':'var(--guide)';
  const hist = G.heatRegLog.length ? G.heatRegLog.slice(0,6).map(x=>`<div class="comment"><b>${x.at}</b> · ${x.date} ${x.time}｜症状：${(x.symptoms&&x.symptoms.length?x.symptoms.join('、'):'未填')}｜抑制剂：${x.inhib}｜医疗配合：${x.medical}｜${x.partner}</div>`).join('') : '<div class="muted" style="font-size:12px;">还没有登记记录。</div>';
  const rf=(id,opts,label,val)=>`<label class="f-lab">${label}</label>
    <select id="${id}" class="f-inp">${opts.map(o=>`<option value="${o.v}" ${String(val)===String(o.v)?'selected':''}>${o.t}</option>`).join('')}</select>`;
  const today=new Date();
  const defDate=(r&&r.date)?r.date:(new Date(today.getTime()+86400000).toISOString().slice(0,10));
  const sym=r&&r.symptoms?r.symptoms:[];
  HEAT_PICK={}; sym.forEach(s=>HEAT_PICK[s]=true);
  $('screen').innerHTML=`
    ${appBar('结合热登记','','renderHome()')}
    <div class="scroll">
      <div class="card" style="background:linear-gradient(180deg,rgba(255,107,138,.07),rgba(183,139,255,.03));border-left:3px solid var(--bad);">
        <div style="font-size:12px;line-height:1.9;">
          <div>登记人：<b>${esc(c.name)}</b>　身份：<b style="color:${idColor}">${c.identity==='sentinel'?'哨兵':'向导'}</b>　评级：<b>${c.rank}</b>　精神体：${c.animal.n}</div>
          <div>搭档：<b>${esc(mi.name)}</b>　契合度：<b style="color:${mi.high?'var(--bad)':'var(--gold)'}">${mi.val}%</b>${mi.high?'　<span style="color:var(--bad)">契合度 ≥85% · 可能引发结合热</span>':'　<span class="muted">未达 85%，一般不会发作</span>'}</div>
        </div>
        <div class="muted" style="font-size:11px;line-height:1.7;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;">
          判定：向导与契合度 ≥85% 的哨兵建立连接后，可能引发结合热。
        </div>
      </div>
      <div class="card">
        <div class="stat-title" style="font-weight:700;font-size:14px;margin-bottom:8px;">🌡 本次报备</div>
        <label class="f-lab">① 具体日期</label>
        <input id="hrDate" class="f-inp" type="date" value="${defDate}">
        ${rf('hrTime',[{v:'白天',t:'白天（09:00–15:00）'},{v:'傍晚',t:'傍晚（15:00–20:00）'},{v:'夜间',t:'夜间（20:00–01:00）'},{v:'凌晨',t:'凌晨（01:00–06:00）'},{v:'整天',t:'整日不定'}],'② 时段', r?r.time:'夜间')}
        <label class="f-lab">③ 症状（可多选）</label>
        <div class="f-row" style="margin-top:0;">${HEAT_SYMPTOMS.map(s=>`<span class="f-chip ${sym.indexOf(s)>=0?'on':''}" data-k="${s}" onclick="toggleHeatChip(this)">${s}</span>`).join('')}</div>
        ${rf('hrLevel',HEAT_LEVELS.map(x=>({v:x,t:x})),'④ 预计强度', r?r.level:HEAT_LEVELS[0])}
        ${rf('hrInhib',[{v:'已领',t:'抑制剂已领，存量充足'},{v:'存量不足',t:'已领，但存量不足'},{v:'未领',t:'未领（需去「申请」提交领取）'},{v:'已用尽',t:'已用尽'}],'⑤ 抑制剂情况', r?r.inhib:'已领')}
        ${rf('hrMedical',[{v:'不需要',t:'不需要医疗配合'},{v:'需要',t:'需要医疗配合（医务室待命）'},{v:'待定',t:'待定，看当天状态'}],'⑥ 是否需要医疗配合', r?r.medical:'待定')}
        ${rf('hrPartner',[{v:'已告知',t:'已告知搭档'},{v:'未告知',t:'暂未告知'},{v:'无搭档',t:'暂无搭档'},{v:'不便告知',t:'不便告知'}],'⑦ 搭档知悉情况', r?r.partner:'未告知')}
        <label class="f-lab">⑧ 备注</label>
        <textarea id="hrNote" class="f-inp" placeholder="例如：怕光怕声音，希望安排靠里的房间；这次比上次提前了三天。">${r?esc(r.note):''}</textarea>
        <button class="btn primary" style="margin-top:14px;" onclick="submitHeatReg()">提交报备</button>
      </div>
      <div class="card"><div class="stat-title" style="font-weight:700;color:var(--dim);font-size:13px;margin-bottom:8px;">我的报备记录</div>${hist}</div>
    </div>`;
  renderTabbar();
}
function submitHeatReg(){
  const c=C(); if(!c) return;
  const g=(id,d)=>{ const e=$(id); return e&&e.value!==''?e.value:d; };
  const date=g('hrDate','');
  const symptoms=Object.keys(HEAT_PICK).filter(k=>HEAT_PICK[k]);
  const rec={
    at:nowStr(), date:date, time:g('hrTime','夜间'), symptoms:symptoms,
    level:g('hrLevel',HEAT_LEVELS[0]), inhib:g('hrInhib','已领'),
    medical:g('hrMedical','待定'), partner:g('hrPartner','未告知'),
    note:(($('hrNote')&&$('hrNote').value)||'').trim(),
    ident:c.identity, partnerName:c.partnerName,
  };
  G.heatReg=rec;
  G.heatRegLog.unshift(rec);
  G.userAffairs.unshift({time:nowStr(), title:'结合热报备',
    result:`${rec.date} ${rec.time}｜症状：${symptoms.length?symptoms.join('、'):'未填'}｜${rec.level.split(' · ')[0]}｜抑制剂 ${rec.inhib}｜医疗配合：${rec.medical}｜${rec.partner}。`});
  toast('结合热报备已提交');
  renderHeatReg();
}
function renderInhibitor(){ renderHeatReg(); }


/* ============ 日历 / 日程：把疏导预约、场地、领取、结合热周期、出游都排进来 ============ */
const CAL_COLOR={soothe:'#4fd6ff', place:'#4ef0b6', inhibitor:'#ffc857', item:'#7b93b8', heat:'#ff5f8a', date:'#9d8bff', mission:'#ffd479'};
function pad2(n){ return String(n).padStart(2,'0'); }
function dayKeyOf(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function addDays(base,n){ const d=new Date(base.getTime()); d.setDate(d.getDate()+n); return d; }
/* 把「今日 13:00–15:00 / 今夜 22:30 后 / 明日 09:00 / 周末 · 自由约」这类文字解析成日期 */
function parseSlotDate(str){
  const today=new Date();
  if(!str) return {d:today, time:'', approx:true};
  let off=0, approx=false;
  if(str.indexOf('今日')===0||str.indexOf('今夜')===0) off=0;
  else if(str.indexOf('明日')===0||str.indexOf('次日')===0) off=1;
  else if(str.indexOf('周末')===0) off=((6-today.getDay())+7)%7;
  else approx=true;
  const m=String(str).match(/(\d{1,2}):(\d{2})/);
  return {d:addDays(today,off), time:m?(pad2(m[1])+':'+m[2]):'', approx:(approx||!m||str.indexOf('自由约')>=0)};
}
function calendarEvents(){
  const out=[]; const today=new Date();
  /* 向导接单后排定的疏导 */
  (G.schedule||[]).forEach(s=>{
    const p=parseSlotDate(s.time);
    out.push({d:p.d, time:p.time, ico:'🫧', kind:'soothe', title:'为 '+s.who+' 做疏导',
      sub:(s.kind||'表层疏导')+' · '+(s.room||'疏导室待定'), src:'疏导预约'});
  });
  /* 已批复的申请 */
  (G.reqs||[]).forEach(r=>{
    if(r.status!=='accepted') return;
    if(r.cat==='place'){
      const p=parseSlotDate(r.slot);
      out.push({d:p.d, time:p.time, ico:'📍', kind:'place', title:'场地预约 · '+(r.subName||''),
        sub:(r.dur||'')+' · '+(r.no||''), src:'地点预约'});
    } else if(r.cat==='soothe'){
      const p=parseSlotDate(r.slot);
      out.push({d:p.d, time:p.time, ico:'🫧', kind:'soothe', title:'疏导 · '+(r.subName||''),
        sub:(r.type||'')+' · '+(r.room||'待向导指定'), src:'疏导申请'});
    } else if(r.cat==='inhibitor'){
      out.push({d:today, time:'', ico:'💊', kind:'inhibitor', title:'抑制剂领取 · '+(r.subName||''),
        sub:(r.place||'医务室窗口')+' · 待领取', src:'抑制剂领取'});
    } else if(r.cat==='item'){
      out.push({d:today, time:'', ico:'📦', kind:'item', title:'物资领取 · '+(r.subName||''),
        sub:(r.qty||'')+' · 送到储物柜，记得签收', src:'物资申请'});
    }
  });
  /* 向导的结合热周期 */
  if(G.heatReg && G.heatReg.date){
    const hd=new Date(String(G.heatReg.date)+'T00:00:00');
    const tmMap={'白天':'10:00','傍晚':'18:00','夜间':'22:00','凌晨':'02:00'};
    const subParts=[];
    if(G.heatReg.symptoms && G.heatReg.symptoms.length) subParts.push('症状 '+G.heatReg.symptoms.slice(0,3).join('、'));
    if(G.heatReg.level) subParts.push(G.heatReg.level.split(' · ')[0]);
    subParts.push('抑制剂 '+G.heatReg.inhib);
    if(G.heatReg.medical && G.heatReg.medical!=='不需要') subParts.push('医疗配合：'+G.heatReg.medical);
    subParts.push(G.heatReg.partner||'');
    out.push({d:(isNaN(hd.getTime())?today:hd), time:(tmMap[G.heatReg.time]||''), ico:'🌡', kind:'heat',
      title:'结合热报备', sub:subParts.filter(Boolean).join(' · '), src:'结合热登记'});
  }
  /* 出游回忆 */
  (G.dates||[]).forEach(x=>{
    const m=String(x.time||'').match(/(\d{1,2})\/(\d{1,2})/);
    const d=m? new Date(today.getFullYear(), parseInt(m[1],10)-1, parseInt(m[2],10)) : today;
    out.push({d, time:'', ico:'💞', kind:'date', title:'和 '+x.who+' 去了'+x.place, sub:'出游回忆', src:'地图'});
  });
  /* 已接任务 */
  Object.keys(G.missionsDone||{}).forEach(k=>{
    const mi=MISSIONS.find(x=>x.meta.key===k); if(!mi) return;
    out.push({d:today, time:'', ico:'🏛', kind:'mission', title:'已完成任务 · '+mi.meta.name, sub:'评级 '+G.missionsDone[k], src:'任务中心'});
  });
  return out;
}
function calNav(n){ const b=G.calMonth?new Date(G.calMonth):new Date(); G.calMonth=new Date(b.getFullYear(), b.getMonth()+n, 1).getTime(); renderCalendar(); }
function calToday(){ const t=new Date(); G.calMonth=new Date(t.getFullYear(),t.getMonth(),1).getTime(); G.calDay=dayKeyOf(t); renderCalendar(); }
function calPick(key){ G.calDay=key; renderCalendar(); }
function renderCalendar(){
  G.app='calendar'; $('appDot').textContent='日历';
  if(!G.char){ $('screen').innerHTML=`${appBar('日历','白塔日程')}<div class="scroll"><div class="card">请先创建角色。</div></div>`; renderTabbar(); return; }
  const today=new Date();
  if(!G.calMonth) G.calMonth=new Date(today.getFullYear(),today.getMonth(),1).getTime();
  const base=new Date(G.calMonth);
  const y=base.getFullYear(), m=base.getMonth();
  const firstW=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const evs=calendarEvents();
  const byDay={};
  evs.forEach(e=>{ const k=dayKeyOf(e.d); (byDay[k]=byDay[k]||[]).push(e); });
  const selKey=G.calDay||dayKeyOf(today);
  let cells='';
  for(let i=0;i<firstW;i++) cells+='<div class="cal-cell empty"></div>';
  for(let d=1; d<=days; d++){
    const key=y+'-'+pad2(m+1)+'-'+pad2(d);
    const list=byDay[key]||[];
    const cls=(dayKeyOf(today)===key?' today':'')+(selKey===key?' sel':'');
    cells+=`<div class="cal-cell${cls}" onclick="calPick('${key}')"><span>${d}</span>
      <span class="dots">${list.slice(0,4).map(e=>`<i style="background:${CAL_COLOR[e.kind]||'#7b93b8'}"></i>`).join('')}</span></div>`;
  }
  const dayList=(byDay[selKey]||[]);
  const dayHtml=dayList.length?dayList.map(e=>`<div class="card" style="border-left:3px solid ${CAL_COLOR[e.kind]||'#7b93b8'};">
      <div style="display:flex;align-items:center;gap:9px;">
        <div class="av" style="width:36px;height:36px;font-size:18px;background:#0b1424">${e.ico}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:700;font-size:14px;">${esc(e.title)}${e.time?` <span class="pill" style="font-size:9px;color:${CAL_COLOR[e.kind]||'var(--dim)'};border-color:currentColor">${e.time}</span>`:''}</div>
          <div class="muted" style="font-size:11px;">${esc(e.sub||'')}</div>
        </div>
        <span class="pill" style="font-size:9px;color:var(--dim);border-color:var(--line);">${esc(e.src)}</span>
      </div></div>`).join('')
    :'<div class="muted" style="font-size:12px;">这一天没有安排。</div>';
  const upcoming=evs.filter(e=>e.d.getTime()>=new Date(today.getFullYear(),today.getMonth(),today.getDate()).getTime())
    .sort((a,b)=>a.d-b.d).slice(0,6);
  const upHtml=upcoming.length?upcoming.map(e=>`<div class="comment">${e.ico} <b>${e.d.getMonth()+1}/${e.d.getDate()}</b>${e.time?' '+e.time:''} · ${esc(e.title)}<br><span style="opacity:.8;">${esc(e.sub||'')} · 来源：${esc(e.src)}</span></div>`).join('')
    :'<div class="muted" style="font-size:12px;">近期没有日程。</div>';
  $('screen').innerHTML=`
    ${appBar('日历','')}
    <div class="scroll">
      <div class="card">
        <div class="cal-head">
          <div class="nav" onclick="calNav(-1)">‹</div>
          <div style="font-weight:700;letter-spacing:.5px;">${y} 年 ${m+1} 月</div>
          <div class="nav" onclick="calNav(1)">›</div>
        </div>
        <div class="cal-grid">
          ${['日','一','二','三','四','五','六'].map(w=>`<div class="cal-w">${w}</div>`).join('')}
          ${cells}
        </div>
        <button class="btn" style="margin-top:10px;" onclick="calToday()">回到今天</button>
      </div>
      <div class="stat-title" style="font-weight:700;color:var(--dim);font-size:13px;margin:4px 0 8px;">${selKey} 的安排（${dayList.length}）</div>
      ${dayHtml}
      <div class="card"><div class="stat-title" style="font-weight:700;color:var(--dim);font-size:13px;margin-bottom:8px;">近期日程</div>${upHtml}</div>
    </div>`;
  renderTabbar();
}
/* ============ 启动 ============ */
newGame();
mEnsureGlobals();
tickClock(); setInterval(tickClock, 30000);
renderHome();
</script>
