<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>白塔</title>
<style>
  :root{
    --bg:#03060c; --screen:#060b14; --panel:#0a1220; --panel2:#0e1a2c;
    --ink:#e9f6ff; --dim:#7d94b5; --line:#1b3550;
    --sentinel:#ff5f7a; --guide:#3ee0ff; --gold:#ffc861;
    --good:#4ff0b4; --bad:#ff5f8a; --spirit:#8b7bff; --accent:#2ee6d6;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Cascadia Mono",monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(900px 500px at 50% -10%, #16203b 0%, var(--bg) 65%);
    color:var(--ink); font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
    line-height:1.7; letter-spacing:.2px; display:flex; justify-content:center; min-height:100%;
  }

  /* ===== 手机外壳 =====
     用 position:fixed 钉满可视区（含 iframe/面板），不依赖任何祖先高度，
     确保无论挂载容器多高、是否 overflow:hidden，手机框都恰好等于可见区，
     内部 .scroll/.home 才能稳定滚动。 */
  .phone{
    position:fixed; top:0; left:0; right:0; bottom:0; margin:auto;
    width:100%; max-width:430px; height:100%; background:var(--screen);
    border-left:1px solid var(--line); border-right:1px solid var(--line);
    display:flex; flex-direction:column; overflow:hidden;
  }
  /* 宽屏下呈现为居中的手机机身（圆角边框 + 投影），小屏仍全屏铺满 */
  @media (min-width:520px){
    .phone{height:min(94vh,900px); border-radius:38px;
      border:1px solid rgba(125,155,225,.28);
      box-shadow:0 0 0 10px rgba(13,18,34,.92), 0 0 0 11px rgba(96,126,205,.22), 0 40px 90px rgba(0,0,0,.7);}
  }
  /* #screen 作为手机外壳内的内容宿主，必须参与 flex 并允许收缩，内部面板才能滚动 */
  #screen{flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden;}
  .statusbar{display:flex;justify-content:space-between;align-items:center;padding:9px 18px 5px;font-size:13px;font-weight:600;color:var(--ink);
    background:linear-gradient(180deg,#0c1224,#0a0e1a);border-bottom:1px solid rgba(255,255,255,.04);}
  .statusbar .icons{display:flex;gap:7px;align-items:center;color:var(--dim);font-size:12px;}
  .notch{height:2px;}

  /* ===== 锁屏（现代手机风） ===== */
  .lock{position:absolute;inset:0;background:linear-gradient(165deg,#0b1226,#160d2c 55%,#0a0e1a);
    background-size:100% 100%; display:flex;flex-direction:column;align-items:center;z-index:40;cursor:pointer;overflow:hidden;padding-top:13%;}
  .lock::after{content:"";position:absolute;width:340px;height:340px;border-radius:50%;top:-120px;right:-90px;
    background:radial-gradient(circle,rgba(183,139,255,.30),transparent 70%);filter:blur(8px);pointer-events:none;}
  .lock::before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;bottom:-120px;left:-80px;
    background:radial-gradient(circle,rgba(90,209,255,.22),transparent 70%);filter:blur(8px);pointer-events:none;}
  .lock-status{position:relative;width:100%;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:14px;color:var(--ink);font-weight:600;z-index:2;}
  .lock-status .ls-icons{display:flex;gap:7px;align-items:center;color:var(--dim);font-size:13px;}
  .lock-clock{position:relative;z-index:2;font-size:74px;font-weight:200;letter-spacing:1px;margin-top:26px;line-height:1;
    text-shadow:0 4px 34px rgba(183,139,255,.28);}
  .lock-date{position:relative;z-index:2;font-size:16px;color:#c3cdf2;margin-top:6px;font-weight:500;}
  .lock-widget{position:relative;z-index:2;margin-top:34px;width:78%;max-width:300px;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:14px 16px;backdrop-filter:blur(8px);
    box-shadow:0 10px 30px rgba(0,0,0,.35);}
  .lock-widget .lw-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .lock-widget .lw-title .dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good);}
  .lock-widget .lw-sub{font-size:12px;color:var(--dim);margin-top:5px;line-height:1.5;}
  .lock-widget .lw-row{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;}
  .lock-widget .lw-row .k{color:var(--dim);}
  .lock-hint{position:relative;z-index:2;margin-top:auto;margin-bottom:26px;display:flex;flex-direction:column;align-items:center;gap:6px;
    color:var(--dim);font-size:13px;animation:pulse 2.2s infinite;}
  .lock-hint .chev{font-size:18px;}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

  /* ===== 主屏 ===== */
  .home{flex:1;min-height:0;padding:18px 18px 10px;overflow:auto;-webkit-overflow-scrolling:touch;
    background:radial-gradient(680px 360px at 50% -12%, rgba(183,139,255,.10), transparent 62%);}
  .home-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:4px;}
  .home-head .greet{font-size:23px;font-weight:700;letter-spacing:.5px;}
  .home-head .sub{font-size:12px;color:var(--dim);margin-top:2px;}
  .home-clock{font-size:12px;color:var(--dim);text-align:right;font-weight:600;}
  .home-clock b{color:var(--ink);font-size:14px;}
  .app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px;margin-top:24px;}
  .app{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .12s;position:relative;}
  .app:active{transform:scale(.92);}
  .app .ico{width:60px;height:60px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;
    box-shadow:0 8px 20px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.10);position:relative;overflow:hidden;}
  .app .ico::after{content:"";position:absolute;top:6px;left:10px;right:10px;height:42%;border-radius:14px;
    background:linear-gradient(180deg,rgba(255,255,255,.18),transparent);pointer-events:none;}
  .app .lbl{font-size:12px;color:#e6ecff;font-weight:500;}
  .app .badge{position:absolute;top:-7px;left:50%;margin-left:12px;background:var(--bad);color:#fff;font-size:11px;
    border-radius:999px;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;
    padding:0 5px;font-weight:800;line-height:1;z-index:5;
    border:2px solid #0b1020;box-shadow:0 2px 9px rgba(255,107,138,.65);}
  .app .badge.dot{width:14px;height:14px;min-width:0;padding:0;top:-3px;margin-left:20px;}
  .ic-white{background:linear-gradient(150deg,#1c2a52,#2a3a6e);}
  .ic-chat{background:linear-gradient(150deg,#123a2e,#1f6e54);}
  .ic-contact{background:linear-gradient(150deg,#2a2240,#4a3a7a);}
  .ic-forum{background:linear-gradient(150deg,#3a2a14,#7a5a1f);}
  .ic-match{background:linear-gradient(150deg,#3a1430,#7a2a5a);}
  .ic-map{background:linear-gradient(150deg,#0e3a34,#1f7a5c);}
  .ic-phone{background:linear-gradient(150deg,#123a2e,#1f8f5f);}
  .ic-cam{background:linear-gradient(150deg,#2a2f3a,#5a6478);}
  .ic-me{background:linear-gradient(150deg,#14303a,#1f5a6e);}
  .home-foot{text-align:center;color:var(--dim);font-size:11px;padding:14px 0 6px;}

  /* ===== 通用 App 视图 ===== */
  .appview{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
  .appbar{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.06);
    background:rgba(12,18,36,.82);backdrop-filter:blur(12px);position:sticky;top:0;z-index:5;}
  .appbar .back{cursor:pointer;font-size:22px;color:var(--dim);padding:2px 8px;border-radius:8px;transition:.15s;}
  .appbar .back:hover{color:var(--ink);background:rgba(255,255,255,.06);}
  .appbar .title{font-weight:700;font-size:16px;flex:1;}
  .appbar .tag{font-size:11px;color:var(--dim);background:rgba(255,255,255,.05);padding:2px 9px;border-radius:999px;}
  .scroll{flex:1;min-height:0;overflow:auto;padding:14px;-webkit-overflow-scrolling:touch;}

  .card{background:linear-gradient(180deg,rgba(22,31,51,.72),var(--panel));border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,.25);}
  .muted{color:var(--dim);}
  .pill{display:inline-block;background:#0a1020;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11px;margin:2px;color:var(--dim);}
  .pill.new{color:#0a0e1a;background:linear-gradient(90deg,#ffd479,#ff9b6b);border:none;font-weight:700;}
  .pill.sentinel{color:#ffd2d2;border-color:rgba(255,107,107,.5);}
  .pill.guide{color:#cdefff;border-color:rgba(90,209,255,.5);}
  .btn{font-family:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--panel2);
    color:var(--ink);padding:9px 13px;font-size:14px;transition:.15s;width:100%;text-align:left;margin-top:8px;}
  .btn:hover{border-color:var(--spirit);box-shadow:0 0 0 1px var(--spirit) inset;}
  .btn.primary{background:linear-gradient(180deg,#2a3a63,#1a2542);border-color:#3b5290;}
  .btn.sentinel{border-color:var(--sentinel);color:#ffd2d2;}
  .btn.guide{border-color:var(--guide);color:#cdefff;}
  .btn.accent{background:linear-gradient(180deg,#5a3a8e,#3a2566);border-color:#7c6bff;}

  /* ===== 任务卡 ===== */
  .mission{text-align:left;display:block;background:linear-gradient(180deg,#101a30,#0b1120);border:1px solid var(--line);
    border-radius:14px;padding:14px;cursor:pointer;transition:.15s;}
  .mission:hover{border-color:var(--spirit);transform:translateY(-2px);}
  .mission .m-name{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:#fff;}
  .mission .m-hook{color:#c3cdf2;font-size:13px;margin:8px 0 10px;font-style:italic;line-height:1.5;}
  .mission .m-tags{display:flex;flex-wrap:wrap;gap:6px;}
  .tag-pill{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim);}
  .tag-pill.genre{color:var(--guide);border-color:rgba(90,209,255,.4);}
  .tag-pill.dur{color:var(--spirit);border-color:rgba(183,139,255,.4);}
  .tag-pill.diff{color:var(--gold);border-color:rgba(255,212,121,.4);}
  .tag-pill.lv{color:var(--sentinel);border-color:rgba(255,107,107,.4);}

  /* ===== 剧情 ===== */
  .story-box{background:linear-gradient(180deg,rgba(183,139,255,.12),rgba(90,209,255,.04));border:1px solid var(--line);
    border-left:3px solid var(--spirit);border-radius:12px;padding:14px 16px;margin-bottom:14px;font-size:14px;line-height:1.95;color:#dce3ff;}
  .chapter{font-size:11px;color:var(--spirit);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;}
  .scene h2{margin:0 0 4px;font-size:19px;}
  .scene .sub{color:var(--dim);font-size:12px;margin-bottom:10px;}
  .scene p{margin:0 0 10px;}
  .flavor{color:#c3cdf2;font-style:italic;border-left:3px solid var(--spirit);padding-left:11px;margin:9px 0;font-size:13px;}
  .options{display:flex;flex-direction:column;gap:9px;margin-top:6px;}
  .opt{text-align:left;display:flex;gap:9px;align-items:flex-start;line-height:1.5;background:var(--panel2);border:1px solid var(--line);
    border-radius:11px;padding:11px 13px;cursor:pointer;font-family:inherit;color:var(--ink);font-size:14px;transition:.15s;}
  .opt:hover{border-color:var(--spirit);box-shadow:0 0 0 1px var(--spirit) inset;}
  .opt .ico{font-size:16px;}
  .opt small{display:block;color:var(--dim);font-size:11px;margin-top:2px;}
  .answer-box{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap;}
  .answer-box input{flex:1;min-width:160px;background:#0a1020;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 11px;font-size:14px;font-family:inherit;}
  .answer-box input:focus{outline:none;border-color:var(--spirit);box-shadow:0 0 0 1px var(--spirit) inset;}
  .answer-ask{font-size:12px;color:var(--spirit);margin-top:10px;font-style:italic;}

  /* 骰子 */
  .dice-wrap{display:flex;gap:16px;align-items:center;justify-content:center;min-height:84px;flex-wrap:wrap;}
  .die{width:64px;height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;
    background:linear-gradient(180deg,#1b2542,#0d1426);border:1px solid #34487e;box-shadow:0 5px 14px rgba(0,0,0,.4);position:relative;}
  .die .tag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:9px;background:#0a1020;border:1px solid var(--line);padding:1px 6px;border-radius:999px;color:var(--dim);}
  .die.rolling{animation:shake .12s infinite;color:var(--spirit);}
  @keyframes shake{0%{transform:translateY(-2px) rotate(-3deg);}50%{transform:translateY(2px) rotate(3deg);}100%{transform:translateY(-1px);}}
  .die.crit{box-shadow:0 0 0 2px var(--gold),0 0 18px var(--gold);}
  .die.fail{box-shadow:0 0 0 2px var(--bad),0 0 14px var(--bad);}
  .check-info{text-align:center;font-size:12px;color:var(--dim);margin-top:4px;}
  .check-info b{color:var(--ink);}
  .verdict{text-align:center;font-weight:800;font-size:17px;margin-top:4px;}
  .verdict.ok{color:var(--good);} .verdict.no{color:var(--bad);}

  /* 角色面板 */
  .id-badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;}
  .id-sentinel{background:rgba(255,107,107,.15);color:var(--sentinel);border:1px solid var(--sentinel);}
  .id-guide{background:rgba(90,209,255,.15);color:var(--guide);border:1px solid var(--guide);}
  .bar{height:9px;border-radius:6px;background:#0a1020;border:1px solid var(--line);overflow:hidden;margin:4px 0 2px;}
  .bar > i{display:block;height:100%;border-radius:6px;transition:width .35s;}
  .bar.hp > i{background:linear-gradient(90deg,#ff8a8a,#ff5b5b);}
  .bar.sp > i{background:linear-gradient(90deg,#7ee0ff,#5ad1ff);}
  .bar.ol > i{background:linear-gradient(90deg,#ffd479,#ff7a45);}
  .bar.mt > i{background:linear-gradient(90deg,#ff9bd2,#ff5bb0);}
  .row{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);}
  .attrs{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:10px 0;}
  .attr{background:#0a1020;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;}
  .attr b{color:var(--gold);}
  .animal{font-size:13px;color:var(--spirit);margin-top:6px;}

  /* 角色表单 */
  .attr-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;}
  .attr-field{display:flex;flex-direction:column;gap:4px;}
  .attr-field label{font-size:12px;color:var(--dim);}
  .attr-field input{background:#0a1020;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:15px;font-family:inherit;}
  .attr-field input:focus{outline:none;border-color:var(--spirit);box-shadow:0 0 0 1px var(--spirit) inset;}
  .animal-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px;}
  .animal-opt{display:flex;align-items:flex-start;gap:5px;background:#0a1020;border:1px solid var(--line);border-radius:10px;padding:5px 7px;cursor:pointer;font-size:12px;line-height:1.35;}
  .animal-opt input{accent-color:var(--spirit);margin-top:1px;width:15px;height:15px;flex-shrink:0;}
  .animal-name{font-weight:700;color:var(--spirit);}
  .animal-desc{color:var(--dim);font-size:10px;flex:1;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .animal-bonus{font-size:9px;color:var(--gold);white-space:nowrap;}

  /* 聊天 */
  .thread{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:9px;cursor:pointer;}
  .thread:hover{border-color:var(--spirit);}
  .av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
  .thread .t-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;}
  .thread .t-last{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;}
  .thread .t-time{font-size:10px;color:var(--dim);}
  .thread .t-badge{margin-left:auto;background:var(--bad);color:#fff;font-size:10px;border-radius:999px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:700;}
  .thread .t-badge.dot{width:10px;height:10px;min-width:0;padding:0;}
  .chat-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);}
  .chat-head .cname{font-weight:700;}
  .chat-head .cstat{font-size:11px;color:var(--good);}
  .chat-body{flex:1;min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;}
  .bubble{max-width:78%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.55;}
  .bubble.them{background:var(--panel2);align-self:flex-start;border-bottom-left-radius:4px;}
  .bubble.me{background:linear-gradient(180deg,#3a2566,#2a1a52);align-self:flex-end;border-bottom-right-radius:4px;}
  .bubble.sys{background:transparent;color:var(--dim);font-size:12px;align-self:center;text-align:center;max-width:90%;}
  .chat-replies{display:flex;flex-direction:column;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:#0c1224;}
  .reply{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:13px;cursor:pointer;color:var(--ink);text-align:left;font-family:inherit;}
  .reply:hover{border-color:var(--spirit);}
  .reply small{display:block;color:var(--dim);font-size:11px;margin-top:2px;}
  .chat-input{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:#0c1224;}
  .chat-input input{flex:1;background:#0a1020;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:14px;font-family:inherit;}
  .chat-input input:focus{outline:none;border-color:var(--spirit);}
  .chat-input button{padding:9px 14px;font-size:14px;width:auto;margin-top:0;}
  .affinity{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:12px;color:var(--dim);border-top:1px solid var(--line);}
  .affinity .heart{color:var(--bad);}
  .affinity .bar{flex:1;}
  /* 心形好感徽章（等级 1-5，颜色随好感度变化） */
  .aff-badge{position:relative;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;vertical-align:middle;}
  .aff-badge svg{position:absolute;inset:0;width:100%;height:100%;fill:currentColor;color:var(--lvl-color);filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));}
  .aff-badge .lvl{position:relative;z-index:1;font-size:13px;font-weight:800;color:#fff;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.5);}
  .aff-line{display:flex;align-items:center;gap:8px;}
  .aff-line .aff-note{font-size:11px;color:var(--dim);}
  /* 表单控件（应用内填写，不用系统弹窗） */
  .f-lab{display:block;font-size:12px;color:var(--dim);margin:12px 0 0;}
  .f-inp{width:100%;background:#0a1020;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 10px;font-size:14px;font-family:inherit;margin-top:4px;}
  .f-inp:focus{outline:none;border-color:var(--spirit);}
  textarea.f-inp{min-height:72px;resize:vertical;font-size:13px;line-height:1.6;}
  .f-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px;}
  .f-chip{background:#0a1020;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--dim);}
  .f-chip.on{color:var(--ink);border-color:var(--spirit);background:rgba(183,139,255,.14);}
  .dg-target{margin:8px auto 0;width:136px;height:136px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:17px;font-weight:800;background:#0a1020;border:2px solid var(--line);cursor:pointer;user-select:none;
    transition:background .12s,border-color .12s,transform .12s;}
  .dg-target.wait{color:var(--dim);}
  .dg-target.go{background:radial-gradient(circle at 50% 32%,#ffe6a8,#ff6b8a);border-color:var(--gold);color:#2a1608;transform:scale(1.06);box-shadow:0 0 28px rgba(255,212,121,.5);}
  .dg-target.bad{background:radial-gradient(circle at 50% 32%,#6b2739,#3a1020);border-color:var(--bad);color:#ffd7de;}
  .dg-target.fake{background:radial-gradient(circle at 50% 32%,#a9dcff,#2b6ea8);border-color:var(--guide);color:#06131f;transform:scale(1.06);box-shadow:0 0 28px rgba(90,209,255,.5);}
  /* 疏导小游戏 */
  .dg-track{position:relative;height:36px;border-radius:10px;background:#0a1020;border:1px solid var(--line);overflow:hidden;}
  .dg-zone{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,rgba(90,209,255,.34),rgba(90,209,255,.12));border-left:1px solid var(--spirit);border-right:1px solid var(--spirit);}
  .dg-cur{position:absolute;top:2px;bottom:2px;width:4px;border-radius:3px;background:var(--bad);box-shadow:0 0 10px var(--bad);transform:translateX(-2px);}
  .dg-msg{margin-top:10px;font-size:13px;line-height:1.7;min-height:38px;}
  .remark-row{display:flex;align-items:center;gap:6px;padding:7px 14px;font-size:12px;color:var(--dim);border-top:1px solid var(--line);cursor:pointer;}
  .board-tabs{display:flex;gap:6px;overflow:auto;margin-bottom:10px;padding-bottom:2px;}
  .board-tabs::-webkit-scrollbar{display:none;}
  /* 关系标签（按好感度动态变化） */
  .rel-chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid transparent;vertical-align:middle;}
  .rel-muted{color:var(--dim);border-color:var(--line);background:#0a1020;}
  .rel-temp{color:#ffd479;border-color:rgba(255,212,121,.5);background:rgba(255,212,121,.08);}
  .rel-friend{color:#5ad1ff;border-color:rgba(90,209,255,.5);background:rgba(90,209,255,.08);}
  .rel-partner{color:#b78bff;border-color:rgba(183,139,255,.6);background:rgba(183,139,255,.1);}
  .rel-romance{color:#ff6b8a;border-color:rgba(255,107,138,.6);background:rgba(255,107,138,.1);}
  .rel-card{border-left:3px solid var(--line);}
  .rel-card.rel-temp{border-left-color:rgba(255,212,121,.6);}
  .rel-card.rel-friend{border-left-color:rgba(90,209,255,.6);}
  .rel-card.rel-partner{border-left-color:rgba(183,139,255,.7);}
  .rel-card.rel-romance{border-left-color:rgba(255,107,138,.7);}


  /* 论坛 */
  .post{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  .post .p-top{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
  .post .p-name{font-weight:700;font-size:13px;}
  .post .p-id{font-size:10px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);}
  .post .p-time{font-size:10px;color:var(--dim);margin-left:auto;}
  .post .p-title{font-size:15px;font-weight:700;margin-bottom:6px;}
  .post .p-body{font-size:13px;color:#cdd6f5;line-height:1.7;}
  .post .p-acts{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--dim);}
  .post .p-acts span{cursor:pointer;}
  .post .p-acts span:hover{color:var(--spirit);}
  .post .p-acts .liked{color:var(--bad);}
  .comment{font-size:12px;color:var(--dim);border-top:1px dashed var(--line);padding-top:8px;margin-top:8px;}
  .comment b{color:var(--spirit);}
  .comment-box{display:flex;gap:8px;margin-top:10px;}
  .comment-box input{flex:1;background:#0a1020;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 10px;font-size:13px;font-family:inherit;}

  /* 匹配 */
  .match-hero{text-align:center;padding:8px 0 14px;}
  .match-hero .big{font-size:46px;font-weight:200;}
  .cand{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;}
  .cand.me{border-color:var(--spirit);box-shadow:0 0 0 1px var(--spirit) inset;}
  .cand .c-info{flex:1;}
  .cand .c-name{font-weight:700;font-size:14px;}
  .cand .c-meta{font-size:11px;color:var(--dim);}
  .cand .c-score{font-size:20px;font-weight:800;color:var(--gold);}
  .cand .c-act{display:flex;flex-direction:column;gap:6px;}

  /* 日志 */
  .log{font-size:12px;color:var(--dim);max-height:170px;overflow:auto;padding-right:4px;}
  .log div{padding:3px 0;border-bottom:1px dashed #1b2540;}
  .log .roll{color:var(--spirit);}
  .log .win{color:var(--good);} .log .lose{color:var(--bad);}
  .log .story{color:var(--spirit);}
  details{font-size:12px;color:var(--dim);margin-top:8px;}
  summary{cursor:pointer;color:var(--guide);}
  details p{margin:6px 0;}
  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#14203c;border:1px solid var(--spirit);
    color:var(--ink);padding:10px 16px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;transition:.3s;pointer-events:none;z-index:60;font-size:13px;}
  .toast.show{opacity:1;}
  .center{text-align:center;}
  /* 数量加减（申请单用） */
  .qty-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;
    background:#0a1020;border:1px solid var(--line);font-size:20px;line-height:1;cursor:pointer;user-select:none;color:var(--ink);}
  .qty-btn:active{background:#16203a;border-color:var(--spirit);}
  /* 日历 */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin:2px 0 8px;}
  .cal-head .nav{width:34px;height:34px;border-radius:10px;background:#0a1020;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;}
  .cal-w{text-align:center;font-size:10px;color:var(--dim);padding:2px 0;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-cell{position:relative;aspect-ratio:1/1;border-radius:10px;background:#0c1224;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;}
  .cal-cell.empty{background:transparent;border-color:transparent;cursor:default;}
  .cal-cell.today{border-color:var(--spirit);}
  .cal-cell.sel{background:linear-gradient(180deg,rgba(183,139,255,.25),rgba(90,209,255,.12));border-color:var(--spirit);font-weight:700;}
  .cal-cell .dots{position:absolute;bottom:5px;left:0;right:0;display:flex;gap:3px;justify-content:center;}
  .cal-cell .dots i{width:5px;height:5px;border-radius:50%;display:block;}

  /* 消息 / 通讯录 分段切换 */
  .tabbar{flex:0 0 auto;display:flex;background:#0c1224;border-top:1px solid var(--line);
    box-shadow:0 -6px 18px rgba(0,0,0,.35);padding-bottom:env(safe-area-inset-bottom);}
  .tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    padding:7px 0 6px;font-size:10px;color:var(--dim);cursor:pointer;position:relative;transition:.15s;}
  .tabbar .tab:active{background:rgba(255,255,255,.05);}
  .tabbar .tab.on{color:var(--spirit);}
  .tabbar .tab .ti{font-size:19px;line-height:1.1;}
  .tabbar .tab .tdot{position:absolute;top:5px;left:50%;margin-left:6px;width:7px;height:7px;border-radius:50%;
    background:var(--bad);box-shadow:0 0 7px rgba(255,107,138,.9);border:1px solid #0c1224;}
  /* ===== 小游戏：消消乐 / 俄罗斯方块 / 扫雷 / 贪吃蛇 / 音游 ===== */
  .m3-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
  .m3-c{aspect-ratio:1/1;border-radius:12px;background:#0a1020;border:1px solid var(--line);display:flex;
    align-items:center;justify-content:center;font-size:22px;cursor:pointer;transition:.12s;}
  .m3-c.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,212,121,.35) inset;transform:scale(1.06);}
  .m3-c.gone{opacity:.15;}
  .tetris{display:grid;grid-template-columns:repeat(10,1fr);gap:1px;background:#0a1020;border:1px solid var(--line);border-radius:8px;padding:1px;}
  .tet-c{aspect-ratio:1/1;border-radius:2px;background:#0d1424;}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:210px;margin:10px auto 0;}
  .pad div{background:#0a1020;border:1px solid var(--line);border-radius:12px;padding:11px 0;text-align:center;font-size:17px;cursor:pointer;}
  .pad div:active{background:#16203a;}
  .mine-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;}
  .mn{aspect-ratio:1/1;border-radius:7px;background:#111a30;border:1px solid var(--line);display:flex;
    align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;}
  .mn.open{background:#0a1020;color:var(--dim);font-weight:700;}
  .mn.flag{color:var(--bad);}
  .mn.boom{background:radial-gradient(circle,#a11f3c,#3a0a16);color:#fff;}
  .snake-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;background:#0a1020;padding:3px;border-radius:10px;border:1px solid var(--line);}
  .sn{aspect-ratio:1/1;border-radius:3px;background:#0d1424;}
  .sn.h{background:linear-gradient(150deg,#6ee7b7,#1f8f5f);} .sn.f{background:radial-gradient(circle,#ffd479,#a15c15);}
  .sn.e{background:radial-gradient(circle,rgba(183,139,255,.8),rgba(90,209,255,.3));}
  .rg-wrap{position:relative;height:290px;background:#080c18;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .rg-line{position:absolute;left:0;right:0;bottom:52px;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
  .rg-note{position:absolute;width:23%;height:26px;border-radius:8px;box-shadow:0 0 12px rgba(255,255,255,.25);}
  .rg-tracks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;}
  .rg-key{padding:15px 0;text-align:center;border-radius:12px;background:#0a1020;border:1px solid var(--line);font-size:15px;cursor:pointer;}
  .rg-key:active,.rg-key.hit{background:linear-gradient(180deg,rgba(255,212,121,.45),rgba(255,212,121,.1));border-color:var(--gold);}
  .rg-judge{position:absolute;left:0;right:0;bottom:96px;text-align:center;font-size:20px;font-weight:800;}

  /* ===== 相机 / 相册 ===== */
  .cam-view{position:relative;height:236px;border-radius:16px;overflow:hidden;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:64px;}
  .cam-view::before{content:"";position:absolute;inset:0;background:
    linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px) 0 0/100% 33.3%,
    linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px) 0 0/33.3% 100%;pointer-events:none;}
  .cam-hud{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;
    font-size:10px;color:rgba(255,255,255,.75);text-shadow:0 1px 3px rgba(0,0,0,.6);}
  .cam-cap{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8);}
  .cam-scenes{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;}
  .cam-chip{flex:0 0 auto;padding:5px 11px;border-radius:999px;background:#0a1020;border:1px solid var(--line);font-size:12px;cursor:pointer;}
  .cam-chip.on{background:linear-gradient(90deg,rgba(183,139,255,.3),rgba(90,209,255,.18));border-color:var(--spirit);color:var(--ink);font-weight:700;}
  .shutter{width:66px;height:66px;border-radius:50%;border:4px solid rgba(255,255,255,.85);background:var(--bad);
    margin:0 auto;box-shadow:0 6px 18px rgba(0,0,0,.5);cursor:pointer;}
  .shutter:active{transform:scale(.92);}
  .flash{position:fixed;inset:0;background:#fff;opacity:0;z-index:99;pointer-events:none;}
  .flash.on{animation:fl .4s ease-out;}
  @keyframes fl{0%{opacity:.92}100%{opacity:0}}
  .album-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .album-grid .ph{aspect-ratio:1/1;border-radius:12px;overflow:hidden;position:relative;cursor:pointer;border:1px solid var(--line);}
  .album-grid .ph .em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;}
  .album-grid .ph .cap{position:absolute;left:0;right:0;bottom:0;padding:3px 5px;font-size:9px;color:#fff;
    background:linear-gradient(transparent,rgba(0,0,0,.75));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .photo-big{height:230px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:74px;border:1px solid var(--line);}

  /* ===== 电话 ===== */
  .call-box{text-align:center;padding:14px 0 6px;}
  .call-av{width:86px;height:86px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;
    font-size:36px;color:#fff;box-shadow:0 10px 26px rgba(0,0,0,.5);}
  .call-av.ring{animation:ring 1s infinite;}
  @keyframes ring{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-8deg) scale(1.03)}75%{transform:rotate(8deg) scale(1.03)}}
  .call-wave{display:flex;gap:4px;justify-content:center;align-items:flex-end;height:26px;margin-top:14px;}
  .call-wave i{width:4px;height:6px;background:var(--spirit);border-radius:2px;animation:cw .9s infinite ease-in-out;}
  .call-wave i:nth-child(2){animation-delay:.15s;} .call-wave i:nth-child(3){animation-delay:.3s;}
  .call-wave i:nth-child(4){animation-delay:.45s;} .call-wave i:nth-child(5){animation-delay:.6s;}
  @keyframes cw{0%,100%{height:6px;opacity:.45}50%{height:22px;opacity:1}}
  .call-mute{display:flex;gap:8px;justify-content:center;margin-top:10px;font-size:11px;color:var(--dim);}
  .btn.hangup{background:linear-gradient(150deg,#a11f3c,#4a0f1f);border-color:rgba(255,107,138,.5);}
  .btn.pick{background:linear-gradient(150deg,#1f8f5f,#0d4a34);border-color:rgba(110,231,183,.5);}
  .call-chat{margin-top:12px;}
  .call-chat .bubble{max-width:86%;}
  .dialpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .dial-k{background:#0a1020;border:1px solid var(--line);border-radius:14px;padding:12px 0;text-align:center;font-size:19px;font-weight:700;cursor:pointer;}
  .dial-k:active{background:#16203a;}

  /* ===== 小游戏：锚点 / 排查 / 校准 ===== */
  .mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
  .mem-cell{aspect-ratio:1/1;border-radius:14px;background:#0a1020;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:23px;color:var(--dim);cursor:pointer;transition:.12s;}
  .mem-cell:active{transform:scale(.94);}
  .mem-cell.on{background:linear-gradient(150deg,rgba(255,212,121,.55),rgba(255,212,121,.14));border-color:var(--gold);color:#1a1206;box-shadow:0 0 14px rgba(255,212,121,.55);}
  .mem-cell.ok{background:linear-gradient(150deg,rgba(110,231,183,.45),rgba(110,231,183,.12));border-color:var(--good);color:#062018;}
  .mem-cell.no{background:linear-gradient(150deg,rgba(255,107,138,.45),rgba(255,107,138,.12));border-color:var(--bad);color:#fff;}
  .mem-cell.locked{cursor:default;opacity:.85;}
  .scan-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;}
  .sc-cell{aspect-ratio:1/1;border-radius:11px;background:#0a1020;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:19px;color:#23304f;cursor:pointer;transition:.1s;}
  .sc-cell.noise{background:radial-gradient(circle,rgba(255,107,138,.6),rgba(255,107,138,.12));border-color:var(--bad);color:#fff;box-shadow:0 0 13px rgba(255,107,138,.6);}
  .sc-cell.decoy{background:radial-gradient(circle,rgba(90,209,255,.5),rgba(90,209,255,.08));border-color:var(--guide);color:#fff;box-shadow:0 0 13px rgba(90,209,255,.5);}
  .sc-cell.bad{background:radial-gradient(circle,rgba(120,120,140,.5),rgba(40,40,60,.2));border-color:#6b7280;color:#fff;}
  .hold-bar{position:relative;height:34px;border-radius:10px;background:#0a1020;border:1px solid var(--line);overflow:hidden;}
  .hold-zone{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,rgba(110,231,183,.5),rgba(110,231,183,.16));border-left:1px solid var(--good);border-right:1px solid var(--good);}
  .hold-cur{position:absolute;top:-2px;bottom:-2px;width:4px;border-radius:2px;background:var(--gold);box-shadow:0 0 10px rgba(255,212,121,.9);}
  .hold-btn{user-select:none;-webkit-user-select:none;touch-action:manipulation;}

  /* ===== 底部导航栏 ===== */
  .tabbar{flex:0 0 auto;display:flex;background:#0c1224;border-top:1px solid var(--line);
    box-shadow:0 -6px 18px rgba(0,0,0,.35);padding-bottom:env(safe-area-inset-bottom);}
  /* 消息 / 通讯录 分段切换 */
  .seg{display:flex;background:#0a1020;border:1px solid var(--line);border-radius:12px;padding:3px;margin:2px 0 12px;}
  .seg .sg{flex:1;text-align:center;padding:7px 0;font-size:13px;color:var(--dim);border-radius:9px;cursor:pointer;transition:.15s;}
  .seg .sg:active{background:rgba(255,255,255,.06);}
  .seg .sg.on{background:linear-gradient(90deg,rgba(183,139,255,.30),rgba(90,209,255,.18));color:var(--ink);font-weight:700;}
  /* ===================================================================
     科技风视觉层（HUD）：直角化 · 霓虹细线 · 四角卡扣 · 扫描线 · 网格底纹
     只改视觉，不改任何布局尺寸与交互
     =================================================================== */
  body{
    background:
      radial-gradient(900px 520px at 50% -8%, #0d2136 0%, #03060c 62%),
      linear-gradient(180deg,#03060c,#02040a);
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;
    background:repeating-linear-gradient(0deg,rgba(120,210,255,.035) 0 1px,transparent 1px 3px);}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:41;
    background:radial-gradient(122% 88% at 50% 0%,transparent 58%,rgba(0,0,0,.58) 100%);}
  .phone{background:linear-gradient(180deg,#060b14,#040911);}
  @media (max-width:519px){
    .phone{border-left:1px solid rgba(62,224,255,.22); border-right:1px solid rgba(62,224,255,.22);}
  }
  @media (min-width:520px){
    .phone{border:1px solid rgba(62,224,255,.3);
      box-shadow:0 0 0 10px rgba(6,12,22,.95), 0 0 0 11px rgba(62,224,255,.22), 0 40px 90px rgba(0,0,0,.75);}
  }
  .phone::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
    background-image:
      linear-gradient(rgba(62,224,255,.035) 1px,transparent 1px),
      linear-gradient(90deg,rgba(62,224,255,.035) 1px,transparent 1px);
    background-size:28px 28px;
    -webkit-mask-image:radial-gradient(120% 78% at 50% 0%,#000 22%,transparent 86%);
    mask-image:radial-gradient(120% 78% at 50% 0%,#000 22%,transparent 86%);}
  .statusbar{font-family:var(--mono);letter-spacing:1.6px;font-size:10px;color:#8fc6e8;
    border-bottom:1px solid rgba(62,224,255,.14);}
  .statusbar .icons span:first-child{animation:blink 2.4s ease-in-out infinite;}
  .notch{background:#02040a;border-bottom:1px solid rgba(62,224,255,.16);}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .appbar{background:linear-gradient(180deg,rgba(10,22,38,.97),rgba(6,12,22,.92));
    border-bottom:1px solid rgba(62,224,255,.22);}
  .appbar .title{letter-spacing:.6px;text-shadow:0 0 10px rgba(62,224,255,.35);}
  .appbar .tag{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:#6f8fb0;}
  .appbar .back{color:var(--guide);text-shadow:0 0 10px rgba(62,224,255,.5);}
  /* 卡片 / 列表：直角 + 四角卡扣 */
  .card,.thread,.post,.cand,.opt,.reply,.btn,.app .ico,.seg,.seg .sg,.cal-cell,.cam-chip,
  .f-chip,.pill,.photo-big,.ph,.animal-opt{border-radius:5px;}
  .card{position:relative;background:linear-gradient(180deg,rgba(12,24,42,.92),rgba(8,16,30,.94));
    border:1px solid rgba(62,224,255,.18);
    box-shadow:0 6px 22px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.03);}
  .card::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:5px;
    background:
      linear-gradient(90deg,var(--guide),var(--guide)) 0 0/12px 1px no-repeat,

/* 抽一个性格；同性格的人也会有各自的私人口味（隐藏，靠相处发现） */
function rollPers(){
  const b=pick(PERS);
  const like=b.like.slice(), hate=b.hate.slice();
  const spare=TONES.filter(t=>like.indexOf(t)<0 && hate.indexOf(t)<0);
  const take=(arr)=>{ if(!arr.length) return; const i=rnd(arr.length); return arr.splice(i,1)[0]; };
  const extraLike=take(spare); if(extraLike) like.push(extraLike);
  const extraHate=take(spare); if(extraHate) hate.push(extraHate);
  return {id:b.id, name:b.name, bio:b.bio, hint:b.hint, good:b.good, bad:b.bad, like, hate};
}

/* ============ 评级 / 搭档推导 ============ */
function deriveRank(attr, identity){
  const primary   = identity==='sentinel' ? attr.per : attr.cha;
  const secondary = identity==='sentinel' ? attr.con : attr.per;
  const score = Math.round(attr.spi*1.5 + primary + secondary*0.5);
  let label='D';
  if(score>=54) label='S';
  else if(score>=46) label='A';
  else if(score>=36) label='B';
  else if(score>=26) label='C';
  return { label, dark:(label==='S'), score };
}
function derivePartner(attr, identity){
  const want = identity==='sentinel' ? 'guide' : 'sentinel';
  const pool = PARTNERS.filter(p=>p.identity===want);
  const key = attr.spi*3 + (identity==='sentinel'?attr.per:attr.spi) + (identity==='sentinel'?attr.con:attr.cha);
  return pool[((key % pool.length)+pool.length)%pool.length];
}
function calcMatch(attr, cand){
  // 契合度：精神力接近、主属性互补更优
  const mySpi = attr.spi;
  const candStrong = cand.strong;
  let score = 60 + rnd(10);
  score += Math.abs(mySpi - (cand.identity==='guide'?attr.spi:attr.per)) * -0.5;
  score += (attr[candStrong] - 10) * 1.2;
  score += (cand.identity==='guide' ? attr.cha : attr.con) * 0.6;
  return clamp(Math.round(score), 35, 99);
}

      w_all:{ chapter:'结局 · 同赌', story:()=>`你把氧气拆成四份，每人都只够吊着一口气。然后你架起讯标，用最后的向导素把四个人的心跳，编进同一段频率里，一遍遍往外发。<br><br>暴风里，那支频率竟真的撞上了过顶卫星。救援直升机破雪而来时，四个人都还有气——脸色惨白，却都，活着。`,

      l_vault:{ chapter:'第一章 · 死信格', story:()=>`你顺着系统指引，沉进那格发不出的接口。里面没有光，只有一片<b>温吞的暗</b>，像有人把一句话含在嘴里，含了一整夜，直到再没机会吐出。<br><br>暗的中央，浮着一行未发的字，被一层薄薄的导游素裹着，微微发颤。那是她的手温，隔了很久，还没凉。`,
        title:'含着的那句话', sub:'精神检定',

      l_vault_f:{ title:'被余温烫了一下', body:[{t:'你探得太急，那层手温猛地一烫，精神被灼得发麻，眼前漫起水雾。你放缓了，像怕惊扰睡梦里的人的手，轻轻覆上去——那句话的轮廓，终于清晰了。'}],
        opts:[{type:'event',sp:-4,log:'🔥 余温反灼，SP-4',to:'l_read'}] },
      l_read:{ chapter:'第二章 · 信里的人', story:()=>`你读到了那句话的来路。写信的向导叫<b>晚晴</b>，收信的哨兵叫<b>昭</b>。他们是白塔里出了名的「契合对」——她的精神体白鹿，总在他过载时，安静地卧在他脚边。<br><br>最后一夜，晚晴查出不治之症。她没告诉昭，只是连夜写好了这封信，想等任务结束再说。可任务结束那晚，先倒下的，是她。信，永远停在了「已写未发」。`,
        title:'晚晴与昭', sub:'亲和检定',
        body:[{flav:'要把信送到，得先确认——昭，知不知道她没说出口的事。'}],
        opts:[{type:'check',attr:'cha',dc:12,advantage:()=>C().linked,overload:0,

      l_read_f:{ title:'共感岔了', body:[{t:'你共感得太深，被昭这些年压着的、说不出口的怕扫了一下，鼻腔泛起酸。缓过来后你倒笃定了：他一定知道，只是和晚晴一样，把话，都咽进了同一格发不出的信里。'}],
        opts:[{type:'event',sp:-3,log:'💧 共感岔气，SP-3',to:'l_find'}] },
      l_find:{ chapter:'—— 中途 · 搭档的消息 ——', chatbeat:true,

              bumpAff(mAff(k)); return `你回：「先把今天的话说完。」<br>搭档笑了：「行，今天的不欠。剩下的……以后慢慢还。」`;

      l_decide:{ chapter:'第三章 · 送，还是留', story:()=>`你顺着信的指向，找到了昭。他如今是塔里的老哨兵，沉默、寡言，白鹿却再没出现过——他的精神体，随晚晴一起，停在了那年。<br><br>系统在你掌心亮起三个选项：替晚晴念出那句未说的话；或尊重她「未发」的本意，只把信，安静地封存为碑；又或者，把这句话，换成你自己的方式，告诉昭——有人，很爱他。`,
        title:'你要怎么处置这封信', sub:'你的选择将决定结局',

      l_say:{ chapter:'结局 · 送达', story:()=>`你蹲到昭面前，以晚晴的口吻，把那句未说的话，一字一句，念给他听：「昭，我这辈子最不后悔的，是做了你的向导。下辈子，还做。」<br><br>这个沉默了多年的老哨兵，忽然红了眼眶。他怀里，一只小小的<b>白鹿</b>虚影，怯怯地，探出了头。`,
        title:'结局 · 听到了', sub:'BEST ENDING',

      l_seal:{ chapter:'结局 · 立碑', story:()=>`你没有念出那句话。你尊重晚晴「未发」的本意，把信格凝成一座小小的、只有向导能看见的碑，立在系统最深处。<br><br>昭某天路过那片暗，莫名停了步，手按在虚空里，像摸到了谁的温度。他没说话，却站了很久。`,

        opts:[{type:'goto',to:'the_end',ico:'🌟',label:'查看结算',hint:''}] },
      l_own:{ chapter:'结局 · 转述', story:()=>`你没照念原话。你用自己的方式，走到昭身边，说：「有个人，很爱你。她没来得及说，但我替她告诉你——你值得被这样爱着。」<br><br>昭怔了怔，忽然笑了，笑里带泪：「我知道。我一直知道。我只是……想听别人替她说一次。」`,

    start:'t_brief', first:'t_gate',
    scenes:{
      t_brief:{ chapter:'白塔 · 任务简报', story:()=>`【系统任务简报 · 双面塔】编号 T-05，等级 甲级。<br><br>哨兵<b>宴之</b>在一次任务归来后，精神图景里养着的两头精神体——<b>黑豹</b>与<b>白鹿</b>——突然反目。黑豹要他永远冷硬、不再受伤；白鹿要他柔软、去爱人。两头兽在他心里昼夜撕咬，把人撕得日渐空洞。<br><br>白塔探查：这不是病，是他在那次任务里，同时失去了「该恨的人」和「该爱的人」。你作为向导潜进他的图景，不是去杀哪一头，而是去，劝它们，重新做回他的两翼。`,

      t_gate:{ chapter:'第一章 · 图景之门', story:()=>`你沉进宴之的精神图景——一座<b>双生的塔</b>：左半漆黑，铁栏森森，黑豹卧在阴影里舔爪；右半素白，草木葱茏，白鹿在光里低头吃草。两半之间，一道裂痕横贯，像被人硬生生掰开过。<br><br>你一脚踩进门槛，两头兽同时抬头，一黑一白，目光都钉在你身上。空气里绷着一根快断的弦。`,
        title:'一塔两半', sub:'精神检定',
        body:[{flav:'要在两头兽之间站住脚，得先让它们知道——你不是来挑一边站的。'}],
        opts:[{type:'check',attr:'spi',dc:13,advantage:()=>C().linked,overload:0,

      t_gate_f:{ title:'被两头盯着', body:[{t:'你刚一露头，黑豹低吼、白鹿惊跳，图景剧晃，你被两股相反的气压夹得耳膜生疼。你赶紧收回锋芒，把自己缩成一道温和的光，不偏不倚落在裂痕正中——两头兽这才微微收了爪。'}],
        opts:[{type:'event',sp:-4,log:'🐾 双压夹击，SP-4',to:'t_black'}] },
      t_black:{ chapter:'第二章 · 黑豹的怨', story:()=>`你先走向黑豹。它背对着你，脊背一道旧疤，是那次任务里替宴之挡下的。它哑声说：「是他让我别再软的。软，就会失去。那次他爱的那个人，就是因为他软，才没护住。」<br><br>黑豹的怨，不是凶，是怕——怕宴之再因柔软而痛，于是宁可把他，冻成铁。`,
        title:'黑豹：别再软', sub:'感知检定',
        body:[{flav:'要劝它，得先看清——它护的，到底是宴之，还是宴之的伤。'}],

      t_black_f:{ title:'读偏了', body:[{t:'你误把黑豹的凶当成了恶意，向导素探偏了半寸，被它的低吼震得后退一步。定了定神，你换了个角度——不去读它的牙，去读它护在身后的、宴之的影子。那层怕，终于显形了。'}],
        opts:[{type:'event',sp:-3,log:'🐆 误读受扰，SP-3',to:'t_white'}] },
      t_white:{ chapter:'第三章 · 白鹿的求', story:()=>`转到右半，白鹿迎上来，眼里有泪。它轻声说：「我也怕。可我更怕他，再也不会爱人了。那次他失去的人，走前最后一句话是『要好好活着，去爱别人』。黑豹把这句话，嚼碎了吞了，只留了『别软』。」<br><br>原来两头兽守着同一句话的两个半句，却谁都没听完对方的那一半。`,
        title:'白鹿：去爱', sub:'亲和检定',
        body:[{flav:'要在两头间架桥，得让它们听见——彼此守的，是同一份舍不得。'}],
        opts:[{type:'check',attr:'cha',dc:12,advantage:()=>C().linked,overload:0,
          label:'【亲和】把黑豹的怕与白鹿的求，连成同一句话',hint:'亲和 1d20 + 亲和值 vs DC 12（已链接则有优势）',success:'t_meet',fail:'t_white_f'}] },
      t_white_f:{ title:'桥没搭稳', body:[{t:'你急着撮合，话没说圆，白鹿的求与黑豹的怕在半空撞了一下，图景又晃。你深吸一口气，不再替它们翻译，而是把宴之那句没听完的话，完完整整，念给了两头兽一起听。它们同时安静了。'}],
        opts:[{type:'event',sp:-3,log:'🦌 桥晃，SP-3',to:'t_meet'}] },

  hold:{name:'稳态校准', ico:'⚖️'},   soothe:{name:'疏导同步', ico:'🫧'},
};
const GAME_LAUNCH={ reflex:startReflexGame, match3:startMatch3, tetris:startTetris, mines:startMines,
  snake:startSnake, rhythm:startRhythm, memory:startMemoryGame, scan:startScanGame,
  hold:startHoldGame, soothe:startSootheGame };
let CUR_TASK=null, CUR_GAME=null;
function poolOf(d){ return (d&&d.games&&d.games.length)?d.games:((d&&d.game)?[d.game]:[]); }
function gameNamesOf(d){ return poolOf(d).map(g=>(GAME_META[g]||{}).name||g); }
/* 按科目抽取：同科目多项目时避免连续重复同一个游戏 */
function pickGameFor(d){
  const pool=poolOf(d); if(!pool.length) return null;
  let g=pick(pool);
  if(pool.length>1 && G && G.lastGame===g){
    const rest=pool.filter(x=>x!==g); if(rest.length) g=pick(rest);
  }
  if(G) G.lastGame=g;
  return g;
}
function launchDailyGame(d, forceGame){
  const game = forceGame || pickGameFor(d);
  if(!game || !GAME_LAUNCH[game]) return;
  let task=d;
  if(game==='soothe' && !DG_TEXT[d.id]) task=Object.assign({}, d, {id:(C()&&C().identity==='guide')?'soothe_g':'soothe_s'});
  CUR_TASK=d; CUR_GAME=game;
  GAME_LAUNCH[game](task);
}
function retryDaily(){ if(CUR_TASK) launchDailyGame(CUR_TASK, CUR_GAME); else renderDaily(); }
function nowStr(){ const d=new Date(); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

function tickClock(){
  const d=new Date();

  const el=$('clock'); if(el) el.textContent=`${hh}:${mm}`;

  const lt=$('lockTime'); if(lt) lt.textContent=`${hh}:${mm}`;
  const ld=$('lockDate'); if(ld){ const w=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]; ld.textContent=`${w} · ${d.getMonth()+1}月${d.getDate()}日`; }

function rerollName(){ const e=$('inName'); if(e){ e.value=randName(); toast('换了个名字：'+e.value); } }
function updatePoints(){
  const ids=['per','spi','con','cha'];
  let sum=0;
  ids.forEach(k=>{ const e=$('in_'+k); if(!e) return;
    let v=parseInt(e.value,10); if(isNaN(v)) v=3; v=clamp(v,3,20); e.value=v; sum+=v; });
  const rem=POINT_TOTAL-sum;
  const remEl=$('ptRemain'), hint=$('ptHint'), btn=$('confirmBtn'), bar=$('pointBar');
  if(remEl) remEl.textContent=rem;
  if(bar) bar.style.borderColor = rem<0 ? 'var(--bad)' : 'var(--line)';
  if(hint) hint.textContent = rem<0 ? '⚠ 超出预算，请调低属性' : (rem>0 ? `（剩余 ${rem} 点可继续分配）` : '已用尽');
  if(btn) btn.disabled = rem<0;
  if(btn) btn.style.opacity = rem<0 ? '.5' : '1';
}

function finalizeCharacter(edit){
  const c0 = edit ? C() : null;
  const id = edit ? c0.identity : window._createIdentity;
  if(!id){ toast('请先选择身份'); return; }
  const attr={};
  let sum=0;
  ['per','spi','con','cha'].forEach(k=>{ let v=parseInt($('in_'+k).value,10); if(isNaN(v)) v=10; v=clamp(v,3,20); attr[k]=v; sum+=v; });
  if(sum>POINT_TOTAL){ toast(`属性合计 ${sum} 超出总池 ${POINT_TOTAL}，请调低`); return; }
  const ai=parseInt(document.querySelector('input[name=animal]:checked').value,10);
  const animal=SPIRIT_ANIMALS[ai];
  const baseAttr={per:attr.per, spi:attr.spi, con:attr.con, cha:attr.cha};
  // 精神体加成并入属性（计入评级）
  attr[animal.bonus]+=1;
  const rk=deriveRank(attr,id);
  const nameEl=$('inName');
  const name = edit ? (((nameEl&&nameEl.value||'').trim()) || c0.name) : randName();
  let c, pr;
  if(edit){
    // 身份与搭档关系锁定，仅重算评级
    pr={name:c0.partnerName, identity:c0.partnerId, strong:c0.partnerStrong};
    c={
      identity:id, name:name, animal, attr, baseAttr,
      maxhp:c0.maxhp, maxsp:c0.maxsp, hp:c0.hp, sp:c0.sp, overload:c0.overload||0,
      rank: rk.label, dark: rk.dark, rankScore: rk.score,
      partnerName: pr.name, partnerId: pr.identity, partnerStrong: pr.strong, linked: !!c0.linked,
    };
  } else {
    pr=derivePartner(attr,id);
    c={
      identity:id, name:name,
      animal, attr, baseAttr,
      maxhp: id==='sentinel'?32:22, maxsp: id==='sentinel'?16:28,
      hp: id==='sentinel'?32:22, sp: id==='sentinel'?16:28, overload:0,
      rank: rk.label, dark: rk.dark, rankScore: rk.score,
      partnerName: pr.name, partnerId: pr.identity, partnerStrong: pr.strong, linked:false,
    };
  }
  setChar(c);
  // 关系标签不再直接显示，留给玩家探索；仅保留搭档/导师/同期等内部关系
  const chief = OTHERS.find(o=>o.idfor===id && o.role==='mentor');
  const peer  = OTHERS.find(o=>o.idfor===id && o.role==='friend');
  G.relation={};
  G.relation[c.partnerName]='恋';
  if(chief) G.relation[chief.name]='敬重';
  if(peer)  G.relation[peer.name]='好友';
  // 所有人都有好感度（默认 0，联系人页统一显示）
  PARTNERS.forEach(p=>{ if(G.affinity[p.name]==null) G.affinity[p.name]=0; });
  OTHERS.forEach(o=>{ if(G.affinity[o.name]==null) G.affinity[o.name]=0; });
  G.userContacts.forEach(u=>{ if(G.affinity[u.name]==null) G.affinity[u.name]=0; });
  G.affinity[c.partnerName]=G.affinity[c.partnerName]||0;
  if(chief) G.affinity[chief.name]=G.affinity[chief.name]||0;
  if(peer)  G.affinity[peer.name]=G.affinity[peer.name]||0;
  buildAllyThreads();
  if(edit){
    toast(`资料已更新 · ${c.name} · 评级 ${c.rank}${c.dark?'（黑暗）':''}`);
    renderMe(); return;
  }
  // 向导入册后，会陆续收到哨兵的疏导预约（由向导决定是否接下）
  if(id==='guide'){
    const sents=PARTNERS.filter(p=>p.identity==='sentinel');
    const s1=pick(sents)||{name:'外勤哨兵'};
    const others=sents.filter(p=>p!==s1);
    const s2=others.length?pick(others):s1;
    G.sootheReqs=[
      {from:s1.name, to:c.name, status:'pending', time:nowStr(), no:'SN-1042', type:'表层疏导 · 卸除杂念', level:'优先 · 24 小时内', slot:'今夜 22:30 后', room:'待向导指定', allowAlt:true, overload:74, rank:s1.rank||'A', animal:s1.animal||'狼',
       note:'今天外勤回来感官有点炸，耳朵里一直嗡嗡的，屏障边缘发烫。能排个时段吗？实在不行，随便哪个向导都行。'},
      {from:s2.name, to:c.name, status:'pending', time:nowStr(), no:'SN-1043', type:'深层净化 · 精神图景', level:'常规 · 48 小时内安排即可', slot:'明日 14:00', room:'待向导指定', allowAlt:false, overload:58, rank:s2.rank||'A', animal:s2.animal||'隼',
       note:'听说你疏导稳，想约一次深度净化。上回那单的黑哨痕迹好像粘在图景里了，我自己弄不掉。指定你，不接受备选。'},
    ];
  }
  // 入册后，搭档/导师/同期各有一条待读消息
  G.unread={partner:1, mentor:1, friend:1};
  // 结合需自行在「匹配」中心申请
  G.bondApp=null; G.match=null;
  toast(`入册完成 · ${c.name} · 评级 ${c.rank}${c.dark?'（黑暗）':''} · 搭档 ${pr.name}`);
  renderMe();
}

function mGoTo(id){
  const m=G.m; m.step=id; m.started=true;
  const s=m.scenes[id];
  if(!s){ console.error('no scene',id); return; }
  const sceneEl=$('mScene');
  if(s.render){
    sceneEl.innerHTML = typeof s.render==='function'?s.render():s.render;
    if(s.afterRender) s.afterRender();
    if(s.onEnter) s.onEnter();
    renderMissionStats();
    const sc=document.getElementById('mScroll'); if(sc) sc.scrollTop=0;
    return;
  }
  const body=resolve(s.body);
  const opts=resolve(s.opts);
  let pre='';
  if(s.chapter) pre+=`<div class="chapter">${resolve(s.chapter)}</div>`;
  if(s.story) pre+=`<div class="story-box">${resolve(s.story)}</div>`;
  let html=pre+`<div class="scene"><h2>${s.title}</h2>`;
  if(s.sub) html+=`<div class="sub">${s.sub}</div>`;
  (body||[]).forEach(p=>{
    const t=resolve(p.t), flav=resolve(p.flav);
    if(flav) html+=`<div class="flavor">${flav}</div>`; else html+=`<p>${t}</p>`;
  });
  html+='</div>';
  sceneEl.innerHTML=html;
  const old=sceneEl.querySelector('.options'); if(old) old.remove();
  const oldA=sceneEl.querySelector('.answer-box'); if(oldA) oldA.remove();
  if(opts){ const box=document.createElement('div'); box.className='options';
    opts.forEach(o=>box.appendChild(makeOpt(o))); sceneEl.appendChild(box); }
  if(s.onEnter) s.onEnter();
  renderMissionStats();
  document.getElementById('mScroll').scrollTop=0;
}
function makeOpt(o){
  if(o.type==='answer'){
    const ask=document.createElement('div'); ask.className='answer-ask';
    ask.textContent='✍ '+ (o.ask||'你也可以亲自回应——故事会顺着你的话继续推进：');
    const wrap=document.createElement('div'); wrap.className='answer-box';
    const inp=document.createElement('input'); inp.id='answerInput'; inp.placeholder=o.placeholder||'以你自己的方式回应……';
    const btn=document.createElement('button'); btn.className='primary'; btn.textContent='回应 ▸'; btn.style.width='auto';
    btn.onclick=()=>mAnswer(o);
    wrap.appendChild(inp); wrap.appendChild(btn);
    const frag=document.createDocumentFragment(); frag.appendChild(ask); frag.appendChild(wrap); return frag;
  }
  let label=resolve(o.label); if(!label&&o.log) label=o.log; if(!label&&o.toast) label=o.toast;
  const hint=resolve(o.hint);
  const b=document.createElement('button'); b.className='opt'+(o.cls?(' '+o.cls):'');
  b.innerHTML=`<span class="ico">${o.ico||'▸'}</span><span>${label}<small>${hint||''}</small></span>`;
  b.onclick=()=>mChoose(o);
  return b;
}
function mChoose(o){
  if(o.type==='goto'){ if(o.onPick) o.onPick(); if(o.to==='__back'){ G.m=null; renderTower(); } else mGoTo(o.to); return; }
  if(o.type==='create'){ G.m.started=true; window._missionCreate=o.identity; mGoTo('m_customize'); return; }
  if(o.type==='check'){ mCheck(o); return; }
  if(o.type==='event'){ mEvent(o); return; }
  if(o.type==='link'){ mLink(o); return; }
  if(o.type==='answer'){ mAnswer(o); return; }
}
function mAnswer(o){
  const input=document.getElementById('answerInput');
  const text=(input&&input.value||'').trim();
  let key='default';
  if(text){ for(const k in (o.branches||{})){ if((o.branches[k]||[]).some(kw=>text.includes(kw))){ key=k; break; } } }
  const react=o.react? (typeof o.react==='function'?o.react(text,key):o.react) : `你回应：「${text||'（沉默）'}」`;
  addMLog(`🗣 <b>你</b>：${text||'（沉默以对）'}`);
  addMLog(`<span class="story">${react}</span>`);
  const target=(o.route&&o.route[key])?o.route[key]:(o.route&&o.route.default);
  setTimeout(()=>mGoTo(target),700);
}
async function mCheck(o){
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const attrKey=resolve(o.attr);
  const c=C(); const attrVal=c.attr[attrKey]||0;
  const mod=resolve(o.mod)||0;
  const overloadPenalty=(c.identity==='sentinel'&&c.overload>=100)?5:0;
  const linkBonus=(attrKey==='con'&&c.linked&&c.identity==='sentinel')?2:0;
  const totalMod=attrVal+mod-linkBonus-overloadPenalty;
  let adv=(typeof o.advantage==='function')?resolve(o.advantage):(o.advantage?true:(o.disadvantage?false:null));
  if(c.identity==='sentinel'&&c.overload>=100) adv=false;
  const wrap=$('mDice'); wrap.innerHTML=''; $('mVerdict').textContent=''; $('mCheckInfo').textContent='';
  const dice=[]; const n=adv===null?1:2;
  for(let i=0;i<n;i++){ const d=document.createElement('div'); d.className='die'; d.innerHTML=`<span class="tag">${adv?'2d20':'1d20'}</span><span class="num">?</span>`; wrap.appendChild(d); dice.push(d); }
  const rolls=[]; for(let i=0;i<n;i++) rolls.push(1+rnd(20));
  let chosen; if(adv===true) chosen=Math.max(...rolls); else if(adv===false) chosen=Math.min(...rolls); else chosen=rolls[0];
  const total=chosen+totalMod; const success=total>=o.dc;
  await Promise.all(dice.map((d,i)=>animateDie(d,20,rolls[i],(n===1&&rolls[i]===20)?'crit':(n===1&&rolls[i]===1?'fail':null))));
  let info=`【${ATTR_NAME[attrKey]} ${attrVal}${mod?(' '+(mod>0?'+':'')+mod):''}${linkBonus?(' 链接+'+linkBonus):''}${overloadPenalty?(' 过载-'+overloadPenalty):''}】 `;
  if(n===2) info+=`2d20 取${adv?'高':'低'}=${chosen} → 总计 <b>${total}</b> vs DC ${o.dc}`;
  else info+=`1d20=${chosen} → 总计 <b>${total}</b> vs DC ${o.dc}`;
  $('mCheckInfo').innerHTML=info;
  $('mVerdict').textContent=success?'✦ 成功':'✕ 失败';
  $('mVerdict').className='verdict '+(success?'ok':'no');
  addMLog(`🎲 ${ATTR_NAME[attrKey]} 检定：掷${n>1?(adv?'2d20取高':'2d20取低'):'1d20'} 得 ${chosen}，总计 ${total} / DC ${o.dc} → ${success?'<span class="win">成功</span>':'<span class="lose">失败</span>'}`);
  if(o.overload) mOverload(resolve(o.overload));
  setTimeout(()=>{ mGoTo(success?o.success:o.fail); },1000);
}
async function mLink(o){
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const c=C(); const attr=c.identity==='sentinel'?'cha':'spi'; const attrVal=c.attr[attr];
  const wrap=$('mDice'); wrap.innerHTML=''; $('mVerdict').textContent=''; $('mCheckInfo').textContent='';
  const d=document.createElement('div'); d.className='die'; d.innerHTML=`<span class="tag">链接</span><span class="num">?</span>`; wrap.appendChild(d);
  const roll=1+rnd(20); const total=roll+attrVal; const success=total>=o.dc;
  await animateDie(d,20,roll,roll===20?'crit':(roll===1?'fail':null));
  $('mCheckInfo').innerHTML=`【${ATTR_NAME[attr]} ${attrVal}】 建立精神链接：1d20=${roll} → 总计 <b>${total}</b> vs DC ${o.dc}`;
  $('mVerdict').textContent=success?'🔗 链接建立':'链接微弱';
  $('mVerdict').className='verdict '+(success?'ok':'no');
  addMLog(`🔗 精神链接检定：${ATTR_NAME[attr]} 得 ${total} / DC ${o.dc} → ${success?'<span class="win">成功</span>':'<span class="lose">失败</span>'}`);
  if(success){ c.linked=true; toast('精神链接已建立'); renderMissionStats(); }
  setTimeout(()=>{ mGoTo(success?o.success:o.fail); },1000);
}
function mEvent(o){
  const c=C();
  if(o.hp) c.hp=clamp(c.hp+o.hp,0,c.maxhp);
  if(o.sp) c.sp=clamp(c.sp+o.sp,0,c.maxsp);
  if(o.overload) mOverload(resolve(o.overload));
  if(o.flag) c[o.flag]=true;
  if(o.log) addMLog(o.log);
  if(o.toast) toast(o.toast);
  renderMissionStats();
  mGoTo(o.to);
}
function mOverload(v){
  const c=C(); if(c.identity!=='sentinel') return;
  const before=c.overload; c.overload=clamp(c.overload+v,0,100);
  if(before<100&&c.overload>=100) toast('⚠ 感官过载！你陷入暴躁');
}
function addMLog(html, silent){
  G.m.log.unshift(html);
  const el=$('mLog'); if(!el) return;
  const d=document.createElement('div'); d.innerHTML=html; el.insertBefore(d, el.firstChild);
}

/* 骰子动画 */
function animateDie(el, sides, finalVal, crit){
  return new Promise(res=>{
    let ticks=0; const total=14; el.classList.add('rolling');
    const iv=setInterval(()=>{ el.querySelector('.num').textContent=1+rnd(sides); ticks++;
      if(ticks>=total){ clearInterval(iv); el.classList.remove('rolling'); el.querySelector('.num').textContent=finalVal;
        if(crit==='crit') el.classList.add('crit'); if(crit==='fail') el.classList.add('fail'); res(); } },55);
  });
}

/* 好感度 */
function affLevel(af){
  af = af==null?0:af;
  if(af<=20) return 1;
  if(af<=40) return 2;
  if(af<=60) return 3;
  if(af<=80) return 4;
  return 5;
}
function affColor(lv){ return ['#6b7aa6','#5ad1ff','#b78bff','#ff6b8a','#ffd479'][lv-1]; }
function affBadge(af){
  const lv = affLevel(af), c = affColor(lv);
  return `<span class="aff-badge" style="--lvl-color:${c};"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span class="lvl">${lv}</span></span>`;
}
function affStageText(af){
  const lv=affLevel(af);
  return ['初识','熟悉','亲近','暧昧','倾心'][lv-1];
}
/* 是否可以显示「更进一步」（可结合）：异性身份 + 匹配度>50 + 好感≥55 */
function canBondWith(name){
  if(!G.char) return false;
  const p=findPerson(name); if(!p || !p.identity) return false;
  const c=C(); if(p.identity===c.identity) return false;
  if((G.affinity[name]||0) < 55) return false;
  return calcMatch(c.attr, p) > 50;
}
/* 当前搭档 = 结合后的伴侣（唯一搭档）；入册时由白塔指派临时搭档 */
function isBondedWith(name){ return !!(G.bondApp && G.bondApp.status==='bound' && G.bondApp.to===name); }
/* 关系标签：依据好感度 / 异性 / 契合度 / 是否已结合统一推导，每个角色都对应一个阶段 */
function relInfo(name){
  if(!G.char) return {label:'白塔同僚', cls:'rel-muted'};
  const c=C();
  const p=findPerson(name); if(!p || !p.identity) return {label:'联系人', cls:'rel-muted'};
  const af=G.affinity[name]||0;
  const isPartner = c.partnerName===name;
  if(isBondedWith(name)) return {label:'伴侣', cls:'rel-partner'};
  const opp = p.identity!==c.identity;
  const matchOK = opp && calcMatch(c.attr, p) > 50;
  if(isPartner){
    // 初始为「临时搭档」，好感升高后升级；结合后走 isBondedWith 分支（伴侣）
    if(af>=80) return {label:'心动搭档', cls:'rel-romance'};
    if(af>=55) return {label:'亲密搭档', cls:'rel-partner'};
    if(af>=30) return {label:'默契搭档', cls:'rel-friend'};
    return {label:'临时搭档', cls:'rel-temp'};
  }
  if(opp && matchOK && af>=55) return {label:'可结合对象', cls:'rel-romance'};
  // 按好感度阶段
  if(af>=60) return {label:'挚友', cls:'rel-friend'};
  if(af>=40) return {label:'友人', cls:'rel-friend'};
  if(af>=20) return {label:'相识', cls:'rel-muted'};
  return {label:'初识', cls:'rel-muted'};
}
function relCard(name){
  const r=relInfo(name);
  const af=G.affinity[name]||0;
  return `<div class="card rel-card ${r.cls}"><div class="stat-title" style="font-weight:700;color:var(--dim);font-size:13px;margin-bottom:6px;">你们的关系</div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="rel-chip ${r.cls}">${r.label}</div>
      <div style="flex:1;margin-left:auto;">${affBadge(af)}<span class="aff-note" style="margin-left:4px;">${affStageText(af)} · ${af}/100</span></div>
    </div></div>`;
}
/* ——— 隐藏好感判定：同一个选项，对不同性格的人加减完全不同 ———
   规则：撞上 TA 偏爱的口吻 → 大涨；踩到 TA 的雷点 → 大跌；
        其它口吻只小幅波动，甚至完全不变。
   所有选项都不显示任何数值，只有选完之后 TA 的反应会告诉你。 */

/* ======== 好感力度调参区（改这里就能改手感，保存后刷新页面即可）========
   当前使用「更轻」档：踩到雷点只掉 3~6，偶尔说错话不至于一次翻车。
   想更狠（踩雷代价大）  ：hateMin:8, hateMax:14, neutralPool:[-3,-2,-1,0,1,1]
   想回到中间档（初版）  ：hateMin:5, hateMax:9,  neutralPool:[-2,-1,0,0,1,2]
   likeMin/likeMax  偏爱时的加分区间（撞对胃口 +6~+9，不随档位变）
   neutralPool      其它口吻的取值池：小加小减或不变
   highDamp         好感越高，加分越钝：d*(1-好感/highDamp)，150 ≈ 好感 90 时只剩三成
   lowBoost         好感越高，扣分越狠：d*(lowBoost+好感/200)                    */
const AFF_TUNE={ likeMin:6, likeMax:9, hateMin:3, hateMax:6,
                 neutralPool:[-1,0,0,1,1,2], highDamp:150, lowBoost:0.7 };

function persOf(name){
  const p=findPerson(name);
  return (p && p.pers) ? p.pers : null;
}
function affOf(name, tone){
  const af=G.affinity[name]||0;
  const pers=persOf(name);
  let d;
  if(!pers){
    d=pick(AFF_TUNE.neutralPool);                          // 无档案者：无偏好，只小幅波动
  } else if(tone && pers.like.indexOf(tone)>=0){
    d=AFF_TUNE.likeMin+rnd(AFF_TUNE.likeMax-AFF_TUNE.likeMin+1);   // 偏爱
  } else if(tone && pers.hate.indexOf(tone)>=0){
    d=-(AFF_TUNE.hateMin+rnd(AFF_TUNE.hateMax-AFF_TUNE.hateMin+1)); // 雷点
  } else {
    d=pick(AFF_TUNE.neutralPool);                          // 一般：小加小减或不变
  }
  if(d>0) d=Math.max(1, Math.round(d*(1-af/AFF_TUNE.highDamp)));
  else if(d<0) d=Math.min(-1, Math.round(d*(AFF_TUNE.lowBoost+af/200)));
  return d;
}
/* 选完之后只给一句体感描述，不给数字 */
function affFeedback(name, d){
  const pers=persOf(name);
  const say=(arr, alt)=>(pers&&pers[arr]&&pers[arr].length)?pick(pers[arr]):alt;
  if(d>=6) return say('good','对方的语气明显软了下来。');
  if(d>=3) return '对方似乎挺受用，回了你一句软话。';
  if(d>=1) return '对方应了一声，态度没什么变化。';
  if(d===0) return '对方没什么反应。';
  if(d>=-3) return '对方「嗯」了一声，语气淡了一分。';
  if(d>=-6) return '对方明显不太高兴，回得比刚才短了。';
  return say('bad','这话像是踩到了雷点。');
}
function applyAff(name, d){
  if(!G.char || !name) return 0;
  const before=G.affinity[name]||0;
  const after=clamp(before+d,0,100);
  G.affinity[name]=after;
  if(d) toast(`${name}：${affFeedback(name,d)}`);
  if(name===C().partnerName && before<55 && after>=55 && G.unread.romance==null){
    G.unread.romance=1; toast('💞 心动支线已解锁，去「消息」看看'); refreshNavBadges();
  }
  return after-before;
}
/* 带口吻的判定：有口吻就交给性格，没有就用兜底数值 */
function applyToneAff(name, tone, fallbackN){
  const d = tone ? affOf(name, tone) : (fallbackN||0);
  return applyAff(name, d);
}

function swipeStart(ev){
  const row=ev.currentTarget;
  if(ev.type==='mousedown' && ev.button!==0) return;
  const x=(ev.touches&&ev.touches[0]?ev.touches[0].clientX:ev.clientX);
  swipeCloseAll(row);
  SWIPE={row, x0:x, dx:0, open:row.classList.contains('open')};
}
function swipeMove(ev){
  if(!SWIPE) return;
  const x=(ev.touches&&ev.touches[0]?ev.touches[0].clientX:ev.clientX);
  let dx=x-SWIPE.x0+(SWIPE.open?SWIPE_W:0);
  dx=Math.max(-6, Math.min(SWIPE_W, dx));
  SWIPE.dx=dx;
  if(Math.abs(dx)>6) SWIPE_DRAGGED=true;
  const body=SWIPE.row.querySelector('.swipe-body');
  if(body) body.style.transform='translateX('+dx+'px)';
  if(ev.cancelable && ev.type==='touchmove') ev.preventDefault();
}
function swipeEnd(){
  if(!SWIPE) return;
  const row=SWIPE.row, body=row.querySelector('.swipe-body');
  const open=SWIPE.dx>SWIPE_W*0.45;
  row.classList.toggle('open', open);
  if(body) body.style.transform='translateX('+(open?SWIPE_W:0)+'px)';
  SWIPE=null;
  setTimeout(function(){ SWIPE_DRAGGED=false; }, 60);
}

function openThread(k){
  const t=getThread(k);
  if(!t) return;
  if(t.requireAff!=null && (G.affinity[C().partnerName]||0)<t.requireAff){ toast('好感度不足，暂未解锁'); return; }
  const prog=G.chatProgress[k]||0;
  G.openThread=k; G.app='chat'; $('appDot').textContent='消息';   // 进入不清红点，玩家主动退出才刷新
  // 聊过的人自动加入消息列表
  if(!G.threads) G.threads=[];
  if(G.threads.indexOf(k)<0) G.threads.push(k);
  const name = chatTitle(k);
  const color = chatColor(k);
  const affName = chatAffName(k);
  const aff = affName ? (G.affinity[affName]||0) : 0;
  let bodyHtml='';
  // 已过的步骤显示为气泡
  for(let i=0;i<prog;i++){
    const st=t.steps[i];
    bodyHtml+=`<div class="bubble them">${resolve(st.npc)}</div>`;
    if(st._reply) bodyHtml+=`<div class="bubble me">${esc(st._reply)}</div>`;
  }
  let replyHtml='';
  if(prog<t.steps.length){
    const st=t.steps[prog];
    bodyHtml+=`<div class="bubble them">${resolve(st.npc)}</div>`;
    replyHtml = st.replies.map((r,idx)=>`<button class="reply" onclick="sendReply('${k}',${idx})">${resolve(r.label)}</button>`).join('');
  } else {
    bodyHtml+=`<div class="bubble sys">${t.close||'对话已结束'}</div>`;
    if(t.date) bodyHtml+=`<div class="bubble sys">${t.date}</div>`;
  }
  const affBar = affName ? `<div class="affinity"><span class="heart">❤</span><div class="bar mt"><i style="width:${aff}%"></i></div><span>${aff}/100</span></div>` : '';
  $('screen').innerHTML = `
    ${appBar(name, '私信','exitThread()')}
    <div class="chat-body" id="chatBody">${bodyHtml}</div>
    ${affBar}
    <div class="chat-replies" id="chatReplies">${replyHtml||'<div class="muted" style="text-align:center;font-size:12px;">— 已读 —</div>'}</div>
    <div class="chat-input">
      <input id="freeInput" placeholder="也可以自己写点什么…" onkeydown="if(event.key==='Enter')sendFree('${k}')">
      <button class="primary" onclick="sendFree('${k}')">发送</button>
    </div>
    ${(k.indexOf('gen:')===0)?`<div style="padding:0 14px 18px;">${threadDeleteButton('thread', k)}</div>`:''}`;
  const cb=$('chatBody'); cb.scrollTop=cb.scrollHeight;
}
function sendReply(k, idx){
  const t=getThread(k); const prog=G.chatProgress[k]||0;
  if(prog>=t.steps.length) return;
  const st=t.steps[prog]; const r=st.replies[idx];
  // 记录我的回复
  st._reply = resolve(r.reply) || resolve(r.label);
  // 好感：选项不带任何数值，加减完全由对方这一局的性格判定
  const an0=chatAffName(k);
  if(an0) applyToneAff(an0, r.t||null, (r.aff!=null?r.aff:(r.delta||0)));
  G.chatProgress[k]=prog+1;
  // 若该步 lock 为 close/date 且到了末步处理
  const cb=$('chatBody');
  const meD=document.createElement('div'); meD.className='bubble me'; meD.textContent=st._reply; cb.appendChild(meD);
  // 移除旧回复按钮
  $('chatReplies').innerHTML='';
  const np=G.chatProgress[k];
  if(np<t.steps.length){
    const nst=t.steps[np];
    const them=document.createElement('div'); them.className='bubble them'; them.textContent=resolve(nst.npc);
    setTimeout(()=>{ cb.appendChild(them); cb.scrollTop=cb.scrollHeight; renderReplies(k);
      if(G.openThread!==k){ G.unread[k]=(G.unread[k]||0)+1; refreshNavBadges(); } }, 500);
  } else {
    const sys=document.createElement('div'); sys.className='bubble sys'; sys.textContent=t.close||'对话已结束';
    setTimeout(()=>{ cb.appendChild(sys); if(t.date){ const d2=document.createElement('div'); d2.className='bubble sys'; d2.textContent=t.date; cb.appendChild(d2);} cb.scrollTop=cb.scrollHeight; renderReplies(k);
      if(G.openThread!==k){ G.unread[k]=(G.unread[k]||0)+1; refreshNavBadges(); } }, 500);
    if(k==='romance'){ toast('💞 心动支线已开启'); G.unread[k]=0; }
  }
  // 更新好感条（原地刷新，不跳页）
  const an=chatAffName(k);
  const aff=an?(G.affinity[an]||0):0;
  const bar=$('chatBody').parentNode.querySelector('.bar.mt > i');
  if(bar) bar.style.width=aff+'%';
  const affSpan=$('chatBody').parentNode.querySelector('.affinity span:last-child');
  if(affSpan) affSpan.textContent=aff+'/100';
}
function renderReplies(k){
  const t=getThread(k); const prog=G.chatProgress[k]||0;
  const box=$('chatReplies'); if(!box) return;
  if(prog<t.steps.length){
    const st=t.steps[prog];
    box.innerHTML=st.replies.map((r,idx)=>`<button class="reply" onclick="sendReply('${k}',${idx})">${resolve(r.label)}</button>`).join('');
  } else {
    box.innerHTML='<div class="muted" style="text-align:center;font-size:12px;">— 已读 —</div>';
  }
}

function sendFree(k){
  const inp=$('freeInput'); const text=(inp&&inp.value||'').trim(); if(!text) return;
  const cb=$('chatBody'); if(!cb) return;
  const meD=document.createElement('div'); meD.className='bubble me'; meD.textContent=text; cb.appendChild(meD);
  // 关键词路由，挑一句自然回复
  const cats={soothe:K_SOOTHE, force:K_FORCE, flee:K_FLEE, call:K_CALL};
  let key='default';
  for(const c in cats){ if(cats[c].some(w=>text.includes(w))){ key=c; break; } }
  const replyMap={
    soothe:'（对方轻笑）……你这话，比任何疏导都管用。',
    force:'（对方顿了顿）狠了点，但我听懂了。',
    flee:'（对方）好，那我先不动，等你想清楚。',
    call:'（对方）嗯，我记得你。一直都记得。',
    default:'（对方）……我记下了。'
  };
  const an=chatAffName(k);
  const toneMap={soothe:'温柔', force:'强硬', flee:'示弱', call:'直球'};
  const tone=toneMap[key]||null;
  if(an){                       // 自由输入也按口吻判定，但幅度收窄，避免刷分
    const d = tone ? clamp(affOf(an,tone),-5,5) : (1+rnd(2));
    applyAff(an, d);
  }
  setTimeout(()=>{ const d=document.createElement('div'); d.className='bubble them'; d.textContent=replyMap[key]; cb.appendChild(d); cb.scrollTop=cb.scrollHeight; }, 500);
  inp.value='';
}

/* ============ 哨向论坛 ============ */
function findPost(id){ return FORUM.find(p=>p.id===id) || G.userPosts.find(p=>p.id===id); }
const BOARDS = ['闲聊','求助','任务','树洞','官方'];
function postBoard(p){
  if(p.board) return p.board;
  const m=(p.title||'').match(/^【(.+?)】/);
  const t=m?m[1]:'闲聊';
  return t==='置顶'?'官方':(BOARDS.indexOf(t)>=0?t:'闲聊');
}
function renderForum(){
  G.app='forum'; $('appDot').textContent='论坛';
  const board=G.forumBoard||'全部';
  const all=[...FORUM, ...G.userPosts];
  const boards=['全部'].concat(BOARDS.filter(b=>all.some(p=>postBoard(p)===b)));
  const tabs=`<div class="board-tabs">${boards.map(b=>`<span class="f-chip ${b===board?'on':''}" onclick="G.forumBoard='${b}';renderForum()">${b}</span>`).join('')}</div>`;
  const list=board==='全部'?all:all.filter(p=>postBoard(p)===board);
  const posts=list.map(p=>{
    const liked=G.forumLiked[p.id];
    const excerpt=(p.body||'').length>60?p.body.slice(0,60)+'…':p.body;
    return `<div class="post" onclick="renderPostDetail('${p.id}')">
      <div class="p-top"><div class="av" style="background:#26334f;width:34px;height:34px;font-size:16px;">${p.name[0]}</div>
        <div class="p-name">${p.name}</div><span class="p-id ${p.idtag==='官方'?'guide':''}" style="${p.idtag==='官方'?'color:var(--guide);border-color:var(--guide)':''}">${p.idtag}</span>
        <div class="p-time">${p.time}</div></div>
      <div class="p-title">${p.title}</div>
      <div class="p-body">${excerpt}</div>
      <div class="p-acts">
        <span class="${liked?'liked':''}" onclick="event.stopPropagation();likePost('${p.id}')">${liked?'❤ 已赞':'🤍 赞'} ${p.likes+(liked?1:0)}</span>
        <span onclick="event.stopPropagation();renderPostDetail('${p.id}')">💬 评论 ${p.comments.length}</span>
        <span style="margin-left:auto;color:var(--dim);font-size:11px;">#${postBoard(p)}</span>
      </div>
    </div>`;
  }).join('');
  $('screen').innerHTML=`
    ${appBar('哨向论坛','白塔匿名广场')}
    <div class="scroll">
      <button class="btn accent" onclick="startNewPost()" style="margin-bottom:10px;">✍ 发新帖</button>
      ${tabs}
      ${posts||'<div class="muted" style="font-size:12px;">这个板块还空着，来发第一帖。</div>'}
    </div>`;
}
function renderPostDetail(id){
  const p=findPost(id); if(!p) return;
  G.app='forum';
  const liked=G.forumLiked[p.id];
  const comments=p.comments.map(c=>`<div class="comment"><b>${c.n}</b>：${c.t}</div>`).join('');
  $('screen').innerHTML=`
    ${appBar(p.title,'详情 · 哨向论坛','renderForum()')}
    <div class="scroll">
      <div class="post">
        <div class="p-top"><div class="av" style="background:#26334f;width:34px;height:34px;font-size:16px;">${p.name[0]}</div>
          <div class="p-name">${p.name}</div><span class="p-id ${p.idtag==='官方'?'guide':''}" style="${p.idtag==='官方'?'color:var(--guide);border-color:var(--guide)':''}">${p.idtag}</span>
          <div class="p-time">${p.time}</div></div>
        <div class="p-title">${p.title}</div>
        <div class="p-body">${p.body}</div>
        <div class="p-acts">
          <span class="${liked?'liked':''}" onclick="likePost('${p.id}')">${liked?'❤ 已赞':'🤍 赞'} ${p.likes+(liked?1:0)}</span>
          <span>💬 评论 ${p.comments.length}</span>
        </div>
      </div>
      <div class="card"><div class="stat-title" style="font-weight:700;color:var(--dim);font-size:13px;margin-bottom:8px;">评论</div>${comments||'<div class="muted">还没有评论，来抢沙发。</div>'}</div>
      <div class="comment-box"><input id="cinput_${p.id}" placeholder="友善发言…"><button class="btn primary" style="width:auto;margin-top:0;" onclick="addComment('${p.id}')">发送</button></div>

function startNewPost(){
  G.app='forum'; $('appDot').textContent='论坛';
  const me=G.created?C().name:'匿名外勤';
  const idtag=G.created?(C().identity==='sentinel'?'哨兵':'向导'):'匿名';
  const boards=BOARDS.filter(b=>b!=='官方');

    ${appBar('发新帖','哨向论坛','renderForum()')}

      <div class="card" style="background:linear-gradient(180deg,rgba(183,139,255,.08),rgba(90,209,255,.03));border-left:3px solid var(--spirit);">
        <div class="muted" style="font-size:12px;line-height:1.7;">白塔论坛默认<b>匿名</b>，但你的发帖 ID 会带身份标记。发完后会出现在对应<b>板块</b>里，塔里的人可能会回你。</div>

        <div class="f-row" id="npBoard">
          ${boards.map((b,i)=>`<span class="f-chip ${i===0?'on':''}" data-v="${b}" onclick="pickChip('npBoard',this)">${b}</span>`).join('')}

  $('npBtn').onclick=submitPost;

function submitPost(){
  const board=chipVal('npBoard')||'闲聊';
  const title=(($('npTitle')&&$('npTitle').value)||'').trim();
  if(!title){ toast('标题不能为空'); return; }
  const body=(($('npBody')&&$('npBody').value)||'').trim();
  const anon=chipVal('npAnon')==='1';
  const me=G.created?C().name:'匿名外勤';
  const idtag=G.created?(C().identity==='sentinel'?'哨兵':'向导'):'匿名';
  const id='u'+G.userPosts.length+'_'+rnd(9999);
  G.userPosts.unshift({id, name:anon?'匿名':me, idtag:anon?'匿名':idtag, time:'刚刚',
    title:(/^【/.test(title)?title:('【'+board+'】'+title)), board, body:body||'(无内容)', likes:0, comments:[]});
  G.forumBoard=board;
  toast('已发布到「'+board+'」板块');
  renderForum();
}
function likePost(id){ G.forumLiked[id]=!G.forumLiked[id]; if($('cinput_'+id)) renderPostDetail(id); else renderForum(); }
function addComment(id){
  const inp=$('cinput_'+id); const v=(inp&&inp.value||'').trim();
  if(!v) return;
  const p=findPost(id); const me = G.created?C().name:'匿名外勤';
  p.comments.push({n:me, t:v}); inp.value=''; renderPostDetail(id); toast('评论已发送');
}
function focusComment(id){ const e=$('cinput_'+id); if(e) e.focus(); }

/* ============ 匹配系统 ============ */
function renderMatch(){
  G.app='match'; $('appDot').textContent='匹配';
  if(!G.char){ $('screen').innerHTML=`${appBar('匹配中心','哨向结合')}<div class="scroll"><div class="card">请先创建角色。</div></div>`; return; }
  const c=C(); const attr=c.attr;
  // 选择新搭档候选人页
  if(G._changePick){
    const cands=PARTNERS.filter(p=>p.identity!==c.identity && p.name!==c.partnerName);
    const list=cands.map(p=>`<div class="thread" onclick="applyChangePartner('${p.name}')">
      <div class="av" style="background:${p.color}">${p.name[0]}</div>
      <div style="flex:1;min-width:0;"><div class="t-name">${p.name}</div>
