      e_approach:{ chapter:'第一章 · 入巷', story:()=>`槐安巷比地图上窄。路灯坏了一半，剩下的把青石板照成一块块惨白，砖缝里积着去年的落叶，踩上去是湿的。空气里浮着旧木头、潮霉，还有一丝若有若无的<b>向导素</b>——苏曼留下的气息，甜里发苦，淡得快要散了。<br><br>前方巷尾，一只<b>渡鸦</b>的虚影卡在半空。翅膀一下一下地扑，却怎么也飞不出那道无形的墙。每扑一次，巷子里就回荡起一声年轻男人的嘶吼：「我撑不住了——」声音撞在砖墙上，回来时已经变了形，像隔着一层水。你的耳膜跟着发麻，后颈的汗毛竖了起来。<br><br>你脚边的精神体竖起耳朵，喉咙里滚出一声低鸣。你抬手示意它别动，自己蹲下来，把掌心贴住地面：回声是有形状的，它像一层贴地的雾，正顺着砖缝往你鞋面上爬，凉得像刚化的雪水。<br><br>「先听清它是谁的，再进去。」你对自己说。这句话是苏曼写在训练手册扉页上的，当年你抄过一遍，一直没忘。`,
        title:'卡住的渡鸦', sub:'感知检定',
        body:[{flav:'要进得去，先得听清这段回声里，藏着谁的崩溃。'},
          {t:'外勤时限四个小时。超过之后，回声会把你算成它的一部分。'}],
        opts:[{type:'check',attr:'per',dc:12,advantage:()=>C().linked,overload:()=>C().identity==='sentinel'?6:0,
          label:'【感知】在回声里辨出那名哨兵的轮廓',hint:'感知 1d20 + 感知值 vs DC 12（已链接则有优势）',success:'e_kit',fail:'e_approach_f'}] },

      e_approach_f:{ title:'回声太杂', sub:'听觉反震',
        story:()=>`你听岔了。<br><br>回声不是一条干净的线，更像一锅被人不停搅动的汤，谁的念头都在里面浮着，沉下去的那些还在往上冒泡。几道邻里的梦呓从没关严的窗缝里漏下来，混进那声嘶吼，你一时分不清哪句是他喊的，哪句是别人的遗憾。太阳穴突突地跳，耳膜上像贴了一层湿纸，连自己的呼吸听着都陌生。<br><br>你索性闭上眼。眼前黑下去，别的感官才慢慢归位：你用指尖去读渡鸦翅膀的振频——一下，又一下，快得几乎连成一条线。数到第四十下，你终于摸准了那道嘶吼的来路：巷尾左数第三户，一扇没有关严的门。门缝里没有光，却有一点暖气往外渗，像有人刚走开。<br><br>「行了。」你睁开眼，站起来时膝盖发软，扶了一把墙才站稳。方向有了，剩下的就是走进去——不管门里那位，愿不愿意被找到。`,
        body:[{flav:'回声不咬人。它只是让你慢慢以为，那些念头是你自己的。'}],
        opts:[{type:'event',sp:-4,log:'🤕 听觉反震，SP-4',to:'e_kit'}] },

      e_kit:{ chapter:'第一章 · 入巷 · 巷口', title:'出车前 · 清点装备', sub:'三样里，只带一样',
        story:()=>`你在巷口的台阶上蹲下，把背包翻到最上一层。装备柜的规矩你熟：三个额度，只批一个。回声记得住一切外物——你带得越多，它越有东西可以抓。<br><br>巷子深处，渡鸦又叫了一声。这一声里夹着一个女人很轻的应答，像隔着一堵墙说：我在。你听得出那不是录音，是一个活人的意识在很远的地方挣了一下。你想起训练手册上那句：精神体从不替主人撒谎。她还活着，只是被按在了某个地方。<br><br>三样东西摊在膝盖上。冰凉的<b>感官抑制剂</b>，压得住外来的声音与画面，让你在被梦呓缠住时还分得清哪一句是自己的心思；一支<b>向导素</b>，白塔分装的浓缩样本，在陌生的精神体面前替你先把话说软；还有一副旧式<b>静音耳塞</b>，挡不住意象，但挡得住尖啸。<br><br>风从巷子里吹出来，带着潮味，卷起你脚边的落叶。你只拿得动一样。`,
        body:[{t:'额度只能兑一样。剩下的两样，会有人来收回去。'},
          {flav:'选哪一样，等于预先决定：你打算怎么从里面出来。'}],
        opts:[
          {type:'answer',ask:'你在台阶上清点了一遍，然后报出要带的那一样（关键词：抑制剂 / 向导素 / 耳塞）：',
            placeholder:'例如：「带感官抑制剂。」',
            branches:{sense:['抑制剂','感官','药','压住'], guide:['向导素','素','味道'], plug:['耳塞','静音','塞','堵']},
            route:{sense:'e_nb', guide:'e_nb', plug:'e_nb', default:'e_nb'},
            react:(t,k)=>{
              if(k==='guide'){ G.echo_kit='guide'; return `你把那支<b>向导素</b>含在舌下，不咽，剩下的两样交回给等在路口的同事。甜味一点点漫开，喉咙里那点紧被按了下去——苏曼留下的气息也是这个味道，只是淡得多。`; }
              if(k==='plug'){ G.echo_kit='plug'; return `你把<b>静音耳塞</b>怼进耳道，世界立刻闷成一片遥远的嗡嗡。声音还在，但抓不住你了。你冲同事摆摆手，示意剩下的两样不必收——你要的东西，已经戴在身上。`; }
              if(k==='sense'){ G.echo_kit='sense'; return `你接过那支<b>感官抑制剂</b>，摁进颈侧。冰凉的药液顺着血管散开，巷子里的声音被推远一层。世界变钝了，你也变清了——那声嘶吼的回荡，比它本身慢了半拍。`; }
              G.echo_kit=''; return `你把三样东西挨个掂了一遍，最后一样也没拿。同事看了你一眼，没劝，只把背包收走。你空着手站起来，觉得这样也挺好——回声抓不住没有东西可抓的人。`;
            }},
        ]},

      e_nb:{ chapter:'第一章 · 入巷 · 邻里', title:'他们也在梦里说话', sub:'亲和检定',
        story:()=>`走到第七户门口时，你踩进了一片更稠的雾，脚下的青石板变得发黏。<br><br>槐安巷的老邻居们，在同一段子夜里睡得太久了。他们的梦顺着墙根连成一片，像晾在竹竿上的湿衣服，一件挨着一件，谁家的水都滴到别人家。你从底下走过去，那些梦就滴到你身上——<br><br>「别开窗，他在楼下站了一夜。」<br>「馄饨要趁热吃。」<br>「我早就原谅他了，我只是……没来得及说。」<br><br>三句不相干的话同时挤进你的脑子，各自带着温度：一句是怕，一句是热的，最后一句凉得像铁。它们不凶，只是太近了——近到你的向导素开始替它们排队，把别人的心事排到你自己前面，像排队买早点那样自然。你抬手按住眉心，指尖底下的皮肤很烫。你慢慢开口，把每个字都咬清楚：「各家的事，回各家去。天亮了还得上班。」`,
        body:[{flav:'梦呓不咬人。它只是慢慢让你以为，你是他们中的一个。'}],
        opts:[{type:'check',attr:'cha',dc:13,advantage:()=>G.echo_kit==='sense',overload:()=>C().identity==='sentinel'?5:0,
          label:'【亲和】挨家挨户，把这些梦劝回各自的屋里',hint:'亲和 1d20 + 亲和值 vs DC 13（带感官抑制剂则有优势）',
          success:'e_echo',fail:'e_nb_f'}] },

      e_nb_f:{ chapter:'第一章 · 入巷 · 邻里', title:'梦呓缠身', sub:'被邻里拖住',
        story:()=>`你张不开嘴。<br><br>那些梦比你先开口，一句叠一句，把你的注意力撕成碎片。你想抬手去赶，手却沉得抬不起来。有个老人在梦里反复喊一个名字，喊到第七遍的时候，你的向导素跟着颤了一下——你有半秒钟，真心以为那是你在喊。你甚至想起了自己童年那扇总也关不严的窗。<br><br>你抓住最后一点清醒，顺着渡鸦的叫声硬把自己往前拽。梦呓像湿布一样缠着脚踝，拖了几步才松。等它彻底放开，你背后那件外套已经湿透了，手心里全是汗，指甲掐出的印子半天没消。你活动了一下手指，才确信它们还听你的。这一路你用的是最土的办法：用指甲在手背上划一道，让痛感把你从那些名字里一次次拽回来。<br><br>「对不住。」你回头，冲那些黑着的窗户低声说了一句。没有人回答，只有一户人家的灯，亮了又灭。你把那扇窗的位置记了下来：二楼，左数第二户，明天要写进报告里。代价是实的：这十几米你走了将近两分钟，等于把时限又白白让出去两分钟，耳朵里那层嗡响一直到巷尾都没散。`,
        opts:()=>[{type:'event',sp:G.echo_kit==='plug'?-1:-4,hp:G.echo_kit==='plug'?0:-2,
          log:G.echo_kit==='plug'?'🎧 耳塞替你挡掉了大半尖啸，SP-1':'🤕 邻里的梦呓穿颅而过，SP-4 HP-2',to:'e_echo'}] },

      e_echo:{ chapter:'第二章 · 回响深处', story:()=>`你顺着振频，落进回声的源头——一间逼仄的出租屋。<br><br>墙皮剥落，露出下面更旧的一层。桌上摆着半杯凉透的茶，杯壁上一圈茶渍干成暗褐色；椅背上搭着一件还没来得及挂起的制服。屋子里的空气是温的，像有人刚走开不久，可你伸手过去，摸到的只有灰。<br><br>那名哨兵就坐在这里，双手抱头，指节抵着自己的太阳穴。画面循环到他崩溃的刹那，又猛地倒带，重来。渡鸦守在门口，羽毛一根根炸着，替你——也替所有进来的人——先把这段痛挡在身前。它的眼睛一直盯着你，像在问：你也是来拍一张照片就走的吗。<br><br>你忽然懂了：苏曼不是被拖进来的。是她<b>主动</b>把这段回响接进自己的图景，想替他卸下。只是她接得太多，自己先卡住了。「我记得你。」你对着空气说。回声没有停，但那一秒，渡鸦没有叫。`,
        title:'他撑不住的那夜', sub:'精神检定',
        body:[{flav:'要引渡这段痛，得先确认——苏曼把自己，嵌在了哪一句回声里。'},
          {t:'这段回响每三十七秒循环一次。第三十七秒，是所有遗憾同时亮起来的时刻。'}],
        opts:[{type:'check',attr:'spi',dc:12,advantage:()=>C().linked,overload:0,
          label:'【精神】循着向导素，找到苏曼嵌在回响里的那缕意识',hint:'精神 1d20 + 精神值 vs DC 12（已链接则有优势）',success:'e_chat',fail:'e_echo_f'}] },

      e_echo_f:{ title:'被回声弹开', sub:'引渡受挫',
        story:()=>`你的向导素刚触到回响的边缘，就被那股自责狠狠弹开。<br><br>精神屏障上刮出一道细裂，像玻璃上结的霜被指尖划了一下。你尝到满嘴的铁锈味，眼前闪过一帧不属于你的画面：一只空掉的鞋，和地上一摊没有擦的水。你退后半步，后背撞在门框上，发出一声很轻的响。屋里的循环没有为这声停顿，一秒都没有。你先把自己从墙边挪开半尺，用袖口按了按鼻下——那里有一点湿，是血，不多，但提醒你这一下是实打实的。<br><br>你不硬来。你改从渡鸦入手——先顺它的羽毛，一根一根按下去，再顺着它护着的方向，慢慢摸到了苏曼蜷在角落里的那缕意识。她缩得很小，小得像硬币。你蹲下去，把自己的向导素压到最低，像把手电筒的光调到最暗，怕惊着屋里的东西。你还在门框上轻轻敲了三下，给屋里的东西一个"我还在"的信号，才敢继续往里走。<br><br>渡鸦这才挪开半步，让出一条窄缝。它的喙边沾着一点灰，像是刚替谁，把门守了很久。你冲它点了点头，像对一个尽职的守夜人。`,
        body:[{t:'这段回响拒绝被读。它只允许被陪着走完。'},
          {flav:'一个人把自己缩得很小的时候，你要找的不是她，是她护着的那一小块地方。'}],
        opts:[{type:'event',sp:-4,log:'🌀 引渡受挫，SP-4',to:'e_chat'}] },

      e_chat:{ chapter:'—— 中途 · 搭档的消息 ——', chatbeat:true,
        title:'📱 消息', sub:'任务进行中 · 搭档发来一条',
        story:()=>`你在门框边站了一会儿，等心跳慢下来。巷子里的雾顺着裤脚往上爬，凉得很有耐心。你把手按在门框上，指腹底下有一道旧裂缝，像被谁用指甲反复抠过。这里是回声的入口，也是这条巷子最深的一段：头顶那盏灯早就不亮了，只有对面楼上一扇窗透下一点黄光，把雾照成一条斜的带子。你另一只手在口袋里握了很久，掌心全是汗，连屏幕都被焐热了；信号只剩一格，右上角那点竖线忽明忽暗，像随时准备断掉。<br><br>手机在口袋里震了一下。屏幕亮起来的时候，你才发现自己半天没眨眼，眼睛干得发涩。是搭档 <b>${C().partnerName}</b>：「回声里别待太久，向导素会被同化。需要我过来接应吗？」<br><br>他/她大概一直在看你的生命体征曲线。你握着手机，指尖在屏幕上悬了两秒——回了，就等于承认自己需要人；不回，巷子里就只有你，和一段循环了三天两夜的遗憾。屏幕的光把你的影子投在墙上，那影子比你本人安静得多。<br><br>「我没事。」这句话你打了又删。最后还是重新写了一行——这一次，你没有说"我没事"，你说的是"再等我一会儿"，然后把手机贴了一下额头，像在试自己的体温。`,
        body:[{t:()=>`紧接着又进来两条。搭档 <b>${C().partnerName}</b>：「信号在你那边已经掉两格了。」<br>「别逞强，我不笑你。」<br>「门口那盏灯，我给你留着。」`},
          {flav:'巷口那盏路灯闪了一下。有人替你在外面，守着那点光。'}],
        opts:[
          {type:'answer',ask:'回他/她一句（影响好感）：',
            placeholder:'例如：「不用，我很快。」或「来吧，我有点撑不住。」',
            branches:{soothe:K_SOOTHE, force:K_FORCE, flee:K_FLEE, call:K_CALL},
            route:{soothe:'e_rav', force:'e_rav', flee:'e_rav', call:'e_rav', default:'e_rav'},
            react:(t,k)=>{
              if(k==='flee') { bumpAff(mAff(k)); return `你回：「来吧，我有点撑不住。」<br>搭档很快回了句「稳住，三分钟」，你听见巷口传来熟悉的精神体气息——他/她真的来了，站在你身后，没多话，只把掌心贴上了你的后心。`; }
              bumpAff(mAff(k)); return `你回：「不用，我很快。」<br>搭档发来一个「逞强」的表情：「行，完了立刻回我。」那份被记挂的感觉，让你在回声里稳了半分。`;
            }},
        ]},

      e_rav:{ chapter:'第三章 · 引路', title:'渡鸦认路', sub:'精神链接',
        story:()=>`它不等你。<br><br>渡鸦从门框上跃下来，贴着地面往前扑了两步，回头看你一眼。你跟着它走，才知道这间"屋子"根本不是屋子：桌腿陷在雾里，越往里走家具越少，最后只剩一条长得没道理的走廊——那段回响把一整间出租屋反复折叠，叠成一条走不完的过道。<br><br>每绕一圈，都在同一处回放同一句话：「我撑不住了——」。第一圈你还想数，第二圈你开始怀疑是不是自己在说，第三圈你干脆不数了，只盯着前面那点黑色的羽毛。脚步声在走廊里叠成两份，一份是你的，一份慢了半拍。<br><br>渡鸦停在第三圈的尽头，歪着头，用喙一下一下啄自己的胸口。它指的是一个位置，也是一个请求。你要它带你过去，得先让它相信：你不是又一个闯进来的人，而是来接人的。`,
        body:[{t:'渡鸦是向导的精神体。它认得不属于这条巷子的气味，也认得谁是来抢东西的。'},
          {flav:'它护着的不是那段痛。是那个把痛背了三天的人。'}],
        opts:[{type:'link',dc:12,advantage:()=>G.echo_kit==='guide'||C().linked,
          label:'【链接】向渡鸦伸手，让它带你去她那儿',hint:'精神链接 1d20 + 精神值 vs DC 12（带向导素或已建立链接则有优势）',
          success:'e_relic',fail:'e_drift'}] },

      e_relic:{ chapter:'第三章 · 回响深处 · 遗物', title:'半杯凉茶，一件制服', sub:'代价抉择',
        story:()=>`渡鸦带你去的地方，是这间屋子唯一没被折叠的角落。<br><br>桌上那半杯凉茶还在。杯壁上一圈茶渍干成暗褐色，像谁的手指按过，又松开。椅背上搭着一件没来得及挂起的<b>制式制服</b>，肩章上的编号被人用指甲一点点刮掉了，布料上还留着洗不掉的汗味和一点药膏的凉。<br><br>你忽然明白那名哨兵为什么不肯说名字：这屋里没有一张照片，没有一封信，只有两件还带着体温的遗物。回声里的一切都靠"被碰过"活着——碰一下，它就记住你；记住你，你就有价码。<br><br>渡鸦在你脚边滚出一声很低的咕噜。它不催你，只是把一只爪子搭在桌沿上，像在替你数呼吸。你还有选择：看，或者只是看。而这个决定，只有十秒钟的额度。你把手插回口袋，摸到那枚跟了你很多年的旧硬币——它今晚一点用都没有。`,
        body:[{t:'看得越细，你越知道那段痛该还给谁——也越容易被它认领。'},
          {flav:'回声不强迫你。它只是把东西摆在那里，等你伸手。'}],
        opts:[
          {type:'event',sp:-6,log:'🍵 你端起那半杯凉茶，回声顺着喉咙滑进身体，SP-6',to:'e_drift'},
          {type:'event',hp:-3,log:'🧥 你取下那件制服，肩章的分量压上你的肩膀，HP-3',to:'e_drift'},
          {type:'event',sp:2,log:'🫧 你把手收回来，什么也没碰，SP+2',to:'e_chat2'}] },

      e_drift:{ chapter:'第三章 · 沉', title:'它开始把你当自己人', sub:'精神检定', story:()=>{ G.echo_taint=true; return `你回完消息，抬起头，发现自己已经不记得刚才站在哪一块砖上。<br><br>这段回响本来只循环一个人的崩溃。现在它多了一个样本——你。它开始用你的方式呼吸，用你的语速重复那句「我撑不住了」；它甚至替你整理记忆，把你不愿想起的事一件件摆出来，摆成一个让人愿意坐下来的房间：有热水的味道，有一把朝着窗户的椅子，有一个人在等你回去。<br><br>很舒服。这才是最危险的地方。你甚至数得清那把椅子上的木纹，一条一条，像数自己家里的。<br><br>「我不是来住的。」你在心里说，一边说一边发现，这句话听起来已经不太像自己的声音。你得在它说出"留下"之前，把自己从这句话里摘出来。你开始在心里数：一，二，三——这是入职第一天学的锚定法，数到十，就能分清哪个念头是自己的。`; },
        body:[{t:'不管是碰了遗物，还是被渡鸦挡在门外——从你走进来那一刻起，回声就在学着怎么当你。'},
          {flav:'回声最狠的一招不是让你痛，是让你觉得，这里比外面更懂你。'}],
        opts:[{type:'check',attr:'spi',dc:13,advantage:()=>G.echo_kit==='sense',overload:()=>C().identity==='sentinel'?6:0,
          label:'【精神】把钻进向导素里的回声，一点点挤出去',hint:'精神 1d20 + 精神值 vs DC 13（带感官抑制剂则有优势）',
          success:'e_chat2',fail:'e_taint'}] },

      e_chat2:{ chapter:'—— 中途 · 搭档的消息 ——', chatbeat:true,
        title:'📱 消息', sub:'任务进行中 · 搭档发来第二条',
        story:()=>`你把手机掏出来的时候，手在抖。不是怕，是向导素被搅得太乱，身体先替你作了反应。你盯着发抖的指尖看了两秒，想起出门前搭档替你灌满的那壶水，还在背包侧袋里，一口没动。你忽然很想喝一口，又怕抬手的时候，会看见自己的手抖成什么样。走廊尽头的雾把屏幕的光折回来，照得你脸发白；信号只剩最后一格，你每按一个键，都要等它反应半秒。<br><br>屏幕上一连串消息，最后一条的措辞变了：「你的向导素，浊了。」<br><br>「三分钟前还是清的，现在它认不出你了。退出来——我在巷口。」后面还跟着一条更短的：「不是命令，是求你。」你几乎能看见他/她发这条时的样子：站在巷口那盏坏了半边的路灯下，一只手举着手机，另一只手攥着外套下摆。<br><br>你能听见他/她在那头压着呼吸。你回头看了一眼：来时的路已经被雾收干净了，只剩一条走廊，和一个停在尽头等你决定的影子。你在心里数了一遍自己还能稳住的字数：只够回一句。`,
        body:[{t:()=>`后面又追进来两条，一条比一条短。搭档 <b>${C().partnerName}</b>：「你回我一个字也行。」<br>「灯我留着，你别管我。」`},
          {flav:'有人在外面替你数着时间。这件事，回声学不会。'}],
        opts:[
          {type:'answer',ask:'你打算怎么回这一条（影响好感）：',
            placeholder:'例如：「再给我十分钟。」或「别进来，我自己出来。」',
            branches:{soothe:K_SOOTHE, force:K_FORCE, flee:K_FLEE, call:K_CALL},
            route:{soothe:'e_soothe', force:'e_soothe', flee:'e_soothe', call:'e_soothe', default:'e_soothe'},
            react:(t,k)=>{
              if(k==='force') { bumpAff(mAff(k)); return `你回：「再给我十分钟。」<br>搭档那头沉默了两秒，只回了一个字：「行。」<br>你把手机塞回口袋。回声趁机，又贴上来一寸。`; }
              if(k==='flee') { bumpAff(mAff(k)); return `你回：「别进来，我自己出来。」<br>搭档回：「那你得快。我在门口给你数着。」<br>有人在替你数时间，你在雾里终于有了方向。`; }
              bumpAff(mAff(k)); return `你回：「我记着时间。」<br>搭档回：「好。你只管救人，你的时间我看着。」<br>被人替你看表的感觉，让你在回声里稳住了脚。`;
            }},
        ]},

      e_soothe:{ chapter:'第四章 · 接住她', story:()=>`你顺着那缕意识，轻轻拢住苏曼。<br><br>她蜷在回响的角落，像一只被雨淋透的猫，浑身发抖，嘴里反复念着：「我接不住了……我接不住了……」她的头发是湿的，手心却烫。你把自己的向导素一点点漏过去，像往一杯太满的水里，慢慢掺进清水。她的手很凉，你把掌心覆上去，等那点凉慢慢退成温的。<br><br>渡鸦在你脚边歪了歪头，终于认出你不是来抢主人的。它收了炸开的羽毛，轻轻啄了啄你的鞋尖，像在说：拜托你了。走廊里的循环慢了下来，第三十七秒那一刻的亮光，第一次没有把整间屋子照白。<br><br>苏曼的意识终于抬眼望你。她的眼神很清醒，清醒得让人难受：「你……是来接我的？还是来替他，把这段痛也背走？」她没有哭，只是眼睛很亮，亮得像在等你给她一个理由。`,
        title:'她一直在说「接不住」', sub:'你的处置将决定结局',
        body:[{t:'三个小时十四分钟。你的时限还剩四十六分钟。渡鸦的叫声，已经和你心跳的频率对上了。'}],
        opts:[
          {type:'goto',to:'e_return',ico:'🫧',label:'引渡：把那段痛接过来，再还给该还的人',hint:'疏导路线'},
          {type:'goto',to:'e_stay',ico:'🛡',label:'留守：陪她在回响里坐到天亮，等她自己松手',hint:'陪伴路线'},
          {type:'goto',to:'e_burn',ico:'🔥',label:'焚回响：强行切断循环，保她清醒但留疤',hint:'截断路线 · 高风险'},
          {type:'goto',to:'e_carry',ico:'🕳',label:'承接：把这段痛直接收进自己的图景',hint:'独承路线 · 代价最大'},
          {type:'answer',ask:'你也可以亲口对她说点什么——故事会顺着你的话推进：',
            placeholder:'例如：「我接住你，不是替他。」或「我们一起松手。」',
            branches:{soothe:K_SOOTHE, force:K_FORCE, flee:K_FLEE, call:K_CALL},
            route:{soothe:'e_return', force:'e_burn', flee:'e_stay', call:'e_carry', default:'e_return'},
            react:(t,k)=>{
              if(k==='force') return `「${t||'（你伸手截断）'}……狠了点。回响被你一刀切断，苏曼猛地睁开眼，清醒得近乎空洞。」`;
              if(k==='flee') return `「${t||'（你只是陪着）'}……有些痛，急不来。你们在回响里坐了下来。」`;
              if(k==='call') return `「${t||'（你伸出手）'}……她看了你很久，慢慢把那段回响，放到了你手上。」`;
              return `「${t||'（你轻声开口）'}……你不是替谁扛的。你只是，太善良了。她听懂了。」`;
            }},
        ]},

      e_return:{ chapter:'结局 · 引渡', story:()=>{ G.echo_end='return'; return `你把那段哨兵的崩溃，从苏曼的图景里一寸一寸接过来。<br><br>过程比你想的安静：没有撕扯，也没有挣扎，只有一种很旧的、被反复咀嚼过的苦，顺着向导素一点一点流进你手里。你顺着渡鸦指的方向，把它<b>还给</b>了那个早已消失的来访者——对着空掉的椅子，对着那半杯再没人喝的凉茶。哪怕他听不见，这段痛也终于不再压在一个好心人身上。<br><br>苏曼在你怀里猛地一颤，眼泪砸下来：「……轻了。真的轻了。」她的体温慢慢回到正常，睫毛上还挂着水。她攥着你袖口的手指，一节一节松开，像终于舍得把什么东西交出去。你听见她长长地出了一口气，那口气里还带着凉茶的味道。<br><br>渡鸦扑棱着翅膀，第一次，飞出了那道墙。它绕着巷口转了一圈，叫了一声——那声音不长，也不重复。很多年以后你给学生讲这一段，讲到这句时会停两秒，然后问台下的人：你确定自己有岸吗。`; },
        title:'结局 · 松手', sub:'BEST ENDING',
        body:[{t:'苏曼平安归来。她后来成了疏导组的讲师，第一课教新人：「接住别人之前，先确认自己有岸。」'},
          {flav:'你没替谁扛下一切，你只是，把痛，还给了它该去的地方。'}],
        opts:[{type:'goto',to:'e_debrief',ico:'📋',label:'陪她做完白塔复盘再走',hint:'第四幕 · 苏曼醒来后的第一句话'},
          {type:'goto',to:'the_end',ico:'🌟',label:'查看结算',hint:''}] },

      e_stay:{ chapter:'结局 · 陪伴', story:()=>{ G.echo_end='stay'; return `你没去引渡，也没去截断。<br><br>你只是坐到苏曼身边，背靠着同一面剥落的墙，和她一起，把那段回响从头听了一遍。第一遍她还在抖，第二遍她开始出神，第三遍她忽然说了一句：「他那天穿的鞋，是新的。」你嗯了一声，没接话。有些话不需要被回答，只需要有人听见。你把背往墙上靠了靠，砖缝里的潮气透过外套渗进来——凉，但比回声里的热要诚实。<br><br>巷子外面的天，一层一层亮起来。楼下有人推着小车经过，轮子碾过青石板，声音很钝。苏曼听着那声音，手指慢慢松开了。她小声说：「我听见他下楼了。」<br><br>「原来……不是我接不住，是我不敢松。」她说完这句，把头靠到了墙上。渡鸦偎进她怀里，叫声软了下来。你把自己的外套脱下来，盖在她腿上，衣角还带着巷子外面的凉。后来你值夜班，总习惯在走廊尽头留一盏灯。有人问为什么，你说：万一有人需要顺着光走出来。`; },
        title:'结局 · 同坐', sub:'GOOD ENDING',
        body:[{t:'苏曼清醒但疲惫。她说，那天陪她坐到天亮的人，她会记一辈子。'},
          {flav:'最好的疏导，有时候只是：我在，你慢慢来。'}],
        opts:[{type:'goto',to:'e_debrief',ico:'📋',label:'陪她做完白塔复盘再走',hint:'第四幕 · 苏曼醒来后的第一句话'},
          {type:'goto',to:'the_end',ico:'🌟',label:'查看结算',hint:''}] },

      e_burn:{ chapter:'结局 · 截断', story:()=>{ G.echo_end='burn'; return `你悍然斩断回响的循环。<br><br>像有人在一句话说到一半时，把录音带抽走了。嘶吼停了，走廊停了，那半杯凉茶上的水汽也不再升起。苏曼瞬间清醒——清醒得太快，快到你看见她眼里有什么东西一起被剪掉了。剪断的那一瞬，你听见一声很轻的响，不是耳朵听见的，是精神图景里某处连接断开的声音，干净，利落，不留毛边。屋里所有没说完的话都停在半句上，浮着，落不下来。<br><br>她试着回想那名哨兵的脸，想不起来；试着回想自己为什么进这条巷子，只剩下一个模糊的"应该"。她低头看着自己的手，声音很轻：「我的渡鸦……好像不会叫了。」<br><br>渡鸦落在她肩上，张了张嘴，什么声音都没有。巷子安静得像一间关了灯的教室。你伸出手，想碰一下那只鸟。它在你指尖离它还有三厘米的时候，把头别开了，眼睛始终看着苏曼。很久以后你翻到那次外勤的记录，只有三行字：回响已切断，向导清醒，能力折损。你把纸翻了过去，没有再往下看。`; },
        title:'结局 · 留疤', sub:'NEUTRAL ENDING',
        body:[{t:'苏曼活下来了，能力却折损。白塔说这是「必要的代价」，你却知道，有些代价，是活下来的人才懂。'},
          {flav:'你救了她，也拿走了一部分她。'}],
        opts:[{type:'goto',to:'e_debrief',ico:'📋',label:'陪她做完白塔复盘再走',hint:'第四幕 · 苏曼醒来后的第一句话'},
          {type:'goto',to:'the_end',ico:'🌟',label:'查看结算',hint:''}] },

      e_carry:{ chapter:'结局 · 独承', story:()=>{ G.echo_end='carry'; return `你没有把那段痛还给谁。<br><br>你把它<b>收进自己的图景</b>——像把一件别人的行李，扛上自己的肩。那一刻你在心里对自己说：反正我年轻，反正我还扛得动。苏曼在你面前一点一点松开，眉头展开的那种松，是你很久没见过的。你想笑一下，嘴角却先尝到了那股苦——它已经开始在你自己的图景里挑地方住了。<br><br>按规矩，这段记忆该还给来访者，或者交白塔封存。可你谁也没告诉。你只是把外套的拉链拉到最上面，替她把那半杯凉茶倒进了楼下的下水道。茶水是凉的，泼下去几乎没有声音，只在水泥地上留了一小块深色，很快也干了。<br><br>她确实松开了。她重新站上讲台，教新人怎么接住别人，笑起来的时候眼角有细纹。只有你知道，她当年接到的那份痛，现在在谁的图景里过夜。你现在偶尔还会在子夜醒一次，醒来第一件事是把手按在胸口，确认那件行李还压得住。`; },
        title:'结局 · 你替他坐了那一夜', sub:'BITTER ENDING',
        body:[{t:'白塔认定这是一次「成功的疏导」。术语没错，只是漏了一句：有些成功，是有人替它付了钱。'},
          {flav:'她把痛忘了。你把痛，学会了。'}],
        opts:[{type:'goto',to:'e_debrief',ico:'📋',label:'陪她做完白塔复盘再走',hint:'第四幕 · 苏曼醒来后的第一句话'},
          {type:'goto',to:'the_end',ico:'🌟',label:'查看结算',hint:''}] },

      e_taint:{ chapter:'结局 · 回声留人', story:()=>{ G.echo_end='taint'; return `你在那句话里，没能把自己摘干净。<br><br>苏曼醒了。她坐起来，第一眼看见你的时候愣了一下，像在辨认一件摆错了位置的东西——「你身上……有巷子的味道。」<br><br>你说不出话。因为你确实听见了：在很远的地方，有一只渡鸦在叫，而那声音，现在是冲着你来的。你试着像往常那样把手伸进口袋摸手机，指尖却先碰到了那半杯凉茶留在你掌心的温度——杯子早就不在了，那点温度却还在，像一枚没拔出来的钉子。你用力甩了甩手，什么也没甩掉。<br><br>回响没有留住苏曼，它只是换了一个人。你请了三个月假——槐安巷的那层雾，跟着你回了家。子夜你会自己走到窗边，站上很久，然后想起：窗台上并没有第二个人，只有一只不知道从哪来的黑鸟，落在栏杆上，一声不叫。`; },
        title:'结局 · 半条巷子', sub:'HIDDEN ENDING',
        body:[{t:'白塔的复盘记录上写着：疏导员与回响发生部分同化，精神体标记轻微偏移。建议持续观察。'},
          {flav:'你去接她，最后是回声，把你接了回去。'}],
        opts:[{type:'goto',to:'e_debrief',ico:'📋',label:'陪她做完白塔复盘再走',hint:'第四幕 · 苏曼醒来后的第一句话'},
          {type:'goto',to:'the_end',ico:'🌟',label:'查看结算',hint:''}] },

      e_debrief:{ chapter:'第五章 · 白塔复盘', title:'复盘 · 她醒来的第一句话', sub:'任务收尾',
        story:()=>`复盘安排在第二天早上。会议室很亮，亮得让人想把眼睛闭上。苏曼是被担架抬出槐安巷的。她在医疗层睡了十四个小时，醒来后说的第一句话，被值班员原样记在了记录本上。记录本摊在桌子中央，谁都能看，谁都没先开口。<br><br>考评官问你：为什么不在第一时间切断回响？切断只要三秒，代价可控，流程里写得清清楚楚。他说这话的时候没有责备，只是在念一条早就写好的答案。<br><br>你想起那半杯凉茶，想起渡鸦啄着自己胸口指路的样子，想起她在回响里反复念的那句「我接不住了」。最后你说：「回响不会因为被切断就消失，它只会去找下一个愿意扛的人。我那天想做的，是让它没有下一个。」<br><br>会议室安静了几秒。考评官在记录上写了两个字：<b>结案</b>。`,
        body:[{t:()=>`记录本上那一行是：${({return:'「……轻了。真的轻了。」',stay:'「原来不是我接不住，是我不敢松。」',burn:'「我记不起他的脸了。白塔说这叫代价，我信。」',carry:'「……怎么是你？」',taint:'「你身上……有巷子的味道。」'})[G.echo_end]||'「谢谢你。」'}`},
          {t:()=>`出门的时候，${C().partnerName} 在走廊尽头等着，手里拎着两杯热的。${G.echo_taint?'他/她看了你一眼，把其中一杯往你手里塞：「喝完漱漱口。你身上有股旧木头味儿。」':'他/她什么也没问，只是把杯子往你手里一塞：「热的。」'}`},
          {flav:'有些外勤，报告上只有一页。真正被带出巷子的东西，从来不写在报告里。'}],
        opts:[{type:'goto',to:'the_end',ico:'🌟',label:'查看结算',hint:''}] },
    }
  },
  {
    meta:{key:'snow', name:'雪线之上', code:'任务·A级', grade:'A', world:'搜救 / 生存', duration:'约 60 分钟', difficulty:'硬核',
      hook:'一支哨兵小队在雪线之上失联。暴风、缺氧、静音场断绝——他们的感官正在被雪山一寸寸吞没。你和搭档逆流而上，去把活人，带下来。雪线上没有第二次机会：氧、绳、体温，每一样都在倒计时。'},
    start:'w_brief', first:'w_base',
    scenes:{
      w_brief:{ chapter:'白塔 · 任务简报', story:()=>`【系统任务简报 · 雪线之上】编号 W-09，等级 A级。简报室的暖气开得很足，窗外却在下雪；屏幕上那条海拔曲线爬到五千二百米就断了，像一句没说完的话。<br><br>「苍岭小队」三名哨兵在那里失联四十八小时。卫星过顶时，只捕捉到一段断续的精神体信号——一头<b>雪狼</b>在风雪里原地打转，像是领路的人，先迷了。<br><br>雪线之上没有静音场，没有屏蔽，哨兵的感官会在一片死白里被放得无穷大。白塔的判断很冷：再迟两天，能带下来的，只剩遗体。你和搭档要在氧气耗尽之前，逆流而上。<br><br>联络官把最后一张资料推过来：「领队<b>陆昀</b>，队员<b>邵青</b>、<b>何棠</b>，都不到二十五。听着——上面没有第二次机会，风、氧、体温，每一样都在倒计时。撑不住就告诉我，别硬扛，这是命令。」你伸手去接那张资料，纸边割了一下指腹——很小的一道口子，你却记得很清楚，因为那大概是这次任务里最轻的一次代价。`,
        title:'任务简报 · 雪线之上', sub:'白塔派遣 · 任务·A级 · 搜救 / 生存',
        body:[{flav:'雪线会放大一切感官，也会放大一切犹豫。'}],
        opts:()=>[{type:'goto',to:G.created?'m_team':'intro',ico:'✅',label:'确认接取，进入任务',hint:G.created?'已入册 · 直接选择组队方式':'随后白塔将为你指派搭档'}] },
      w_base:{ chapter:'第一章 · 登山口', story:()=>`登山口的风像刀。补给员把最后一只氧气瓶塞进你背包，拍了拍你肩膀：「上面没有信号，没有静音场，只有风。你们的感官会疯，这是正常的。」<br><br>你和搭档对视一眼，把链接先扣紧了三分。脚下的雪咯吱作响，每一步都陷进及膝的白里；风从领口钻进去，贴着脊背一路往下走，走到腰上，再走到脚踝。<br><br>越往上，世界越安静，也越吵——安静的是雪，吵的是你自己的心跳，被放大成鼓，一下一下敲在耳膜上。你甚至能听见血液流过颈侧的声音，像有人在很近的地方拉一根线。<br><br>补给员把一张手绘的等高线图按在雪地上，指节敲了两个位置：「<b>山脊</b>快，四个钟头能摸到雪线，可整条脊背全露在风里；<b>冰谷</b>慢，绕两个弯，避风。定哪条？」你和搭档谁都没先答话，只有风在两个人之间来回穿。`,
        title:'扣紧链接', sub:'精神检定',
        body:[{flav:'雪线会放大一切感官。先把链接扣稳，才不会被自己吓疯。'},
              {t:'补给员塞给你两枚讯标：「省着用，插下去就是告诉白塔：有人在这儿。」'}],
        opts:[{type:'check',attr:'spi',dc:13,advantage:()=>!!C().linked,overload:0,
          label:'【精神】在喧嚣里，把链接扣得更紧',hint:'精神 1d20 + 精神值 vs DC 13（已链接则有优势）',success:'w_climb',fail:'w_base_f'},
          {type:'goto',to:'w_gear',ico:'🎒',label:'先花十分钟清点装备，把路线一次定死',hint:'整备路线 · 慢一步，后面稳很多'}] },
      w_base_f:{ chapter:'第一章 · 登山口', title:'链接晃了一下', sub:'',
        story:()=>`风灌进耳膜，链接猛地晃了一下，你眼前发黑，耳里全是自己血液奔涌的轰鸣。脚下的雪在晃——其实是你自己在晃，只是身体的晃动要比脑子晚半秒才被察觉。<br><br>搭档一把扣住你手腕，向导素顺着脉搏渡过来，一点一点把你从那片嗡嗡声里捞了回去。你听见他/她贴着你的护目镜说：「跟着我的呼吸，慢一点，别管风。」<br><br>你照做了。第四次呼吸的时候，链接重新咬紧，像一根绷到极限又慢慢收回去的绳。你这才发现自己的手套里全是冷汗，指尖发黏。<br><br>雪线在第一次接触就给了你一个提醒：它会放大你的一切，包括你藏得最深的害怕。补给员在后面喊了句什么，风把它撕碎了——没有人再问你走哪条路，你们已经站在风里，路自己会挑人。你在心里给自己划了一条线：再晃一次，就往下撤——这条线后来救过你。`,
        body:[{flav:'被雪线吓过一次的人，才知道敬畏不是软弱。'}],
        opts:[{type:'event',sp:-4,log:'🌬 链接晃荡，SP-4',to:'w_climb'}] },
      w_gear:{ chapter:'第二章 · 清点装备', story:()=>`雪线以下最后一块平地。你把背包摊在雪上一样一样点过去：两只氧瓶、三支向导素、两枚讯标、一把雪铲。补给员给的东西不多，每一样都得算着用，连保温毯上那道旧口子你都重新缝过。<br><br>搭档 <b>${C().partnerName}</b> 蹲在你旁边，把两只氧瓶并排拴在同一根主绳上：「绑一起。掉一个，还剩一个。」风把绳头吹成一条笔直的线，像谁在雪地上拉满了一张弓。你伸手压了压那个结，确认它在冻硬之后还能解开。<br><br>再往上，路分两条。<b>山脊</b>直而快，四个钟头就能踩上雪线，代价是整条脊背都交给风；<b>冰谷</b>绕两个弯，谷壁挡风，走得慢，可谷底压着一层平整的新雪，下面是实是空，谁也说不准。<br><br>你蹲在雪地里，手指按在图中那两个位置上，按了很久。搭档没催你，只把护目镜的带子又紧了一格，然后把自己的手套递过来让你换——你的那只，指尖已经磨薄了。`,
        title:'两只氧瓶，两条路', sub:'路线抉择',
        body:[{flav:'装备是死的，路线是活的。选错一样，另一样救不了你。'}],
        opts:[{type:'goto',to:'w_ridge',ico:'🪨',label:'走山脊：快，但全程暴露在风里',hint:'快路线 · 白盲更重',onPick:()=>{C().route='ridge';addMLog('🧭 你选了<b>山脊线</b>：快，但没有任何遮挡。');}},
          {type:'goto',to:'w_climb',ico:'🧊',label:'走冰谷：慢两个钟头，避风',hint:'稳路线 · 后面更省体温',onPick:()=>{C().route='valley';addMLog('🧭 你选了<b>冰谷</b>：避风，但多走两个钟头。');}},
          {type:'answer',ask:'或者，你亲口把路线定下来——队伍会照做：',
            placeholder:'例如：「走冰谷，稳一点。我们要有命把人抬下来。」',
            branches:{soothe:K_SOOTHE, force:K_FORCE, flee:K_FLEE, call:K_CALL},
            route:{soothe:'w_climb', flee:'w_climb', default:'w_ridge', force:'w_ridge', call:'w_ridge'},
            react:(t,k)=>{
              const v=(k==='soothe'||k==='flee')?'valley':'ridge';
              C().route=v;
              if(v==='valley'){ bumpAff(mAff(k)); return `「${t||'（你把手指按在冰谷那条线上）'}」<br>搭档看了你两秒，点头：「慢两个钟头，总比少一个人好。」你们把绳距缩到三米，进了谷口。`; }
              bumpAff(mAff(k)); return `「${t||'（你的手指划向山脊）'}」<br>搭档没争，只把护目镜往下压了压：「那就跑起来。风里别停，停一次就是一次失温。」`;
            }}] },
      w_ridge:{ chapter:'第二章 · 山脊线', story:()=>`山脊像一把横放的刀背。你们贴着刀刃走，左边是深不见底的雪坡，右边是断崖，脚下只有一条前人踩出来的窄印，宽不过一只靴子。<br><br>风没有被任何东西挡过，从正面把你们一寸寸往后推。雪粒砸在护目镜上噼啪作响，你数着步子走，数到第三百步，膝盖开始不听使唤——不是累，是冷，冷得关节像被人灌了沙子。<br><br>${C().identity==='sentinel'?'哨兵的体质本不该怕冷，可你听见自己的心跳在耳朵里发钝，呼吸也浅了半格。那是身体在替你报警：温度正沿着衣缝，一根一根往外走。':'你把手套往下扯了扯，替搭档挡掉半面风。向导的屏障挡得住精神，挡不住雪；你能做的只有把两个人的步子压成同一个节拍。'}<br><br>搭档在前面回头看你一眼，只说了一句：「别停。停一次，就是一次失温。」你咬着牙把重心压低，让雪铲先落，再落膝，最后落靴。走到第七百步，你开始用数数代替思考：一、二、三……数到一百就换一口气；这是老哨兵教的法子，把害怕切成一小段一小段，让它在每一段里都不够长。`,
        title:'刀背上的三百步', sub:'体质检定',
        body:[{flav:'山脊不奖励速度，它只收过路费。'}],
        opts:[{type:'check',attr:'con',dc:14,advantage:()=>!!C().linked,overload:()=>C().identity==='sentinel'?4:0,
          label:'【体质】顶着风，把这三百步走完',hint:'体质 1d20 + 体质值 vs DC 14（已链接则有优势）',success:'w_climb',fail:'w_ridge_f'}] },
      w_ridge_f:{ chapter:'第二章 · 山脊线', title:'被风按进雪里', sub:'',
        story:()=>`一阵横风抽过来，你整个人被按倒在雪面上，护目镜里瞬间灌满白。雪灌进袖口、领口，沿着脊背往下淌，你听见自己牙齿在打颤，那声音比风还响。<br><br>搭档把你从雪里刨出来，先拍你的背，再拍你的脸：「看着我，说话。」你吐掉嘴里的冰碴，说了句「没事」，声音抖得连自己都不信。<br><br>你撑着雪铲重新站直。膝盖在抖，腿还在。山脊不会等你，它只会在你停下的时候，把体温一点一点收走，收得很有耐心，像收租。<br><br>你们贴着岩壁挪过那段风眼，重新切回雪坡。雪狼的影子就在下面那片白里，一闪，又不见了。你忽然意识到：你已经被这条脊背收过一笔账了，只是还没到期。你摸出保温毯想裹上，手指却抖得解不开那个结；搭档接过去，替你把毯子掖进领口，一边掖一边说：「到前面那个雪坎再歇。现在坐下，就起不来了。」`,
        body:[{flav:'在刀背上摔倒不丢人，赖在地上才丢人。'}],
        opts:[{type:'event',hp:-5,sp:-2,log:'🥶 山脊失温，HP-5 · SP-2',to:'w_climb'}] },
      w_climb:{ chapter:'第三章 · 白毛风', story:()=>`海拔过半，<b>白毛风</b>来了。雪片不是落，是横着抽在脸上，每片都带着冰碴，刮得皮肤生疼。能见度骤降到三步，你连自己的鼻尖都看不清。<br><br>${C().route==='valley'?'冰谷绕出来的那两个钟头，让你们保住了大半的体温。可一走出谷口，风就把这笔账连本带利地收了回去，吹得你护目镜里一层白气。':'你们从山脊直插上来，风把整条脊背都吹透了。快是快的，代价是你的指尖已经开始发木，捏绳子的手感只剩下一半。'}<br><br>就在这时，雪地尽头浮起一点微光——是雪狼的虚影，在风里原地转圈，项圈上拴着一截断掉的绳。它每转一圈，就离悬崖更近一寸。<br><br>你盯着那圈白影看了三秒，忽然明白了它在做什么：它在找路，也在等人。那三名哨兵，多半就在它身后不远处。你朝搭档打了个手势，两个人压低身体，往那点光里走。雪线之上没有路标，所有的方向都得自己认；你把最后一支向导素攥在手里没舍得用——那是留给活人的。`,
        title:'雪狼在转圈', sub:'感知检定',
        body:[{flav:'白毛风里，得靠感官揪出那头迷路的雪狼，别让自己也转进去。'}],
        opts:[{type:'check',attr:'per',dc:13,advantage:()=>C().identity==='sentinel',overload:()=>C().identity==='sentinel'?7:0,
          label:'【感知·优势】在白毛风里锁定雪狼与失联小队',hint:'感知 1d20(优势) + 感知值 vs DC 13',success:'w_camp',fail:'w_climb_f'}] },
      w_climb_f:{ title:'被风带偏', sub:'',
        story:()=>`一阵侧风把你掀了个趔趄，你跟着雪狼的影子多转了半圈，脚下一空，雪面塌下去一小块。那一瞬间你听见的不是风，是自己心里「完了」两个字。<br><br>腰上的绳子猛地一紧，搭档把你拽了回来。你赶紧把背贴进岩壁，闭上眼，用脚底去读雪的坡度——左脚硬，右脚软，前面那一步是空的。<br><br>你把呼吸压回节奏里，一步一步挪过那段说谎的雪。回头看，风已经把你们刚才的脚印填得干干净净，像什么都没发生过。<br><br>雪狼还在前面，没丢。你朝它那点白光走过去，心里最后一点侥幸被风吹得干干净净：这条路上，一次错步就够了。你这才发现右靴里灌满了雪，脚趾像几根不属于你的木棍；你把它们活动开，疼得倒抽一口气——疼是好事，说明还活着。你把雪从靴口倒出来，重新绑紧鞋带，打了一个只有你自己解得开的死结。`,
        body:[{flav:'雪不会提醒你哪一步是空的，它只负责埋。'}],
        opts:[{type:'event',hp:-4,overload:()=>C().identity==='sentinel'?5:0,log:'🥶 失温边缘，HP-4',to:'w_camp'}] },
      w_camp:{ chapter:'—— 中途 · 搭档的消息 ——', chatbeat:true,
        title:'📱 消息', sub:'任务进行中 · 搭档发来一条',
        story:()=>`对讲机在海拔四千五开始失灵，到了这里，只剩沙沙的电流声。搭档就在你身后三步远，可你们已经喊不上话了。<br><br>手机却奇迹般收到一条。屏幕上那行字亮得刺眼——搭档 <b>${C().partnerName}</b>：「氧气还够吗？我这边读数不太好看。要是撑不住，先顾自己。」<br><br>你抬头看了一眼天。云正在往下沉，压得极低，像一块正在合上的盖子；风的声音也在变小，小得反常。老兵管这个叫<b>白盲</b>的前兆。<br><br>你把手套咬在嘴里，腾出手指，在屏幕上敲字。有些话说出口并不难，难的是承认自己也许只有这一次机会。你忽然想起补给员出发前说的那句「上面没有信号」——可现在这条消息就躺在你掌心里，热得发烫。你不知道它是怎么穿过这场风雪进来的，也不打算问：有些运气，问多了就没了。`,
        body:[{t:'信号只有一格。发出去的字，一半靠技术，一半靠运气。'}],
        opts:[
          {type:'answer',ask:'回他/她一句（影响好感）：',
            placeholder:'例如：「一起回去，少一个都不行。」或「你先撤，我殿后。」',
            branches:{soothe:K_SOOTHE, force:K_FORCE, flee:K_FLEE, call:K_CALL},
            route:{soothe:'w_whiteout', force:'w_whiteout', flee:'w_whiteout', call:'w_whiteout', default:'w_whiteout'},
            react:(t,k)=>{
              if(k==='flee') { bumpAff(mAff(k)); return `你回：「你先撤，我殿后。」<br>搭档沉默两秒，回了句「想都别想」，一把把你的氧气管和自己并排系紧：「要死一起，要活一起。」`; }
              bumpAff(mAff(k)); return `你回：「一起回去，少一个都不行。」<br>搭档发了个有点笨的笑脸：「就知道你会这么说。跟上我。」`;
            }},
        ]},
      w_whiteout:{ chapter:'第四章 · 白盲', story:()=>`风停了。<br><br>这是雪线上最坏的消息：风一停，雾就下来。那不是雾，是<b>白盲</b>——雪从上面、下面、左边、右边同时白过来，天和地连成一张没有缝的纸。你伸手，看不见自己的手指；你把手指贴到护目镜上，才确认自己还在。<br><br>${C().identity==='sentinel'?'你是哨兵。感官是你的刀，可这把刀此刻正被拉到极限：风的声音、雪的重量、心跳两次之间的空隙，全在脑子里同时炸开，像有人拿着锣在你颅骨里敲。':'你是向导。你听见搭档的呼吸在三十厘米外一点点变浅，而你能做的只是把精神力铺成一条窄窄的线，拴住两个人，别让它断。'}<br><br>雪狼的虚影也在这层白里，只剩一团比雪更白的光。你得在它彻底看不见之前走过去——方向、高度、距离，全都要靠命去估。你试着往前迈了一步，靴子落地，却没有回声；你想起老兵说过的话：白盲里最忌讳一件事，就是相信自己的眼睛，眼睛这时候只会替你编故事。你把手按在胸口，用心跳数距离：一步，两口气。`,
        title:'死白', sub:'体质检定',
        body:[{flav:'白盲不吃眼睛，它吃方向感——那是人身上最容易被拿走的东西。'}],
        opts:[{type:'check',attr:'con',dc:14,advantage:()=>!!C().linked,
          mod:()=>C().route==='valley'?1:(C().route==='ridge'?-1:0),
          overload:()=>C().identity==='sentinel'?5:0,
          label:'【体质】在白盲里站住，把方向钉死在脚底',
          hint:()=>`体质 1d20 + 体质值 vs DC 14${C().route==='ridge'?'（山脊暴露 -1）':(C().route==='valley'?'（冰谷避风 +1）':'（未定路线）')}`,
          success:'w_msg2', fail:'w_whiteout_f'}] },
      w_whiteout_f:{ chapter:'第四章 · 白盲', title:'被死白吞掉的两分钟', sub:'',
        story:()=>`你丢了方向。不是走错，是「方向」这件事被从你身体里拿走了：你不知道哪边是上，哪边是来路，连自己站得正不正都判断不了。<br><br>你喊搭档的名字，声音一出口就被雪吃掉。耳里嗡的一声，世界像被人把音量旋到最大，又一格一格拧碎；你听见很多声音，没有一个是人能听懂的。<br><br>等你重新踩到硬雪，膝盖已经砸在冰面上，血从裤腿里一点点渗出来，在雪里洇开一小片暗色。搭档的手抓着你后领，指甲几乎掐进你的皮肉，指节冻得发白。<br><br>你丢了两分钟。而雪线一分钟都不赔你——你摸了摸怀里的讯标，还在；摸了摸氧瓶，轻了。你把这两件事记下来，像记账一样。搭档把水壶凑到你嘴边喂了两口，温水滑下去的时候你才知道自己渴得厉害；他/她一句重话都没说，只把你的胳膊架到自己肩上。`,
        body:[{flav:'过载不是疼，是全世界同时把音量拧到最大。'}],
        opts:[{type:'event',sp:-6,overload:()=>C().identity==='sentinel'?8:0,log:'🌫 白盲过载，SP-6',to:'w_msg2'}] },
      w_msg2:{ chapter:'—— 中途 · 搭档的消息 ——', chatbeat:true,
        title:'📱 消息', sub:'任务进行中 · 最后一条',
        story:()=>`暴风重新压下来的时候，对讲彻底哑了。你们只能靠绳子说话：拉一下是停，拉两下是走，拉三下是有人撑不住了。这套暗号是登山口临时约定的，谁都没想到这么快就用上。<br><br>手机却在口袋里震了一下——最后一格信号，闪着，像一根快烧完的火柴。搭档 <b>${C().partnerName}</b>：「我看见那头狼了。它一直在转圈，转得越来越慢。」<br><br>你盯着那行字，忽然听懂了这句话底下压着的东西：它不是找不到路，它是等有人替它决定。<br><br>字还没看完，信号格就灭了。屏幕暗下去的那一秒，你看见自己的脸——眉毛上结着一层白霜。你只有一次机会，把想说的话说出去。你忽然发现自己真正想说的其实很简单，简单到有点丢人——你想告诉这个人，你很高兴这一趟是他/她跟你一起上来的。`,
        body:[{t:'雪线之上，通讯断掉的那一刻，话才真正开始值钱。'}],
        opts:[
          {type:'answer',ask:'回他/她一句（影响好感）：',
            placeholder:'例如：「它在等人替它决定。我们一起过去。」',
            branches:{soothe:K_SOOTHE, force:K_FORCE, flee:K_FLEE, call:K_CALL},
            route:{soothe:'w_wolf', force:'w_wolf', flee:'w_wolf', call:'w_wolf', default:'w_wolf'},
            react:(t,k)=>{
              if(k==='flee'){ bumpAff(mAff(k)); return `你回：「别过来，你留在原地等我。」<br>信号断在这句之后。雪线上，谁也说不准哪句话是最后一句。`; }
              if(k==='force'){ bumpAff(mAff(k)); return `你回：「都到这儿了，退什么退。」<br>那格信号闪了两下才灭，像一声没吵完的嘴。`; }
              bumpAff(mAff(k)); return `你回：「它在等人替它决定。我们一起过去。」<br>消息发出的一刻信号就断了，你甚至不确定他/她收到没有。`;
            }}]},
      w_wolf:{ chapter:'第五章 · 雪狼认人', story:()=>`那头雪狼终于停下来，不再转圈。<br><br>它站在死白的边缘，瘦得能看见肋骨，项圈上那截断绳冻成了一截冰，风一吹，冰碴簌簌往下掉。它不看你，也不看你的搭档——它在闻。闻你身上有没有它主人的味道，闻你的掌心里有没有向导素，闻你是不是那种到了地方还会把人抬下去的人。<br><br>精神体不会说话，它只会认。它认的是你在精神里给出的那点东西：稳不稳，诚不诚，会不会在最后一刻松手。认对了，它就是你们的路；认错了，它会重新转起圈来，把这片雪线连你们一起慢慢收干净。<br><br>你慢慢蹲下去，把手套脱掉一只，把掌心摊开在风里。冷从指尖一路咬上来，你忍着没动，只把呼吸压得又长又稳。雪在它脚下被风扫成一道一道的纹，像谁在纸上反复描同一个字。`,
        title:'它终于停下来看你', sub:'精神链接',
        body:[{flav:'哨兵的兽，只认能把它主人带回家的人。'}],
        opts:[{type:'link',dc:14,label:'【链接】把手伸过去，让雪狼认你',hint:'精神链接 vs DC 14 · 成功后由雪狼带路',success:'w_relic',fail:'w_relic'}] },
      w_relic:{ chapter:'第六章 · 半埋的帐篷', story:()=>`雪狼把你们带到雪坡背面，那里鼓起一个不太自然的白包。你的雪铲第一下就碰到了硬东西——不是冰，是帐杆。<br><br>挖开是一顶<b>半埋的帐篷</b>，单人帐，塌了半边。不是主营地，是走在最前面的那个人留下的侦察位。里面空着，睡袋冻成一团硬冰，底下压着一枚刻着编号的<b>队徽</b>：03。<br><br>这不是遗物。是有人把队徽留在这里，一个人往深处走了。留下队徽是雪线上的规矩：<b>我要是没回来，至少让后面的人知道，我往哪个方向去了。</b>你把它捏在手里，冰凉，边缘硌着掌心。你举到眼前对着光看，编号刻得很浅，是拿刀一下一下凿出来的——凿这个的人，手一定冻僵过。<br><br>讯标只剩两枚。插下去，救援能顺着坐标找上来；插下去，也等于替白塔在报告里写下：此处只剩遗址。搭档在你身后等着，没出声——这种决定，从来只能一个人做。`,
        title:'编号 03 的队徽', sub:'你的取舍将决定结局',
        body:[{flav:'继续搜，是把命往雪里押；插标求援，是把命往后挪。'},
              {t:'帐篷里的睡袋上绣着一样的编号：03。'}],
        opts:[{type:'event',sp:-2,flag:'markPlaced',log:'🚩 你在营地插下讯标，坐标发了出去 · SP-2',to:'w_camp2'},
          {type:'goto',to:'w_camp2',ico:'🔎',label:'不插标：两枚讯标都留着，人比坐标重要',hint:'全力搜救 · 身后不留路'},
          {type:'answer',ask:'或者，你亲口下令——队伍会照做：',
            placeholder:'例如：「插标，但人必须继续往里走。」',
            branches:{soothe:K_SOOTHE, force:K_FORCE, flee:K_FLEE, call:K_CALL},
            route:{soothe:'w_camp2', call:'w_camp2', flee:'w_camp2', default:'w_camp2', force:'w_camp2'},
            react:(t,k)=>{
              if(k==='force'){ bumpAff(mAff(k)); return `「${t||'（你把两枚讯标重新按回怀里）'}」<br>你说：「坐标救不了人，只能替我们收尸。往里走。」搭档跟上来，脚步比刚才更重。`; }
              C().markPlaced=true; bumpAff(mAff(k)); return `「${t||'（你抽出讯标，插进雪里）'}」<br>红灯亮起，极慢地呼吸。你把队徽贴着心口收好：「标留在这儿，人不能留在这儿。」`;
            }}] },
      w_camp2:{ chapter:'第七章 · 帐篷残骸', story:()=>`雪狼把你引到一处塌了半边的帐篷。那是苍岭小队的主帐，帐杆断了两根，靠着半面雪墙才没整个塌下去，门帘被风吹得像一块撕开的旗，绳子在断杆上反复摩擦，发出很轻的、像有人磨牙的声音。<br><br>里面缩着三个人：领队的哨兵已经陷入<b>感官过载</b>，抱着头嘶嘶抽气，另两个半昏迷，嘴唇乌紫。帐篷里有一股化不开的味道——汗、血、和冻硬的食物混在一起。<br><br>领队的精神体——那头雪狼——正一点点透明，像是主人快撑不住，它也要散了。氧气瓶滚在雪里，早冻裂了，阀门上结着一圈白霜。你只有一瓶，和搭档共用的那一瓶。<br><br>邵青抓住你的袖口，声音碎得像风里的纸：「他三天没合眼了，氧都给了我们。你别先顾他——他会骂人的。」${C().markPlaced?'<br><br>营地那枚讯标还亮着：救援最快也要六个钟头。六小时，是四个人和一瓶氧的距离。':'<br><br>你身上两枚讯标一枚没动。没有人知道这顶帐篷，没有人知道它下面还压着三个活人。'}`,
        title:'三个人，两瓶氧', sub:'你的取舍将决定结局',
        body:[{flav:'资源不够所有人。雪线之上，抉择比风更冷。'},
              {t:'邵青看见你内袋里的队徽，愣了半秒。'}],
        opts:[
          {type:'goto',to:'w_all',ico:'🫁',label:'均分：把氧拆成四份，赌救援赶得及',hint:'全员路线 · 高风险'},
          {type:'goto',to:'w_one',ico:'⚖',label:'优先领队：护住雪狼不散，其余拖行',hint:'重点路线'},
          {type:'goto',to:'w_sac',ico:'🕯',label:'断尾：带两名清醒者先下，留讯标',hint:'止损路线'},
          {type:'goto',to:'w_descent',ico:'🧊',label:'断氧：把自己那份拧到最小，替领队扛最后一段',hint:'高风险 · 你会留下点什么',onPick:()=>{addMLog('🧊 你把整瓶氧塞进领队怀里，自己的阀门只留一条缝。');}},
          {type:'answer',ask:'你也可以亲口决定——故事会顺着你的话推进：',
            placeholder:'例如：「氧给领队，我们拖。」或「四个人一起赌。」',
            branches:{soothe:K_SOOTHE, force:K_FORCE, flee:K_FLEE, call:K_CALL},
            route:{soothe:'w_one', force:'w_sac', flee:'w_sac', call:'w_all', default:'w_all'},
            react:(t,k)=>{
              if(k==='force') return `「${t||'（你做了取舍）'}」……冷，但清醒。你把讯标插进雪里，转身带了两人先走。`;
              if(k==='flee') return `「${t||'（你留了讯标）'}」……留得青山在。你埋好标记，带两名清醒者先撤。`;
              return `「${t||'（你拆开氧阀）'}」……四个人，一起赌。你把氧分成四份，谁都没放弃。`;
            }},
        ]},
      w_descent:{ chapter:'第八章 · 下撤', story:()=>`你把整瓶氧拧到最大塞进领队怀里，自己的阀门只留一条缝。吸进去的每一口都薄得像纸，胸口闷得发胀，你却不敢深呼吸——那点气得留着走路。<br><br>下山的路比上山更像活物。每走二十步就得停下来，把队友的脸从雪里扒出来看看还活不活。风从背后推你们，雪灌进领口，鞋里积了一层冰碴，踩下去咯吱作响。<br><br>体温从指尖、脚趾一点点往外走，走到最后你连「疼」都感觉不到了。你想起补给员在登山口说过的话：<b>不疼，就是冻透了。</b>你试着蜷了一下手指，它们没有回答你。<br><br>搭档在绳子另一头拽着你，声音哑得几乎认不出来：「还有四百米。你别睡，听到没有——别睡。」你张了张嘴，那声「好」被风吃了。天色在雪里变得很慢，慢到你分不清是白天还是傍晚；你只知道自己还在往前走，因为绳子还在往前拉。`,
        title:'不疼，就是冻透了', sub:'体质检定',
        body:[{flav:'雪线上最后一道题，从来不是路，是身体。'}],
        opts:[{type:'check',attr:'con',dc:15,advantage:()=>!!C().linked,
          mod:()=>(C().route==='valley'?1:0)+(C().markPlaced?1:0),
          overload:()=>C().identity==='sentinel'?6:0,
          label:'【体质】撑住，把四个人一起带回雪线以下',
          hint:()=>`体质 1d20 + 体质值 vs DC 15${C().markPlaced?'（已插标 +1）':''}${C().route==='valley'?'（冰谷背风 +1）':''}`,
          success:'w_frost', fail:'w_stay'},
          {type:'answer',ask:'或者，把最后那句话留给他们——',
            placeholder:'例如：「绳子别松，我跟着你走。」',
            branches:{soothe:K_SOOTHE, force:K_FORCE, flee:K_FLEE, call:K_CALL},
            route:{soothe:'w_frost', call:'w_frost', default:'w_frost', force:'w_stay', flee:'w_stay'},
            react:(t,k)=>{
              if(k==='flee'||k==='force'){ return `「${t||'（你解开了腰上的主扣）'}」<br>你说：「绳子松了吧，你们走快一点。」搭档回头的那一瞬间，你已经坐下了。雪很软。`; }
              bumpAff(mAff(k)); return `「${t||'（你把手套咬紧，抓住绳头）'}」<br>你把绳在手腕上绕了两圈：「我不睡。走。」`;
            }}] },
      w_all:{ chapter:'结局 · 同赌', story:()=>`你把氧气拆成四份，每人都只够吊着一口气。然后你架起讯标，用最后的向导素把四个人的心跳，编进同一段频率里，一遍遍往外发。<br><br>暴风里，那支频率竟真的撞上了过顶卫星。救援直升机破雪而来时，四个人都还有气——脸色惨白，却都，活着。<br><br>【终章 · 回塔 · 复盘】第二天的复盘会上，评估员把四个人的体征曲线投在墙上，问了这间屋子里最难回答的一句话：「四个人分一瓶氧，你们凭什么觉得能全带下来？」<br><br>没有人先开口。那句没人敢说的话是：<b>当时谁都没把握，只是没人肯先说放弃谁。</b>最后是陆昀替所有人把它说了出来。评估员在回执末尾写了四个字：全员归队。你数到第三遍心跳的时候，搭档的手指在你手心里动了一下——不是挣，是回应；你把他/她的手攥紧了些，继续往下发。`,
        title:'结局 · 全须全尾', sub:'BEST ENDING',
        body:[{t:'苍岭小队全员生还。领队醒来第一句：「雪狼……还在吗？」你在他掌心画了只狼耳朵，他笑了。'},
          {t:'你把队徽还给邵青：「你的路标，把你带回来了。」'},
          {flav:'雪线之上，最锋利的不是风，是「一个都不丢」的执念。'}],
        opts:[{type:'goto',to:'the_end',ico:'🌟',label:'查看结算',hint:''}] },
      w_one:{ chapter:'结局 · 护狼', story:()=>`你把所有氧都怼给领队，自己憋着气，和搭档一左一右拖着另两个往下滑。雪坡磨破了你的膝盖，你顾不上，只顾着数前面还剩多少个弯。一路上你没敢看那两个人的脸，只在每个雪坎前把他们往上抬一次，再抬一次。<br><br>雪狼在领队怀里重新凝实，没散。另两人冻伤了手脚，却也熬到了山脚。领队后来见你就敬礼：「我的狼，是你给续上的命。」<br><br>【终章 · 回塔 · 复盘】白塔的复诊单把这次行动写成「优先级判断正确」，邵青和何棠的冻伤记录跟在后头，一行一行，都很短，短得让人不敢多看。<br><br>复盘会上有人问你，为什么先保一头精神体。你说：狼散了他就完了。会议室安静了很久。那句没人敢说的话到最后也没人说出口：<b>若那两人里有一个没熬过下山的路，这份回执就是另一个样子。</b>`,
        title:'结局 · 续狼', sub:'GOOD ENDING',
        body:[{t:'三人活，一人重伤。白塔说你「保住了最重要的那头雪狼」——在哨兵心里，那等于保住了人。'},
          {flav:'有些仗，赢在守住一个不肯散的魂。'}],
        opts:[{type:'goto',to:'the_end',ico:'🌟',label:'查看结算',hint:''}] },
      w_sac:{ chapter:'结局 · 留标', story:()=>`你做了最冷的决定：带两名还能走的先下，把讯标深深插进雪里，标出领队的位置。插下去的时候你数着秒，像是在替谁计时。<br><br>山脚救援队顺着讯标折返，找回了领队——但他过载太久，雪狼终究散了，人也少了半截魂。他活着，却再不是从前的那个领路者，眼睛里那点光一直没有回来。<br><br>【终章 · 回塔 · 复盘】你当晚把复盘写完，只写了一行：「雪线不原谅犹豫，也不奖励仁慈。」评估员看了一眼，说这句可以进档案。<br><br>可那句没人敢说的话，你到散会都没说出口：<b>插下讯标的时候，你心里已经在替他数剩下的时间了。</b>陆昀复健了半年，能走，能说话，只是再也带不了队。他见你时敬的那个礼，比从前慢很多。你没有还礼，只是站着，听风把帐篷布刮得啪啪作响。`,
        title:'结局 · 止损', sub:'NEUTRAL ENDING',
        body:[{t:'两人活，一人残。你把这次的录像看了很多遍，每次都停在同一个地方：自己弯腰插标的那三秒。'},
          {flav:'你救了能救的。山顶那声狼嚎，你很久没敢忘。'}],
        opts:[{type:'goto',to:'the_end',ico:'🌟',label:'查看结算',hint:''}] },
      w_frost:{ chapter:'结局 · 冻伤', story:()=>`你在雪线以下两百米的地方，第一次站住了。<br><br>不是走不动，是不敢再走——你低头看自己的手套，指节那里已经硬成一块蜡白的壳。你想蜷一下手指，发现它们没有回应你，像借来的东西终于被收了回去。<br><br>搭档扑过来把那只手套剪开，把你这只手塞进自己怀里，一路骂，一路抖：「你早说啊，你早说一声会死吗。」你想笑，脸上的肌肉冻得不听使唤。<br><br>直升机破雪而来的时候，苍岭小队三个人都还有气。陆昀醒来第一句问的是雪狼，第二句问的是你。<br><br>【终章 · 回塔 · 复盘】复诊单上写着：左手三指、右脚两趾永久冻伤，感官灵敏度下降百分之十七。复盘会上有人问「值不值」，那句没人敢说的话是：<b>雪线上，总得有人把自己算进损耗里。</b>最后是你自己把它说出来的。`,
        title:'结局 · 蜡白的手套', sub:'GOOD ENDING',
        body:[{t:'三个人都回来了，你留下一半的手。塔长在回执末尾写：「这是规矩，不是英雄。」'},
          {flav:'你说过要把活人带下来。你没说，是把谁也算进了「活人」里。'}],
        opts:[{type:'goto',to:'the_end',ico:'🌟',label:'查看结算',hint:''}] },
      w_stay:{ chapter:'结局 · 雪线', story:()=>`绳子从你腰上解开的时候，雪突然变得很软，很暖。<br><br>你知道那是什么——失温到最后，身体会骗你一次，把冷说成暖，把雪说成床。你看见搭档拖着三个人往下走，背影一个个变小，最后和风雪混在一起，看不出哪个是哪个。<br><br>那头雪狼在你身边卧下来，瘦得硌手。你伸手摸了摸它的耳朵，它没有躲。原来它认你了，只是晚了半个钟头——你忽然觉得这个笑话还不错。远处传来一声闷响，是直升机的声音，隔着雪听起来像从水底浮上来的；你想抬手示意，手臂却轻得像不是自己的。<br><br>【终章 · 回塔 · 复盘】三个人全须全尾地回来了。复盘会上，搭档只说了一句：「是我没拽住他。」那句没人敢说的话，最后被写进回执的备注栏，字很少：<b>「三个都回来了。差一个。」</b>你的名字刻在外勤墙第三排，编号 W-09。`,
        title:'结局 · 雪线之上', sub:'BAD ENDING',
        body:[{t:'每年第一场雪，都有人往那个名字下面放一只手电筒——像雪线上一枚没拔走的讯标。'},
          {flav:'你把命留在了雪线上，把人给我们送了回来。'}],
        opts:[{type:'goto',to:'the_end',ico:'🌟',label:'查看结算',hint:''}] },
    }
  },
  {
    meta:{key:'letter', name:'无声信使', code:'任务·C级', grade:'C', world:'解密 / 羁绊', duration:'约 50 分钟', difficulty:'入门',
      hook:'白塔的精神邮件系统里，躺着一封永远没送达的信——一位向导临终前，想寄给她的哨兵的一句话。系统在等一个肯替她念出口的人。那格接口亮了三百一十七天，没人敢碰。'},
    start:'l_brief', first:'l_vault',
    scenes:{
      l_brief:{ chapter:'白塔 · 任务简报', story:()=>`【系统任务简报 · 无声信使】编号 L-12，等级 C级。通知弹出的那一声很轻，像有人在你耳边清了清嗓子，又迟迟没有开口。<br><br>白塔的<b>精神邮件系统</b>里，有一格接口始终亮着，却发不出去——那是一封「死信」。发信人是一名向导，已在寄出前夜离世；收信人，是她同队的哨兵。走廊上有人在换气阀，热风一阵阵扑进来，你却觉得那格接口透着凉。<br><br>信的内容卡在「已写未发」的坍缩态，只有一句，却重得压弯了整格接口。系统需要一名向导（或能共感的哨兵）潜进去，替她，把那句话说出口——或，尊重她未竟的沉默。<br><br>这格接口亮了三百一十七天。系统不催，只是亮着。你盯着那行编号，忽然想起自己上一次替谁捎话，也是这样的深夜。`,
        title:'任务简报 · 无声信使', sub:'白塔派遣 · 任务·C级 · 解密 / 羁绊',
        body:[{t:'联络官：「这不是战斗。这是替一个去世的人，把没说完的话，送到该听的人耳边。」'},
          {t:'联络官顿了顿：「拿不准，就先去档案层看看她。」'}],
        opts:()=>[{type:'goto',to:G.created?'m_team':'intro',ico:'✅',label:'确认接取，进入任务',hint:G.created?'已入册 · 直接选择组队方式':'随后白塔将为你指派搭档'}] },
      l_vault:{ chapter:'第一章 · 死信格', story:()=>`你顺着系统指引，沉进那格发不出的接口。里面没有光，只有一片<b>温吞的暗</b>，像有人把一句话含在嘴里，含了一整夜，直到再没机会吐出。<br><br>暗里静得能听见自己血流的声音，没有风，没有回声，连系统的提示音都被滤掉了。你伸手试了试温度，那层暗比体温低一点点，凉得不锋利，像隔着一层洗过很多次的旧布。<br><br>暗的中央，浮着一行未发的字，被一层薄薄的导游素裹着，微微发颤。那是她的手温，隔了很久，还没凉。字被揉得很软，像被人用指腹一遍遍描过。你心里冒出一句不属于自己的话：「别碰它。」<br><br>你伸手虚按，那层暗让开一寸，又被谁从里面轻轻合了回去。你听见一声极轻的、压住的咳——你分不清那是回声，还是她留在接口里的最后一点习惯。`,
        title:'含着的那句话', sub:'精神检定',
        body:[{flav:'要先读懂这封信为何发不出去，得先触到那层未凉的手温。'}],
        opts:[
          {type:'check',attr:'spi',dc:12,advantage:()=>C().linked,overload:0,
            label:'【精神】以向导素，触到那层未凉的手温',hint:'精神 1d20 + 精神值 vs DC 12（已链接则有优势）',success:'l_read',fail:'l_vault_f'},
          {type:'goto',to:'l_archive',ico:'🗂',label:'先退出去，调她的旧档案',hint:'档案路线 · 回头再读信'}] },
      l_vault_f:{ chapter:'第一章 · 死信格', story:()=>`你探得太急。那层手温猛地一烫，像有人在暗里攥住了你的手腕。<br><br>精神被灼得发麻，眼前漫起一层水雾，鼻腔里泛起铁锈味。你听见自己心跳乱了两拍，指节僵在半空，连收回来都慢了一瞬。暗里那点微光跟着晃了晃，像睡着的人被吵醒了。<br><br>你放缓了呼吸，像怕惊扰睡梦里的人的手，只把指尖轻轻搭上去——那句话的轮廓，终于清晰了。你数了数，十七个字，一个不多。隔着这么远，你都能认出那是一种很小心的小心。<br><br>你忽然明白她不是抗拒：她是怕烫着别人的手。掌心的温度过了很久才落回你自己的，你把手指一根根伸直，才发现它们在抖。你把手收回来，在暗里晾了很久。你在心里对自己说：「慢一点，她还在这儿。」`,
        title:'被余温烫了一下', sub:'',
        body:[{t:'你把手收回来搓了搓，像刚从冷水里捞出来。暗里那点微光，跟着颤了一下。'}],
        opts:[{type:'event',sp:-4,log:'🔥 余温反灼，SP-4',to:'l_read'}] },
      l_archive:{ chapter:'第二章 · 旧记录', story:()=>`你从接口里退出来，上到档案层。这里的空气是干的，混着旧纸和机油的味道，一排排柜子亮着冷白色的索引灯，灯下的灰尘悬着不落。<br><br>你检索「晚晴」。她的记录干净得反常——十七次外勤零失误，唯一一次等级下调申请，第二天被她自己撤回了。撤回理由是手写的四个字：能力足够。<br><br>最后三个月的值班日志里，字迹越来越稳，稳得不像一个正在生病的人。自评栏一律写着「良好」，笔画收得整整齐齐，值班表的签名一天没落，连发烧那天都是本人手签。<br><br>你把同一页翻到背面，指尖停住了：体检数据里，她的向导素早已跌破警戒线，日期是写信前一周。也就是说，她每天在这里签完到，再回宿舍，写那封信。`,
        title:'她写这封信的那几天', sub:'感知检定',
        body:[{flav:'要读出一个人真正的状态，别听她写了什么，看她没写的地方。'}],
        opts:[{type:'check',attr:'per',dc:13,advantage:()=>C().linked,overload:0,
          label:'【感知】在日志的字缝里，读出她当时的状态',hint:'感知 1d20 + 感知值 vs DC 13',success:'l_archive_ok',fail:'l_archive_f'}] },
      l_archive_f:{ chapter:'第二章 · 旧记录', story:()=>`你翻得太快。档案层的旧噪声从柜子缝里涌出来——别人的值班录音、别人的告别、别人夹在体检单里的便条。柜门的合页有点松，每开一次都吱一声。<br><br>它们混成一片浑浊的沙沙声，灌进你耳朵里，像有人在你脑子里同时翻开十本旧账。有一瞬间你听见自己在说话，说的是别人的台词，语气熟得像用了几十年。<br><br>你按住太阳穴，把检索范围缩到最后三个月。噪声退潮的那一瞬，那几行字浮了出来，安静得像一直在等你回来。<br><br>你这才注意到，档案层的空调一直嗡嗡地响。你听了很久，才把它和自己耳鸣的声音分开，顺手把检索条件存了一遍——怕下回再来，还得被这样吵一次。你在心里说了句：「都别吵了。」`,
        title:'档案层太吵', sub:'',
        body:[{t:'你抹了把脸。柜子上的索引灯一排排亮着，像一条没有尽头的走廊。'}],
        opts:[{type:'event',sp:-3,log:'🌫 档案噪声灌耳，SP-3',to:'l_archive_ok'}] },
      l_archive_ok:{ chapter:'第二章 · 旧记录', story:()=>`你读出了那几天的样子。写信之前，晚晴把昭的过载记录翻了很多遍，每一条都标了日期，最后一条的页角被翻得起了毛。<br><br>在那条记录的后面，她用极小的字添了两个字：<b>撑住</b>。写得很用力，笔尖把纸背都顶出了印子，像怕谁看不见，又像怕谁真看见。<br><br>她没把查出病的事告诉任何人。她只做了一件事：把身体里最后一点向导素，一次次调频，调成最能压住他过载的那个频率——像有人拿最后一截蜡，去焐热别人的手。<br><br>写信那晚，她的笔停过三次。系统把每次停笔前的字都存着：第一个是「还」，第二个被涂成一团墨，最后留下来的，是「别」。她删掉的是自己，留下的是对他的心疼。`,
        title:'她停过三次笔', sub:'',
        body:[{t:'你合上档案，指尖还留着那两个字压出来的凹痕。'}],
        opts:[{type:'goto',to:'l_collapse',ico:'🕯',label:'重新沉进接口，去读那行未发的字',hint:'坍缩态在前面等你'}] },
      l_collapse:{ chapter:'第三章 · 坍缩态', story:()=>`你再次沉进那格接口。这一次，信格认得你了——它不再躲，反而<b>贴了上来</b>，像一只终于认了人的手，慢慢扣住你的指缝。<br><br>那层未凉的手温顺着向导素爬进你的精神图景，把晚晴最后那一夜的感官一段段按进你的身体：凌晨的风、笔尖刮纸的沙沙声、她压着咳的手背，还有台灯下那半杯没喝完的凉水。<br><br>然后是你最扛不住的那一段。一想到「昭往后怎么活」，那阵几乎要把人从中间折断的酸，就从胃里一直顶到喉咙。你听见自己心里有个声音在替她往下写：<b>别做我的哨兵了，太苦了</b>。<br><br>你分不清那是她的念头，还是你替她想出来的。这正是共感最危险的地方——同情还站得住，共感会把你按进别人的身体里。`,
        title:'被拉着走的那一寸', sub:'体质检定',
        body:[{flav:'你数着自己的呼吸：一、二、三，数到第二十下，才把它数回自己的节奏。'}],
        opts:[{type:'check',attr:'con',dc:13,advantage:()=>C().linked,overload:()=>C().identity==='sentinel'?8:0,
          label:'【体质】把她的手温，从自己的掌纹里剥出来',hint:'体质 1d20 + 体质值 vs DC 13（已链接则有优势）',success:'l_chat2',fail:'l_backfire'}] },
      l_backfire:{ chapter:'第三章 · 坍缩态', story:()=>`你没站住。那股酸是别人的，可你的身体当了真。<br><br>鼻腔发烫，眼眶发涩，你跪在接口的暗里，替一个素未谋面的人，把她那一夜忍着没咳的那几声，全咳了出来。胸腔一阵阵地闷，像被人从里面按着，按到你自己也喘不上气。<br><br>你想松手，手指却扣在信格上不肯动——那一瞬间，你脑子里闪过的居然不是自己的名字，是她没说完的那个字。你想起档案里那张照片，两个背影隔着半米；现在你明白那半米是怎么来的了。你在心里反复念着一句：「松开，松开。」<br><br>缓了很久，你才把手拿开。接口外壁很凉，你把额头抵上去，让它一点点把温度还给你。掌纹里却还留着一点不属于你的热，你把拳松开又握紧，直到那点热渗进自己的掌纹里。`,
        title:'你替她写了下去', sub:'',
        body:[{t:'你扶着接口外壁站起来。耳边的回声散了，可那句话还在你脑子里，用她的语气。'}],
        opts:[{type:'event',sp:-5,log:'💧 坍缩态反噬：你在接口里替她哭了一场，SP-5',to:'l_chat2'}] },
      l_chat2:{ chapter:'—— 中途 · 搭档的消息 ——', chatbeat:true,
        story:()=>`你从接口里退出来的时候，外层的灯亮得刺眼。值班室空着，墙上的时钟第二次经过同一分钟，秒针走得很稳，像什么都没发生过。屋里静得让你想开口，你只在心里说了一句：「我没事。」<br><br>你抬手摸了一把自己的脸——是干的。可掌心里那点别人的温度还在，像一枚没化开的硬币，你攥了攥，它不散。你走到饮水机边接了口凉水，咽下去的时候，喉咙里还留着别人的酸。<br><br>桌上摊着今晚的值班表，你的名字后面有人用笔补了个小小的圈，旁边写着三个字：别忘了吃。字很潦草，你认得那是谁的手。<br><br>手机在这时候震了两下。窗外的塔灯扫过来一次，屋里白了一瞬，又暗下去；你隔了一会儿才去拿，屏幕的光把你的影子钉在墙上，很长，一动不动。`,
        title:'📱 消息', sub:'任务进行中 · 搭档发来一条',
        body:[{t:()=>`搭档 <b>${C().partnerName}</b>：「你在接口里待了四十分钟。刚才你的向导素在外面抖了一下，整个值班室都看见了。」`},
          {t:()=>`隔了几秒又是一条：「不是催你。你要是替她难受，就替她难受一会儿。我在外面。」`}],
        opts:[
          {type:'answer',ask:'回他/她一句（影响好感）：',
            placeholder:'例如：「别进来，我自己出去。」',
            branches:{soothe:K_SOOTHE, force:K_FORCE, flee:K_FLEE, call:K_CALL},
            route:{soothe:'l_choice_read', force:'l_choice_read', flee:'l_choice_read', call:'l_choice_read', default:'l_choice_read'},
            react:(t,k)=>{
              if(k==='flee') { bumpAff(mAff(k)); return `你回：「你在外面就好，我这就上来。」<br>搭档回得很快：「我不上来。我就站在门口，让别人都别过来。」——有时候，被人挡在门外，也是一种被接住。`; }
              bumpAff(mAff(k)); return `你回：「别进来，我自己出去。」<br>搭档回了个「好」字，又补一句：「那我数着时间。你出来的时候，我给你买了热的。」`;
            }},
        ]},
      l_choice_read:{ chapter:'第四章 · 先读，还是先做别的', story:()=>`系统在你掌心投出一行提示：信格已可读。那行字很小，却把整只手掌照得发亮；它不像提示，更像有人把一盏灯硬塞进了你手里。<br><br>但<b>已写未发</b>的内容只能被打开一次——读完，这封信就从坍缩态落定，再改不了。它会变成一句确定的话，送给一个确定的人，从此归档、上锁、不再发抖。<br><br>拓印倒是可以的。白塔的终端能把未发的字拓成一张纸，你贴身收着，走到哪儿都带着。可那团被涂掉的墨拓不出来：坍缩态只肯给已经定下来的部分，剩下那一笔，说什么也不肯出来。<br><br>你可以现在就把它读掉；也可以先拓一份备份；或者，先去见见收信人，看看他还剩多少力气，来接住这句话。你听见心里有个声音说：「先别急，她还等着一个人。」`,
        title:'你要现在读吗', sub:'你的选择会改变后面所有的路',
        body:[{t:'信格在你手里很轻，轻得像什么都没装。'}],
        opts:[
          {type:'goto',to:'l_read',ico:'📖',label:'直接读：把那句话读进来',hint:'最快的一条路'},
          {type:'event',sp:0,log:'🧾 你把未发的字拓成一张纸，贴着心口收好',to:'l_read'},
          {type:'goto',to:'l_deny',ico:'🚪',label:'先去见他：先看看收信人',hint:'你会见到昭'}] },
      l_deny:{ chapter:'第五章 · 收信人', story:()=>`你没读，先去了他那儿。走廊尽头的值班室门虚掩着，灯亮到很晚，门缝里漏出一条白光，把地面切成两半。<br><br>昭如今是塔里的老哨兵。你进去的时候，他正在擦一只旧的向导素校准仪——那型号早停产了，整个白塔大概只剩这一只还被人擦着。抹布是干的，他擦得极慢，像在磨一样东西。<br><br>你还没开口，他先说：「L-12 的信，我看过系统提示。」他把仪器放下，手上没有抖，眼睛里也没有。「你找错人了。晚晴没给我写过信。我们那时候……不兴说这些。」<br><br>你把信格放在桌上。那点微光把两个人的手都照得发白。你在他的沉默里摸到了一样东西：他不是不信你会说，他是不敢听——听了，那六年就再也装不下去。`,
        title:'他不肯认自己是被写的人', sub:'亲和检定',
        body:[{flav:'他在跟你讲道理，其实是在跟自己的那六年讨价还价。'}],
        opts:[
          {type:'check',attr:'cha',dc:13,advantage:()=>C().linked,overload:0,
            label:'【亲和】共感他这份否认底下压着的东西',hint:'亲和 1d20 + 亲和值 vs DC 13（已链接则有优势）',success:'l_self',fail:'l_read'},
          {type:'answer',ask:'你也可以亲口对他说点什么——故事会顺着你的话推进：',
            placeholder:'例如：「那我就当没找到人。」',
            branches:{soothe:K_SOOTHE, force:K_FORCE, flee:K_FLEE, call:K_CALL},
            route:{soothe:'l_read', force:'l_read', flee:'l_read', call:'l_self', default:'l_read'},
            react:(t,k)=>{
              if(k==='force') { bumpAff(mAff(k)); return `「${t||'（你把信格收回掌心）'}」……他沉默了很长时间，才说：「……你走吧。」他没关门，但也没让你进。`; }
              if(k==='flee') return `「${t||'（你说那就当没找到人）'}」……他点了点头，像松了口气，又像被谁按住了肩膀。`;
              return `「${t||'（你说她写字的时候，手是热的）'}」……他盯着那点微光看了很久，终于把手从膝盖上抬起来一点，伸向桌上那只信格。`;
            }},
        ]},
      l_read:{ chapter:'第六章 · 信里的人', story:()=>`你读到了那句话的来路。写信的向导叫<b>晚晴</b>，收信的哨兵叫<b>昭</b>。他们是白塔里出了名的「契合对」——她的精神体白鹿，总在他过载时，安静地卧在他脚边。<br><br>档案里的照片很旧：训练场的午后，两个背影隔着半米站着，谁也没看谁。她的制服袖口洗得发白，他的肩章上有一道补过的线，针脚歪歪扭扭，不像他的手艺。照片背面写着日期，笔迹和那封信一样，收得很紧。<br><br>最后一夜，晚晴查出不治之症。她没告诉昭，只是连夜写好了这封信，想等任务结束再说。可任务结束那晚，先倒下的，是她。信，永远停在了「已写未发」。<br><br>读到这儿你才明白：那个被涂掉的字不是写错。那是一个人在替另一个人，删掉自己的苦。`,
        title:'晚晴与昭', sub:'亲和检定',
        body:[{flav:'要把信送到，得先确认——昭，知不知道她没说出口的事。'}],
        opts:[{type:'check',attr:'cha',dc:12,advantage:()=>C().linked,overload:0,
          label:'【亲和】共感昭这些年的沉默，判断他是否知情',hint:'亲和 1d20 + 亲和值 vs DC 12（已链接则有优势）',success:'l_find',fail:'l_read_f'}] },
      l_read_f:{ chapter:'第六章 · 信里的人', story:()=>`你共感得太深。昭这些年的沉默像一口井，你一脚踩空，直接被里面的怕淹了半身。井里很黑，却听不见水声——他把水都咽了。<br><br>鼻腔泛起酸，太阳穴一跳一跳。你想抽身，却发现自己的呼吸正跟着别人很多年前的一个节拍走，一吸一呼，都不由你。你数到第七下才把它抢回来。<br><br>缓过来之后，你反倒笃定了：他一定知道。只是和晚晴一样，把话都咽进了同一格发不出的信里——两个人隔着六年，做了一模一样的动作，连忍住不说的姿势都像照着一个模子刻的。那句结论，你是在心里说出来的：「他早就知道了。」<br><br>你抹了把脸。值班室的灯太白了，照得人无处可躲。你把照片翻回正面，那半米的距离，在灯下看着比六年还远。`,
        title:'共感岔了', sub:'',
        body:[{t:'你把照片放回档案袋里，压在了一摞体检单的下面。'}],
        opts:[{type:'event',sp:-3,log:'💧 共感岔气，SP-3',to:'l_find'}] },
      l_find:{ chapter:'—— 中途 · 搭档的消息 ——', chatbeat:true,
        story:()=>`你从信格里退出来，找了一处有窗的地方站定。窗外的塔灯一圈圈扫过去，把玻璃照得一亮一暗，像谁在外面反复点头。<br><br>走廊里飘着消毒水和热咖啡的味道，有人在很远的地方说笑，笑声撞在金属墙上，碎成一小片一小片。你把额头贴在玻璃上，玻璃是凉的，凉得很干净；你在上面呵了一口气，雾气很快散了。<br><br>你想起昭那句「你找错人了」，又想起晚晴涂掉的那个字。两个人把同一句话，在各自心里改了六年，改到最后谁都不肯先开口。你没跟他们任何一个人说过话，却好像已经替他们吵过一场。<br><br>手机亮起的时候，你正把那句话在心里默念到第三遍，念到连呼吸都跟着慢下来，像在替谁试音。`,
        title:'📱 消息', sub:'任务进行中 · 搭档发来一条',
        body:[{t:()=>`搭档 <b>${C().partnerName}</b>：「这封信……看得我有点难受。要是哪天我也留了句没说的，你会替我发出去吗？」`}],
        opts:[
          {type:'answer',ask:'回他/她一句（影响好感）：',
            placeholder:'例如：「我不会让你有没说完的话。」或「先把今天的话说完。」',
            branches:{soothe:K_SOOTHE, force:K_FORCE, flee:K_FLEE, call:K_CALL},
            route:{soothe:'l_decide', force:'l_decide', flee:'l_decide', call:'l_decide', default:'l_decide'},
            react:(t,k)=>{
              if(k==='call') { bumpAff(mAff(k)); return `你回：「我不会让你有没说完的话。」<br>搭档很久没回，最后发了个「🥺」，又补一句：「……那我把今天的话，先说一半给你听。」`; }
              bumpAff(mAff(k)); return `你回：「先把今天的话说完。」<br>搭档笑了：「行，今天的不欠。剩下的……以后慢慢还。」`;
            }},
        ]},
      l_decide:{ chapter:'第七章 · 送，还是留', story:()=>`你顺着信的指向，找到了昭。他如今是塔里的老哨兵，沉默、寡言，白鹿却再没出现过——他的精神体，随晚晴一起，停在了那年。<br><br>而现在他就坐在你对面，把那只杯子摆成了两个人的位置。杯子是干净的，他大概每天都这样摆。桌上没有茶，也没有烟灰缸，只有那只杯子和一圈干净的光。他不问你要什么，只是等着，手指压在桌沿上，压出一小片白。<br><br>系统在你掌心亮起选项：替晚晴念出那句话；尊重她的沉默，把信封存为碑；用你自己的话告诉他——有人很爱他。你听见自己心跳的声音，比刚才在接口里还要清楚。你在心里替她把话说了一遍：「昭，我有一句没说完。」<br><br>你也可以把信格交到他手里，让他自己读；甚至，替她说完，只把那个被涂掉的字，改回去。`,
        title:'你要怎么处置这封信', sub:'你的选择将决定结局',
        body:[{t:'系统提示：无论哪种，这格死信都将被「了结」。你做的，只是替她，选一个尽头。'}],
        opts:[
          {type:'goto',to:'l_say',ico:'📣',label:'念出：替晚晴，把那句话说给昭听',hint:'送达路线'},
          {type:'goto',to:'l_seal',ico:'🪦',label:'封存：尊重她未发的本意，立为碑',hint:'尊重路线'},
          {type:'goto',to:'l_own',ico:'💞',label:'转述：用你的话告诉昭——有人很爱他',hint:'羁绊路线'},
          {type:'goto',to:'l_self',ico:'📨',label:'交付：把信格放进他手里，让他自己读',hint:'收信人路线'},
          {type:'goto',to:'l_swap',ico:'✒️',label:'改一个字：把被她涂掉的那个字念回去',hint:'译者路线'},
          {type:'answer',ask:'你也可以亲口决定——故事会顺着你的话推进：',
            placeholder:'例如：「我把她的原话，念给你听。」',
            branches:{soothe:K_SOOTHE, force:K_FORCE, flee:K_FLEE, call:K_CALL},
            route:{soothe:'l_say', force:'l_seal', flee:'l_seal', call:'l_own', default:'l_say'},
            react:(t,k)=>{
              if(k==='force') return `「${t||'（你封存了信）'}……有些话，不发，也是圆满。你把信格轻轻合上。」`;
              if(k==='flee') return `「${t||'（你立了碑）'}……尊重她的沉默。信格凝成一座小小的碑。」`;
              return `「${t||'（你念出原话）'}……那句压了一整夜的话，终于，落进了该听的耳朵。」`;
            }},
        ]},
      l_say:{ chapter:'结局 · 送达', story:()=>`你蹲到昭面前，以晚晴的口吻，把那句未说的话，一字一句，念给他听：「昭，我这辈子最不后悔的，是做了你的向导。下辈子，还做。」<br><br>房间里静了几秒，只有桌上那只旧校准仪轻轻震了一下。这个沉默了多年的老哨兵，忽然红了眼眶。他没看你，也没看那封信，眼睛盯着桌上一个固定不动的点，喉结上下动了一次，还是没出声。<br><br>他怀里，一只小小的<b>白鹿</b>虚影，怯怯地，探出了头。它先看他，又看你，最后把头搁回了他的膝上，像回了家。<br><br>昭张了张嘴，什么也没说出来，只是把手覆在那只虚影上，覆得很轻，像怕它再走一次。过了很久，他才说了一句：「……你替她，说得真好。」`,
        title:'结局 · 听到了', sub:'BEST ENDING',
        body:[{t:'昭的精神体回来了。他说，那句话他等了很多年，原来晚晴，也等了很多年。'},
          {t:'归档：第二天，系统把这封信改成「已送达」，页面上只有日期，没有理由。后来有人看见，昭的值班室多摆了一只杯子，他不解释，也没人问。'}],
        opts:[{type:'goto',to:'the_end',ico:'🌟',label:'查看结算',hint:''}] },
      l_seal:{ chapter:'结局 · 立碑', story:()=>`你没有念出那句话。你尊重晚晴「未发」的本意，把信格凝成一座小小的、只有向导能看见的碑，立在系统最深处，碑面朝里，不朝路。碑不高，刚好到一个成年人抬手能够到的高度。<br><br>立碑的时候你听见很远的回声，像是谁在纸上一遍遍写同一个字，写到自己也忘了本来要说什么。你站了一会儿，替她把纸压平了，又把碑脚的两粒浮尘拂开。<br><br>昭某天路过那片暗，莫名停了步，手按在虚空里，像摸到了谁的温度。他没说话，却站了很久，站到值班室的灯自己熄了一次，又亮起来。<br><br>你隔着很远看着，没有过去。有些话说出口是送达；不说出口，也是一种守着。你回头时，看见他抬手在碑的位置上停了一下，像在替谁理了理衣领。`,
        title:'结局 · 沉默的碑', sub:'GOOD ENDING',
        body:[{t:'白塔档案里多了一行注：「此处曾有人，把一句话，温柔地咽了回去。」'},
          {t:'归档：这封信被记为「未送达」，编号后加了个括号——（留）。后来每年那个日子，昭都会去那片暗里站一会儿，他不带花。'}],
        opts:[{type:'goto',to:'the_end',ico:'🌟',label:'查看结算',hint:''}] },
      l_own:{ chapter:'结局 · 转述', story:()=>`你没照念原话。你用自己的方式，走到昭身边，说：「有个人，很爱你。她没来得及说，但我替她告诉你——你值得被这样爱着。」你没有提那句话，也没有提那个被涂掉的字。<br><br>昭怔了怔。他手里的抹布停在半空，水珠顺着布角滴在桌上，砸出一小圈，谁也没去擦。屋里的排气扇慢了下来，一停一顿；窗外塔灯又扫过来一次，两个人都没动。<br><br>他忽然笑了，笑里带泪，很难看，却比刚才任何时候都像活着：「我知道。我一直知道。我只是……想听别人替她说一次。」<br><br>说完他抬手，把那只校准仪摆正了，摆得端端正正，像在替谁整理衣领。你看见他的手指在仪器的边缘停了一停，才收回去。`,
        title:'结局 · 有人爱他', sub:'NEUTRAL ENDING',
        body:[{t:'白鹿没回来，但昭眼里的冰，化了一角。他说，这就够了。'},
          {t:'归档：信格熄灭时，系统把它归进「已读 · 非本人」，这行字看着别扭，却是最准的一行。后来昭把校准仪收进了柜子，可每年校准日，他还会拿出来擦一次。'}],
        opts:[{type:'goto',to:'the_end',ico:'🌟',label:'查看结算',hint:''}] },
      l_self:{ chapter:'结局 · 他自己读', story:()=>`你没有念，也没有转述。你把那只信格原封不动地放进他手里——交出去的不是一句话，是一件还没定下来的东西。<br><br>昭握了很久。他的手很糙，指腹上全是老茧，握着那点微光，像握着一只不敢用力的鸟。他问了一句：「这是她的，还是你的？」你说：都是。你们谁都没再说话，桌上那只空杯子在灯下亮着一圈边。<br><br>最后是他自己按开了信格。那行未发的字浮出来时，他的呼吸停了半拍，又续上了。他读得很慢，一个字一个字，像在替她把字重新写一遍。<br><br>读完他没有哭，只是合上信格，说：「哦。我收到了。」杯子还摆在那里，谁也没动。你们都知道，那一个字里装了多少年。`,
        title:'结局 · 他自己读的', sub:'GOOD ENDING',
        body:[{t:'白鹿在他身后闪了一下就没，但那不是消散——那是它试着站起来。'},
          {t:'归档：这封信被记作「已送达 · 收信人自取」，备注栏第一次出现这两个字：本人。后来昭把那句话背了下来，却从不复述，只写在校准仪底盖内侧。'}],
        opts:[{type:'goto',to:'the_end',ico:'🌟',label:'查看结算',hint:''}] },
      l_swap:{ chapter:'结局 · 一个字', story:()=>`你念了。你把那句话一字一句念给他听，只在最后，改了一个字。你听见自己的声音在屋里显得很空，像在一间很久没人开口的房间里说话。<br><br>晚晴写下这句时，笔停过三次：第一个字是「还」，第二个被涂成一团墨，最后留下的是「别」。她大概是怕他背着这句话活一辈子——她太了解他了，知道他扛得住过载，扛不住亏欠。<br><br>可你看着这个把一只报废仪器擦了六年的哨兵，终究没有念那个「别」字。你把被涂掉的字念了回去：「昭，我这辈子最不后悔的，是做了你的向导。下辈子，<b>还</b>做。」<br><br>你替她说完了这句话，只改了一个字。昭听懂了。他先摇头，摇到一半就摇不下去了，最后抓起那只校准仪抵住额头，肩膀一下一下地抖。`,
        title:'结局 · 一个字', sub:'TRUE ENDING',
        body:[{t:'你替死者做了她当年没敢做的决定。系统记了你一行「操作越权」，你没有申辩。'},
          {t:'归档：信格落定后，这封死信被归入「已送达 · 修订一次」，修改记录里只有一个字的差异。后来白鹿回来了，它闻了闻校准仪，又用角顶了一下他的手背。'}],
        opts:[{type:'goto',to:'the_end',ico:'🌟',label:'查看结算',hint:''}] },
    }
  },
  {

      hook:'一名哨兵的精神图景里，养着两头精神体——黑豹与白鹿，本是护主的双翼，如今却在他心里互相撕咬。你潜进他的图景，去当一回，劝架的人。等你真的站上那道裂痕，你才发现：它们吵的从来不是彼此，而是一句谁都没听完的话。'},
    start:'t_brief', first:'t_gate',
    scenes:{
      t_brief:{ chapter:'白塔 · 任务简报', story:()=>`【系统任务简报 · 双面塔】编号 T-05，等级 S级。<br><br>哨兵<b>宴之</b>在一次任务归来后，精神图景里养着的两头精神体——<b>黑豹</b>与<b>白鹿</b>——突然反目。黑豹要他永远冷硬、不再受伤；白鹿要他柔软、去爱人。两头兽在他心里昼夜撕咬，把人撕得日渐空洞。<br><br>白塔探查：这不是病，是他在那次任务里，同时失去了「该恨的人」和「该爱的人」。你作为向导潜进他的图景，不是去杀哪一头，而是去，劝它们，重新做回他的两翼。<br><br>时限四十八小时。图景类外勤拖过三天，主人就再也分不清：哪一半是自己，哪一半是那头兽希望他成为的样子；到那时候，两头兽都会赢，只有他一个人输。而白塔只会收到一行「已处理」的回执，没人会再问里面那两头兽。`,
        title:'任务简报 · 双面塔', sub:'白塔派遣 · 任务·S级 · 精神图景 / 对峙',
        body:[{t:'联络官：「记住，黑豹和白鹿都是他。你劝不和，就是劝他，别再把自己撕成两半。」'}],
        opts:()=>[{type:'goto',to:'t_dossier',ico:'📁',label:'先调阅宴之的完整档案',hint:'进去之前，先知道他替谁赎了三年'},
          {type:'goto',to:G.created?'m_team':'intro',ico:'✅',label:'确认接取，直接进入任务',hint:G.created?'已入册 · 直接选择组队方式':'随后白塔将为你指派搭档'}] },

      t_dossier:{ chapter:'第一章 · 入图景之前', story:()=>`你在登塔前调出了宴之的完整档案。纸页边角磨得起了毛，有人比你先读过很多遍。<br><br>编号 T-05，哨兵，评级 <b>S</b>。三年前山口哨站失守，小队七人，回来两个。档案上写着「战术失误，非个人过失」——八个字，盖住了四十七条。你翻到通讯记录：只剩半句话，是被爆响切断的那句「要好好活着，去爱——」。后半截，跟哨站一起没了。记录后面附着一张现场照片：雪地上一排脚印，走到一半就断了。<br><br>评估栏里只有一行，是上任疏导员写的：「他坚持认为，两头精神体都是他的错。他从不提那个人的名字，也从不去扫墓。」<br><br>联络官站在你身后，等你合上档案：「读完了？那你打算以什么名义进去——里面的兽认的不是证件，是立场。」`,
        title:'读宴之的档案', sub:'你以什么名义进去，决定它们怎么听你说话',
        body:[{flav:'档案最后那页是空的。留白的地方，本该写那个人的名字。'}],
        opts:()=>[
          {type:'goto',to:G.created?'m_team':'intro',ico:'🪶',label:'以白塔的名义进去',hint:'门会认你，兽会防你',onPick:()=>{G.twinVoice='tower';}},
          {type:'goto',to:G.created?'m_team':'intro',ico:'🤝',label:'以朋友的名义进去',hint:'不是来修他，是来陪他',onPick:()=>{G.twinVoice='friend';}},
          {type:'goto',to:G.created?'m_team':'intro',ico:'🚪',label:'什么名义都不用，直接进去',hint:'先看清，再开口',onPick:()=>{G.twinVoice='silent';}}]},

      t_gate:{ chapter:'第二章 · 图景之门', story:()=>`你沉进宴之的精神图景——一座<b>双生的塔</b>：左半漆黑，铁栏森森，黑豹卧在阴影里舔爪；右半素白，草木葱茏，白鹿在光里低头吃草。两半之间，一道裂痕横贯，像被人硬生生掰开过。<br><br>空气里没有风，却有铁锈味和青草味，一前一后地撞进你鼻腔。你摸了摸身边的墙：左边是冷的铁，右边是温的木，中间那道缝，什么都不是。你一脚踩进门槛，两头兽同时抬头，一黑一白，目光都钉在你身上，像两根钉子。空气里绷着一根快断的弦。<br><br>塔没有顶。抬头是一片灰白的天，像图景主人合不上、也不敢闭上的眼睛。你身后的门合上了，很轻，像有人替你掩住了一扇会漏气的窗——可你听见很深的地方，有谁在反复念着半句话，念得很慢，像怕人听清，又像怕没人听见。`,
        title:'一塔两半', sub:'精神检定',
        body:[{flav:'要在两头兽之间站住脚，得先让它们知道——你不是来挑一边站的。'}],
        opts:[{type:'check',attr:'spi',dc:13,advantage:()=>C().linked,mod:()=>G.twinVoice==='tower'?2:0,overload:0,
          label:'【精神】以向导素，同时安抚黑豹与白鹿',hint:()=>`精神 1d20+精神 vs DC 13${G.twinVoice==='tower'?' · 白塔的名义 +2':''}`,success:'t_gate_press',fail:'t_gate_f'}] },

      t_gate_f:{ chapter:'第二章 · 图景之门', story:()=>`你刚一露头，黑豹低吼、白鹿惊跳，图景剧晃：左半的铁栏哗啦作响，右半的草叶齐齐伏倒，你被两股相反的气压夹在中间，耳膜生疼。<br><br>图景里的声音是碎的。黑豹的喉音压得很低，像远处滚过来的雷；白鹿的蹄子一下一下磕着地，很轻，很急。你听得出那不是敌意，是两头兽各自在护着自己那一半的塔。<br><br>你先开口，报了自己的名字，很慢，让两头兽都听得清；两头兽都没动，可你看得见：白鹿的耳朵朝你转了过来，黑豹的胡须抖了一下。你赶紧收回锋芒，把自己缩成一道温和的光，不偏不倚落在裂痕正中——两只手都摊开，让它们看清，你是空着手进来的。两头兽这才微微收了爪，各自退回半步，把你让在中间。`,
        title:'被两头盯着', sub:'',
        body:[{t:'黑豹重新卧下，眼睛却始终没离开过你。白鹿在你三步外停住，低头，用角尖碰了碰空气。'}],
        opts:[{type:'event',sp:-4,log:'🐾 双压夹击，SP-4',to:'t_gate_press'}] },

      t_gate_press:{ chapter:'第二章 · 图景之门', story:()=>`你刚在裂痕正中站稳，两头兽就同时动了。<br><br>黑豹不扑你。它只是把「怕」铺开——三年前山口的冷、哨站塌下来时的黑、七个人变两个的重量，整片压在你的向导素上，你听见自己的骨头在响。白鹿也不撞你。它把「舍不得」摊开——那个人临走前的脸、没说完的话、还没过完的冬天，软软地往你心里沉，沉得你想哭。<br><br>一冷一软，你被夹在正中间。<b>两头兽不是在攻击你，是在试你够不够稳。</b>你的向导素被压出细微的爆响，像雨里的电线。它们同时在称你：一头的秤上放着「别再受伤」，另一头的秤上放着「别不再爱」。你的膝盖开始发酸，手指在图景里抓紧了裂缝的边缘。你听见自己心里有个很轻的声音在说：站住，别散。稳不住的人，会被它们撕成第三半——不黑，不白，谁也不认。`,
        title:'两头同时压过来', sub:'体质检定',
        body:[{flav:'要在这座塔里站住，先得让自己的向导素，比两头兽的悲伤，更沉。'}],
        opts:[
          {type:'check',attr:'con',dc:13,mod:()=>G.twinVoice==='silent'?2:0,overload:()=>C().identity==='sentinel'?7:0,
            label:'【体质】把向导素沉到脚底，扛住两股相反的力',hint:()=>`体质 1d20+体质 vs DC 13 · 硬扛要付代价${G.twinVoice==='silent'?' · 什么名义都没用 +2':''}`,success:'t_crack',fail:'t_press_f'},
          {type:'event',sp:-3,log:'🕳 你不硬扛，把自己摊成一道缝，让两股力从身上穿了过去，SP-3',to:'t_crack',label:'不扛：把自己摊平成一道缝',hint:'软着过去，向导素会漏一点'}] },

      t_press_f:{ chapter:'第二章 · 图景之门', story:()=>`你的向导素被两股力拧成一股麻花，膝盖先软了。<br><br>你跪下去的那一瞬，图景里开始下黑色的雪——那是黑豹的怕；雪落到地面，又长出白色的花——那是白鹿的舍不得。雪落在你背上，凉得像那年山口的夜；花却在你手边开着，软得像一句没说出口的挽留。你跪在雪和花的中间，手心贴着冰凉的裂痕，喘了很久，喘到听见自己的心跳。<br><br>黑豹低头看了你一眼，没咬。它把一只爪子按在你面前的雪上，留下一个很深的印子：「站不稳的，都别进来。」<br><br>你没有辩解，也没有起身。你的向导素漏了一些在图景里，散成很淡的白雾，谁也收不回去。你只是慢慢把向导素收拢，从脚底重新往上垒。这一次，你垒得比刚才慢，也比刚才实；垒到最后一层时，你的向导素终于不抖了。`,
        title:'被压下去了', sub:'',
        body:[{t:'白鹿没有笑你。它把一朵刚开的花，轻轻推到你手边，又退回去站好。'}],
        opts:[{type:'event',sp:-5,overload:()=>C().identity==='sentinel'?6:0,log:'🐾 两压之下跪了一瞬，SP-5',to:'t_crack'}] },

      t_crack:{ chapter:'第三章 · 裂痕的独白', story:()=>`往塔的深处走，两半之间那道裂痕开始变宽，宽到能站人，也能埋人。缝壁上结着一层薄霜，摸上去却烫手；缝里有风，风是热的，带着血和铁的味道。<br><br>你把耳朵贴上缝壁听。里面有声音，很轻，像谁隔着水说话——不是黑豹的低吼，也不是白鹿的哭，是<b>宴之自己没敢听的那半句</b>。它从三年前循环到现在，一刻没停。<br><br>你伸手去贴那道缝，指尖刚一进去就被推了出来——缝不让人碰，只让人听。那半句话在图景里没有回声，落下去就没了，像一枚丢进深井的石头。你屏住呼吸，终于听清了那四个字：「<b>不是你的错。</b>」<br><br>那天的爆响、他自己的吼、后来所有的年月，把这四个字盖得严严实实。他把「不是你的错」听成了「是你的错」，于是养了黑豹替他还，养了白鹿替他疼——两头兽守了三年的，原来只是一场听错。`,
        title:'裂痕里，半句话一直在说', sub:'你可以接上链接，也可以只听着',
        body:[{flav:'图景不会撒谎。图景只会把主人不肯听的东西，一遍一遍，说给他自己听。'}],
        opts:[
          {type:'link',dc:13,label:'【链接】顺着裂痕，与图景的主人建立链接',hint:'向导+精神/哨兵+亲和 vs DC 13 · 成功则后续检定有优势',success:'t_black',fail:'t_static'},
          {type:'event',sp:-3,log:'🕳 你贴得太近，被裂痕的嗡鸣割了一下，SP-3',to:'t_static',label:'先不接话，只把这四个字记牢',hint:'不碰它，但它已经记住了你'},
          {type:'answer',ask:'你也可以对着裂痕回一句——故事会顺着你的话推进：',placeholder:'例如：「我听见了。我会替你带给他。」',
            branches:{soothe:K_SOOTHE, force:K_FORCE, flee:K_FLEE, call:K_CALL},
            route:{soothe:'t_black', call:'t_black', force:'t_static', flee:'t_static', default:'t_black'},
            react:(t,k)=>{ if(k==='force') return `「${t||'（你什么也没说）'}」……你对着缝壁说得太重，那半句话缩了一下，躲进更深的地方去了。`; if(k==='flee') return `「${t||'（你退开半步）'}」……你没有应它。裂痕继续念着，像一台没人听的电台。`; return `「${t||'（你轻轻应了一声）'}」……裂痕停了一瞬。三年了，第一次有人，把这四个字接住。`; }}]},

      t_static:{ chapter:'—— 中途 · 搭档的消息（信号 1 格）——', chatbeat:true,
        story:()=>`图景深处的信号，只剩最后一格。<br><br>越往裂痕里走，外头的世界就越薄。你还能感觉到链接那一头的线，细细的，像一根晾在风里的棉线，随时会断。向导素在这里消耗得很快，你每走十步，就得停下来一次，重新听一次自己的呼吸。<br><br>黑豹的影子跟在走廊顶上，一步也没有落下；白鹿的蹄声很轻，落在你左边。塔里的风是从下往上吹的，带着铁锈和青草两种味道——左半和右半的味道，第一次混在了一起。<br><br>就在这时，那根线动了一下。有人在你身后很远的地方，攥着链接的另一头，攥得指节发白。你把向导素压到最低，只留一点在指尖——像进别人家之前，先在门口蹭掉鞋上的泥。`,
        title:'📱 消息', sub:'任务进行中 · 图景深处 · 信号只剩一格',
        body:[{t:()=>`搭档 <b>${C().partnerName}</b> 的消息挤进来，只有半截：「你在里面撑住，我这边——」<br><br>后半句被杂音嚼掉了。你盯着那半行字，能想见他/她在外面按着链接打字的样子。`}],
        opts:[
          {type:'answer',ask:'信号只剩一格，你只能回很短的一句：',placeholder:'例如：「撑得住。」',
            branches:{soothe:K_SOOTHE, force:K_FORCE, flee:K_FLEE, call:K_CALL},
            route:{soothe:'t_black', force:'t_black', flee:'t_black', call:'t_black', default:'t_black'},
            react:(t,k)=>{ bumpAff(mAff(k));
              if(k==='call') return `你回了三个字：「撑得住。」<br>这条消息发出去用了十一秒。对面很久没动静，然后挤进来一个句号——「。」<br>你们之间，一个句号就够了。`;
              return `你回了三个字：「撑得住。」<br>半分钟后，对面挤进来两个字：「胡说。」信号随即断了。`; }},
          {type:'goto',to:'t_black',ico:'🤐',label:'不回：先把向导素收拢',hint:'信号太弱，多说一个字，就多漏一分'}] },

      t_black:{ chapter:'第四章 · 黑豹的怨', story:()=>`你先走向了黑豹。它背对着你，脊背一道旧疤，是那次任务里替宴之挡下的。<br><br>左半的塔是铁的：地上散着断掉的栏杆、烧黑的护腕、几枚没有主人的军牌。黑豹就卧在这些东西中间，像卧在一堆没人收的遗物里。它的呼吸里有铁腥味，每说一句，地上的军牌就轻轻跳一下。它哑声说：「是他让我别再软的。软，就会失去。那次他爱的那个人，就是因为他软，才没护住。」<br><br>黑豹的怨，不是凶，是怕——怕宴之再因柔软而痛，于是宁可把他，冻成铁。它不看你，只看着那堆遗物——那是它守了三年的证据。你蹲下去，捡起一枚军牌，正反面都磨得看不清字了；黑豹的眼睛跟着你的手，一动没动。你说不清哪一样更冷：是它这句话，还是它趴着的这一块地。`,
        title:'黑豹：别再软', sub:'感知检定',
        body:[{flav:'要劝它，得先看清——它护的，到底是宴之，还是宴之的伤。'}],
        opts:[{type:'check',attr:'per',dc:12,advantage:()=>C().linked,mod:()=>G.twinVoice==='friend'?1:0,overload:0,
          label:'【感知】在黑豹的怨里，读出它藏着的怕',hint:()=>`感知 1d20+感知 vs DC 12${G.twinVoice==='friend'?' · 朋友的名义 +1':''}`,success:'t_scar',fail:'t_black_f'}] },

      t_black_f:{ chapter:'第四章 · 黑豹的怨', story:()=>`你误把黑豹的凶当成了恶意。<br><br>向导素探偏了半寸，正撞在它护着的骨头上。它低吼一声，图景里的铁栏齐齐震了一记，你被震得后退一步，鞋底碾碎了一枚军牌。黑豹没有追，它只是把那堆遗物往自己身后又拢了拢——像你刚才伸手要抢。<br><br>你退开半步，先松开了自己的向导素，让它知道你没有恶意。你没敢再靠近，只把手摊在身前，让它看清你手里什么都没有。铁栏慢慢停住了震颤。定了定神，你换了个角度：不去读它的牙，去读它护在身后的、宴之的影子。你把向导素收成一根很细的线，绕过它的牙口，只从颈侧探进去。那层怕，终于显形了——一团蜷着的小小的人影，抱着膝盖，不敢出声。你对那团影子，轻轻说了一句：「我看见你了。」远处白鹿的蹄声停了一拍，又响了起来。`,
        title:'读偏了', sub:'',
        body:[{t:'黑豹的尾巴在地上扫了一下。它没有回头，可它的吼声，低了下去。'}],
        opts:[{type:'event',sp:-3,log:'🐆 误读受扰，SP-3',to:'t_scar'}] },

      t_scar:{ chapter:'第四章 · 黑豹的旧疤', story:()=>`黑豹转身时，你终于看清那道疤：从肩胛一直裂到腰，皮肉长歪了，像又一道小的裂痕，还在一鼓一鼓地渗着光。左半的空气是凉的，混着铁锈和雪水的味道，你呼出的气在图景里凝成一小片白。<br><br>它自己不提。你一靠近，它就把头扭开：「那天我挡在他前面，没挡住。疤是我该得的。」你的手悬在半空，能感觉到疤下面有东西在跳——一下，一下，比心跳慢。疤面硬得像旧皮革，边缘却是软的；指尖刚碰到，黑豹整条脊背就往后缩了一寸。<br><br>覆上去，你就能把那天从头到尾读一遍——塌方的声音、被埋在底下的名字、宴之在雪里刨了很久的那双手。可那也等于把这头兽最疼的一夜，重新翻出来，逼它再看一遍。你的向导素在指尖聚成一点光，等着你决定往哪儿落。<br><br>要不要碰？`,
        title:'要不要碰它的旧疤', sub:'你的手停在半空',
        body:[{t:'黑豹没有躲。它只是把脊背绷得更紧——这是它给外人唯一的一次许可。'}],
        opts:[
          {type:'goto',to:'t_white',ico:'🩸',label:'碰：覆手上去，把那一天读清',hint:'代价 SP-4 · 你会跟着疼一遍',
            onPick:()=>{const c=C(); c.sp=Math.max(0,c.sp-4); if(c.identity==='sentinel') c.overload=Math.min(100,(c.overload||0)+5); G.twinScar=true; addMLog('🩸 你揭开黑豹的旧疤，替它把那一夜重读了一遍，SP-4');}},
          {type:'goto',to:'t_white',ico:'🕊',label:'不碰：把手收回，只问它疼不疼',hint:'有些疼不该由外人替他翻',onPick:()=>{G.twinScar=false;}},
          {type:'answer',ask:'或者，对它说点什么——',placeholder:'例如：「这道疤，不是你的错。」',
            branches:{soothe:K_SOOTHE, force:K_FORCE, flee:K_FLEE, call:K_CALL},
            route:{soothe:'t_white', call:'t_white', force:'t_white', flee:'t_white', default:'t_white'},
            react:(t,k)=>{ if(k==='force') return `「${t||'（你什么都没说）'}」……黑豹低吼了一声，没有回头。它把疤藏得更深了。`; if(k==='flee') return `「${t||'（你什么也没说）'}」……你什么都没说。黑豹等了很久，久到你以为它睡着了。`; return `「${t||'（你只是轻轻叹了口气）'}」……黑豹的耳朵动了一下。它没有回头，但它的尾巴，很轻地，扫了一下地面。`; }}]},

      t_white:{ chapter:'第五章 · 白鹿的求', story:()=>`转到右半，白鹿迎上来，眼里有泪。<br><br>右边的塔是活的：藤蔓顺着断墙往上爬，风里有草木的涩味，踩下去的地是软的。阳光从藤蔓缝里漏下来，落在它背上，一块一块的；它走过的草地会慢慢直起来，像有人在替它扶伤。它说话的时候鼻息很轻，草叶跟着一颤一颤，光斑在它喉咙上一滚一滚。白鹿站在一片刚浇过水的花里，轻声说：「我也怕。可我更怕他，再也不会爱人了。那次他失去的人，走前最后一句话是『要好好活着，去爱别人』。黑豹把这句话，嚼碎了吞了，只留了『别软』。」<br><br>原来两头兽守着同一句话的两个半句，却谁都没听完对方的那一半。你蹲下去，与它平视；它的睫毛上挂着一滴水，不知道是露水，还是眼泪。它低下头，用角尖把一朵歪倒的花扶正，又用鼻尖碰了碰花瓣，才重新看你。`,
        title:'白鹿：去爱', sub:'亲和检定',
        body:[{flav:'要在两头间架桥，得让它们听见——彼此守的，是同一份舍不得。'}],
        opts:[{type:'check',attr:'cha',dc:12,advantage:()=>C().linked,mod:()=>G.twinVoice==='friend'?1:0,overload:0,
          label:'【亲和】把黑豹的怕与白鹿的求，连成同一句话',hint:()=>`亲和 1d20+亲和 vs DC 12${G.twinVoice==='friend'?' · 朋友的名义 +1':''}`,success:'t_words',fail:'t_white_f'}] },

      t_white_f:{ chapter:'第五章 · 白鹿的求', story:()=>`你急着撮合，话没说圆。<br><br>白鹿的求与黑豹的怕在半空撞了一下，图景又晃：花被打落了一地，铁栏那边响起一串刺耳的刮擦。白鹿退开半步，耳朵向后贴，眼里那点光黯了下去——它以为连你也觉得，它这份柔软是多余的。它的泪落在土里，砸出一个小坑，坑里立刻冒出一株嫩芽。<br><br>你深吸一口气，不再替它们互相翻译。你把两只手都摊开，先对着黑豹那半说一句，再转头对着白鹿这半说一句。你把宴之那句没听完的话，完完整整，念给两头兽一起听，一个字都没改。你听见自己说话的声音在图景里发闷，像隔着一层棉花。你念得很慢，像在替一个不在场的人，念一封迟到的信。念完之后，左半和右半同时安静下来。你听见风穿过裂痕，像谁终于呼出了一口气；连铁栏那边，也静了。`,
        title:'桥没搭稳', sub:'',
        body:[{t:'白鹿慢慢走回来，把头低到你手边——最难的那一步，它先走了。'}],
        opts:[{type:'event',sp:-3,log:'🦌 桥晃，SP-3',to:'t_words'}] },

      t_words:{ chapter:'第五章 · 被嚼碎的那句话', story:()=>`白鹿把一样东西交到你手里。不是实物，是一句话——黑豹吞下去的那半句，白鹿偷偷捡了回来，含在嘴里三年，已经磨得没有棱角：<b>「不是你的错。」</b>它说：「你替他说吧。我说，他不听；你说，他或许肯听。」它把额头抵在你手心上，停了一会儿，才慢慢退开。它的鼻息喷在你手心里，是暖的——暖得让你想起外头的世界还有白天。<br><br>可这四个字轻得像没有。说早了是安慰，说重了是刀；只说给一头兽听，另一头就以为你在站队。你手里握着的，是这座塔里唯一一件，两头兽都听得懂的东西；那四个字在你掌心里，沉甸甸的。<br><br>右半的塔在傍晚的光里偏黄，花上还挂着水珠，风一吹就滚落。白鹿站在你身后半步，不出声，只用眼睛看着你手里那点光。<br><br>裂痕还在念它。它在等一个人，把这四个字，说给对的地方。`,
        title:'要不要说出那句被嚼碎的话', sub:'亲和检定 · 或先把它含住',
        body:[{flav:'一句话能不能救人，不看它多重，看它落在谁听得见的时候。'}],
        opts:[
          {type:'check',attr:'cha',dc:13,advantage:()=>C().linked,mod:()=>G.twinVoice==='friend'?2:0,
            label:'【亲和】把那四个字，说给两头兽一起听',hint:()=>`亲和 1d20+亲和 vs DC 13 · 说砸了会碎成刀${G.twinVoice==='friend'?' · 朋友的名义 +2':''}`,success:'t_meet',fail:'t_none'},
          {type:'goto',to:'t_meet',ico:'🤐',label:'先不说：留到他自己肯听的时候',hint:'有些话，说早了会碎'},
          {type:'answer',ask:'你也可以亲口把那句话说出来——故事会顺着你的话推进：',placeholder:'例如：「不是你的错。你们都没错。」',
            branches:{soothe:K_SOOTHE, force:K_FORCE, flee:K_FLEE, call:K_CALL},
            route:{soothe:'t_meet', call:'t_meet', flee:'t_meet', force:'t_none', default:'t_meet'},
            react:(t,k)=>{ if(k==='force') return `「${t||'（你用力说了出来）'}」……你说得太用力了，四个字落地，变成了四块石头。<br>两头兽同时抬头——它们听成了「你们都做错了」。图景从裂痕处，开始往下掉渣。`; if(k==='flee') return `「${t||'（你把话咽了回去）'}」……你把那四个字含在嘴里，没说。<br>白鹿看了你一眼，没有催：「也行。他今天，大概还没准备好。」`; return `「${t||'（你轻轻说了出来）'}」……你把四个字说得很轻，轻到两头兽得竖起耳朵才听得清。<br>黑豹的爪子，慢慢从地里收了回来。白鹿低下头，用角轻轻抵了一下你的手。`; }}]},

      t_none:{ chapter:'结局 · 谁都没救成', story:()=>`四个字落地成刀。你说得太用力了。黑豹扑向你的向导核，白鹿用角把你顶开——两头兽同时扑上来护主，它们护的是同一个人，撞在一起，正把你夹在中间。你听见自己的向导素裂开的声音，像一块薄冰从中心散开。<br><br>你被挤出图景的时候，听见宴之在喊。他喊的不是你。裂痕在你身后合拢，合得比原来更紧。雪停了，塔里安静得能听见两头兽各自退回自己那一半的脚步声。<br><br>白塔的报告写得很好看：「潜入成功，未造成图景损伤。」只有你知道，那四个字送进去，变成了「你们都有错」。你退出图景的时候，塔里正在下第二场雪，落在你刚才站过的地方；你的向导素空了一格，那一格，你在白塔的量表上再也补不回来。<br><br>宴之醒来那天叫了一个名字，是那个人的；叫完之后，他看了你很久，像在认一个陌生人。`,
        title:'结局 · 碎', sub:'BAD ENDING',
        body:[{flav:'有些话不是不能说，是不能由外人，替他抢着说。'}],
        opts:[{type:'goto',to:'the_end',ico:'🌟',label:'查看结算',hint:''}] },

      t_meet:{ chapter:'—— 中途 · 搭档的消息 ——', chatbeat:true,
        story:()=>`图景忽然静了一下。<br><br>两头兽都退开半步，裂痕里的低语也低了下去，像有人替你把音量拧小了一格。你这才发现自己的向导素已经薄得透光，手一直在抖——你在别人的图景里站得太久，久到快忘了自己也有身体。<br><br>就在这时，外头那根线动了一下。有人在你身后很远的地方，攥着链接的另一头，指节攥得发白。你听见自己的呼吸被图景放大了，一进一出，很慢；链接那头发来的每个字，都比平时重。<br><br>你没有立刻回话，先把手心的汗，在裤子上擦干净，然后才动手。你把手按在裂痕上，能感觉到两边都在轻轻发抖——它们在等你，也像在等它们自己。你停在原地，等那半行字，完整地落进这座塔里。`,
        title:'📱 消息', sub:'任务进行中 · 搭档发来一条',
        body:[{t:()=>`搭档 <b>${C().partnerName}</b> 发来：「你在别人图景里劝架，我在外头替你守着链接。说真的……要是有一天，你心里也养了两头打架的兽，我陪你劝。」`}],
        opts:[
          {type:'answer',ask:'回他/她一句（影响好感）：',
            placeholder:'例如：「那说好了，你陪我劝。」或「有你在，我不怕分裂。」',
            branches:{soothe:K_SOOTHE, force:K_FORCE, flee:K_FLEE, call:K_CALL},
            route:{soothe:'t_decide', force:'t_decide', flee:'t_decide', call:'t_decide', default:'t_decide'},
            react:(t,k)=>{
              if(k==='call') { bumpAff(mAff(k)); return `你回：「有你在，我不怕分裂。」<br>搭档回了串乱码，半天才憋出一句：「……我也是。笨死了。」`; }
              bumpAff(mAff(k)); return `你回：「那说好了，你陪我劝。」<br>搭档发了个握拳的表情：「一言为定。专心干你的活。」`;
            }},
        ]},

      t_decide:{ chapter:'终章 · 两翼', story:()=>`裂痕中央，宴之本人终于显形——一个被撕成两半、左黑右白的少年。他望着你，眼里既没有求救，也没有绝望，只有倦：「它们都对我好。可我，快被它们扯没了。」<br><br>你走近一步，两种温度同时扑上你的脸：左边是雪，右边是春天。两头兽站在他身后，一左一右，谁都没有靠近，也谁都没有走。你忽然明白：劝和不劝分。你要做的，不是让哪头兽赢，而是让它们，重新做回他的两翼——一翼护他不受伤，一翼引他去爱人。<br><br>他站在裂痕正中，一半身子浸在黑里，一半浸在白里，两只手都空着，等你开口。他说话的时候，两头兽同时低下头，像在认错，又像在等他改口。<br><br>你手里还捏着那四个字。你知道你只有一次机会：这句话说出去，图景就会照着它长。这座塔由谁来合上，也都在你下一句话里。`,
        title:'他要你替他选', sub:'你的引导将决定结局',
        body:[{t:'宴之：「你替我做个了断吧。让哪头，留下？」'}],
        opts:[
          {type:'goto',to:'t_unite',ico:'🕊',label:'合一：让黑豹与白鹿，共做他的两翼',hint:'和解路线'},
          {type:'goto',to:'t_sleep',ico:'🌙',label:'安睡：让白鹿暂眠，留黑豹护他',hint:'守护路线'},
          {type:'goto',to:'t_split',ico:'⚖',label:'放任：由他选分裂着活，你只陪着',hint:'尊重路线'},
          {type:'goto',to:'t_seam',ico:'🧵',label:'缝上：把这道裂痕缝进你自己身上',hint:'代价路线 · 你会带伤回去'},
          {type:'goto',to:'t_tower',ico:'🏛',label:'搬走：连整座塔一起带回白塔',hint:'白塔路线 · 彻底，也冷'},
          {type:'answer',ask:'你也可以亲口对他说——故事会顺着你的话推进：',
            placeholder:'例如：「两个都要，它们是你的两翼。」或「你选，我陪你。」',
            branches:{soothe:K_SOOTHE, force:K_FORCE, flee:K_FLEE, call:K_CALL},
            route:{soothe:'t_unite', force:'t_split', flee:'t_tower', call:'t_seam', default:'t_unite'},
            react:(t,k)=>{
              if(k==='force') return `「${t||'（你由他选）'}……你没替他做主。宴之沉默良久，自己走向了分裂的那条路。」`;
              if(k==='flee') return `「${t||'（你决定搬塔）'}……你说要把他带回去。宴之看了你很久：「那你至少，别把我修得太整齐。」」`;
              if(k==='call') return `「${t||'（你要替他缝）'}」……你说这道缝由你来缝。宴之摇头，你没有听——你把自己，穿进了那道裂痕。`;
              return `「${t||'（你张开双臂）'}」……两个都要。它们是你的两翼，不是你的敌人。`;
            }},
        ]},

      t_unite:{ chapter:'结局 · 两翼', story:()=>`你张开双臂，把黑豹的怕与白鹿的求，一同拢进宴之怀里：「它们不是要分你，是要你，既不受伤，也能去爱。」<br><br>两头兽在裂痕中央缓缓相融，化成一头<b>黑纹白鹿</b>——左爪护盾，右角生花。左爪的护盾上有一道旧疤，右角的花上落着一点雪，谁也不抢谁的地方。塔的左半亮起来，右半暗下去一点，最后两边调成了同一种颜色，像雪后初晴的清晨。塔里的光慢慢平了下来，像有人终于把两只手都放下了。<br><br>宴之第一次，完整地，站直了。他试着走了两步，脚下没有裂痕，也没有回声。<br><br>他醒来的时候，眼底有了光。他先叫了一个名字——那个人的，叫得很轻，像只是确认一下：那个人是真的不在了。然后他转过头看你：「我知道该怎么活了。」`,
        title:'结局 · 合翼', sub:'BEST ENDING',
        body:[{flav:'你没杀任何一头兽，你只是，让它们都想起了——它们是同一人的两翼。'}],
        opts:[{type:'goto',to:'the_end',ico:'🌟',label:'查看结算',hint:''}] },

      t_sleep:{ chapter:'结局 · 安睡', story:()=>`你让白鹿暂眠，只留黑豹护在他身前。<br><br>你把手按在白鹿的额上，它没有挣，只是最后看了一眼右半的塔——那些花、那些藤、那片刚浇过水的春天，一层一层褪成浅灰。右半的塔随着它一起安静下来，花不再开，草也不再长高。它蜷进宴之的影子底下，睡得很乖，像一个终于被允许休息的孩子。你在它睡着的地方留了一盏很暗的灯，怕它醒来时找不到回来的路。<br><br>宴之的世界安静了，却也少了点温度——他不再被撕扯，却也暂时，不会再去爱。<br><br>黑豹卧在他脚边，警惕地望着四方。它恨自己当初没护好那个人，于是用余生，护住现在的他；它不动，像一座立着的碑。黑豹看了你一眼，什么都没说，只是把身子往宴之那边挪了挪。宴之醒来那天，先抬手在床边摸索了一下——那里是空的；然后他叫了一个名字，叫了一声，没人应，他就再没叫过。`,
        title:'结局 · 独翼', sub:'GOOD ENDING',
        body:[{flav:'有些和解急不来。先让他，不再流血，再说。'}],
        opts:[{type:'goto',to:'the_end',ico:'🌟',label:'查看结算',hint:''}] },

      t_split:{ chapter:'结局 · 分裂', story:()=>`你没有替他做主。你只是坐到他身边，看他左黑右白地，分裂着活下去。<br><br>你陪他坐了很久，久到图景里的天从白变黑、又从黑变白。两头兽各自在你身后卧下，隔着裂痕对望，谁也不肯先开口。偶尔黑豹赢，他冷硬得没人近身，说句话都像在切铁；偶尔白鹿赢，他又软得一碰就碎，会为一朵歪掉的花，难过半个小时。<br><br>但他说，这样也好：「至少，两头兽都还在。它们都没被我弄丢。」你问他累不累，他想了很久，说：「比不分裂的时候，踏实一点。」<br><br>你伸出手，他没有握。他只是把你的影子，往自己那边，挪了挪。你不知道哪一半才是他，他自己大概也不知道。他醒来那天叫了一个名字，两头兽在他耳边各叫了一声，把他的声音盖了过去。`,
        title:'结局 · 两半', sub:'NEUTRAL ENDING',
        body:[{flav:'你没治好他，你只是，没让他一个人，被撕。'}],
        opts:[{type:'goto',to:'the_end',ico:'🌟',label:'查看结算',hint:''}] },

      t_seam:{ chapter:'结局 · 缝合', story:()=>`你没有替宴之做选择，只是把裂痕的两边，用自己卷了起来。<br><br>向导素是线，你是针。你从裂痕的这一头穿到那一头——那一瞬间，图景里所有的冷、所有的舍不得、三年前山口的四十七条、他绝口不提的那个名字，全部从你身上过了一遍。你的向导素一节一节地断，断一节，缝一针；缝到第三针，你已经听不清自己的声音了。你咬着牙，没喊出声。<br><br>缝到最后半寸时，两头兽一起低下头，一左一右，替你按住了线的两端。裂痕缝上了，双生的塔合成一整座，中间那道缝，长成一条浅白的线。<br><br>你的向导核上留下了同一条线。白塔的疏导员量了三次：「这不是伤，是疤，会一直跟着你。」宴之醒来那天，先叫了一个名字——不是你的，是那个人的；叫完愣了很久，才转头看你：「……是你把我缝上的，对吗？」`,
        title:'结局 · 带伤', sub:'BITTERSWEET ENDING',
        body:[{t:()=>`三个月后你在疏导室再见到他。他看见你手背上那道浅浅的白线，什么都没问，只是替你，把门开着。`}],
        opts:[{type:'goto',to:'the_end',ico:'🌟',label:'查看结算',hint:'',onPick:()=>{const c=C(); c.sp=Math.max(1,c.sp-6); if(c.identity==='sentinel') c.overload=Math.min(100,(c.overload||0)+12);}}] },

      t_tower:{ chapter:'结局 · 移塔', story:()=>`你做了向导最不该做、也最省事的那件事——把整座塔收了。<br><br>双生塔在你向导核里缩小，左半的黑、右半的白、中间那道裂痕，一起卷成一根手指长的东西。它很轻，轻得不像装过四十七条命；它也很烫，烫得你掌心起了一层水泡。收塔的时候，两头兽都在挣：黑豹咬住你的向导素，白鹿用角抵着你的胸口。你没有停手。你把它带回白塔，交进深层疏导室。<br><br>白塔给了这单最高评价：「处置彻底，无遗留风险。」他们会在三年里一点一点拆这座塔：黑豹的怕拆成数据，白鹿的求拆成指标。<br><br>宴之从此不做噩梦，也不再做梦。他按时上班，按时吃饭，同事说他终于正常了。他醒来那天叫过一个名字，叫得很清楚，是那个人的；叫完之后，他看了一圈房间，认不出自己在哪。`,

        opts:[{type:'goto',to:'the_end',ico:'🌟',label:'查看结算',hint:'',onPick:()=>{const c=C(); c.sp=Math.max(1,c.sp-3);}}] },

      hook:'旧城区地下管网里盘踞着一只失控的精神体巢群，单支小队一旦深入便失联。白塔罕见地调动多支哨向组合，由你与搭档带队，连同其余哨兵向导协同清剿。这一仗不是赢，是一起回来——三条线，一根都不能断。'},
    start:'s_brief', first:'s_deploy',
    scenes:{
      s_brief:{ chapter:'白塔 · 联合简报', story:()=>`【系统任务简报 · 联合清剿】编号 J-09，等级 A级。<br><br>简报室的除湿机一直在响。你闻到旧纸、过热的接线板，以及一点雨水味——刚从管网回来的人，身上都带着那股味。旧城区地下管网的深处，一只失控的<b>精神体巢群</b>正在同化路过的觉醒者：先是流浪猫成群失踪，然后是一名巡夜人再没回家。单人小队一旦深入便失联，通讯在管网里像被水泡烂的纸。<br><br>白塔决定<b>多线协同</b>：你与搭档为突击核心，外围另有哨兵封锁三个出口，向导组在地面维持维稳屏障。这是本季度最大的一次联合行动——登记表上排着十九个名字，每一个后面，都要有人亲手写上「归队」。<br><br>联络官敲了敲地图：「这一仗不是一个人的。你负责凿穿，其余人负责不让你碎在外面。听清了——<b>你们的任务不是赢，是一起回来</b>。」`,

          return `地下管网的入口像一张吞光的嘴。井盖掀开时，一股又冷又闷的气顶上来，混着铁锈、积水和某种甜腥的腐败味，扑在脸上像有人拿湿布捂了你一下。${team}。<br><br>对讲里传来秦峥的声音，哑得像砂纸：「封锁组就位。」你听得见他那边风很大，还有金属卡扣一声声咬紧的动静。紧接着是阮清芜，声音很轻，却把每个人的耳朵都稳住了：「维稳组就位。下面的人，<b>呼吸放慢，跟着我的节奏走</b>。」<br><br>你按着她给的节拍吸了一口气，心跳果然慢下来。频道里有四组呼吸、四个节奏，只要有一个乱掉，你会在耳朵里先听见。<br><br>最后是搭档的频道，只说了两个字：「进吧。」`; },

      s_meet:{ chapter:'第二章 · 对表', story:()=>`集结点是巷口一辆熄了灯的指挥车，车顶还挂着没干的水珠。<b>周屿</b>把管网图摊在引擎盖上，用三枚磁钉按住了三个出口，磁钉底下压着几张没来得及收的现场照片。<br><br>「封锁组堵口。」秦峥先开口，脸上那道疤在屏幕冷光里像一条没长好的缝，「我的人只干一件事：不让任何东西出来——包括你们，如果你们被同化了。」他说完就低头去调装备，没再看任何人。<br><br>阮清芜没抬头，正往每个人的终端上贴电极，指尖凉而稳：「维稳组在地面。谁在下面崩了，喊一声，我接得住。」她把最后一枚电极按在你后颈上时，你听见自己的心跳被放大了半拍。<br><br>周屿把最后一枚磁钉推到你面前：「三条线，少一条，这一仗都不用打。你站哪条？」`,

      s_breach:{ chapter:'第三章 · 巢心', story:()=>`入口被凿开后，巢群的气息扑面而来——那是一种<b>被无数人恐惧腌渍过的味道</b>，黏、冷、带着细碎的哭腔。管壁上凝着一层灰白色的霜，像谁的眼泪被冻在了墙上。你伸手扶了一下墙，指腹立刻被黏住，扯开时留下薄薄一层皮。<br><br>你的感官瞬间被放大到刺痛：水滴声变成鼓点，自己的心跳大得像有人在颅骨里敲门，远处某个岔口的风声听起来像有人在低声数数。${C().identity==='sentinel'?'作为哨兵，过载的警报在脑子里一声声尖叫，你咬着后槽牙把它一寸寸按回去。':'作为向导，你强行张开屏障，把队友的感官一根根护住，指尖发麻，指甲掐进了掌心。'}<br><br>${C().teamMode==='squad'||C().teamMode==='pair'?`搭档 <b>${C().partnerName}</b> 立刻贴了上来：${C().identity==='sentinel'?'「向导素，接住。别咬着牙自己扛。」':'「我来，你稳住他们。」'}那只手按在你背上，隔着衣服也能感觉到温度。`:'没有人在你身后。你只能自己扛着这份刺痛，一步一步往里走，把每一次呼吸都当成功课。'}<br><br>你数着步子往里走。第三步的时候，你想起了简报上那句话——一起回来。`,

      s_blackout:{ chapter:'第三章 · 失联', story:()=>`深入第二十分钟，对讲里的水声忽然满了。<br><br>先断的是秦峥。他那句「封锁组……东口」说到一半，被什么东西拖进杂音里，最后一个字像是被水吞掉的。然后是阮清芜——你一直跟着走的那个呼吸节拍，歪了一下，没了。你下意识屏住呼吸等了三秒，频道里只剩下你自己的心跳，撞得耳膜发疼。<br><br>你把终端举高，屏上三条线一条条熄灭。通讯在管网里像被水泡烂的纸，攥一下就碎。简报里那句「一旦深入便失联」，原来是这么轻描淡写的一句话。你想起简报室里十九个名字，忽然发现你只记住了三个。<br><br>你身后只剩一个人的呼吸。面前却是三个长得一模一样的岔口，霜从每一个口子里往外吐着白气。`,

          hint:'1d20 vs DC 13 · 失败付代价',
          success:'s_cats',fail:'s_lost'}] },
      s_lost:{ chapter:'第三章 · 失联', story:()=>`你在两条看起来一样的岔道之间来回走了三趟。霜在管壁上结得厚，脚印踩上去，第二遍就认不出了；第三遍的时候，你发现自己在同一块剥落的漆皮前面停过两次。<br><br>你试着用指节敲管子，想靠回声辨方向。声音传出去，回来的却像是两声——一声快的，一声慢的。你告诉自己那是因为岔道，可后颈的汗还是顺着领口淌了下去，冰得像一条线。<br><br>等你终于撞回主岔口，冷焰棒已经烧到最后一截，光小得像一颗含着化不掉的糖。你靠着管壁喘了两口气，数了数自己的脉搏——一百二十下。你把发抖的手塞进口袋，假装它只是冷。<br><br>没人知道你耽误了这半小时——除了你自己的心跳。`,
